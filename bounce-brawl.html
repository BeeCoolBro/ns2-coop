<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bounce Brawl 2 by BeeSide Studio's: two balls fight on their own in a box. Collect 30 balls and bet coins against other players.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23ff2d78' stroke='%230f1724' stroke-width='5'/%3E%3Cpath d='M38 14l4 4-14 18-5 1 1-5z' fill='%23d5dce5' stroke='%230f1724' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M20 36l8 8M23 46l-5 5' stroke='%230f1724' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>Bounce Brawl 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
canvas:where(.pic) { width: var(--w); height: auto; }
/* Layout: the BeeSide game shell (ROTFALL 2's): a live fight plays behind a
   numbered menu on the left, the current fighter sits in a card bottom right,
   and every section opens as a full-screen panel with a Back button.
   Bounce Brawl's own colour in the family is pink. */
:root {
  --o: #ff2d78;
  --o2: #ff6a9e;
  --gold: #ffd633;
  --ink: #050506;
  --card: #0c0c0f;
  --line: #1d1d22;
  --line2: #2a2a31;
  --mute: #6b6b75;
  --dim: #44444c;
  --txt: #e6e6ec;
  --you: #4aa3ff;
  --foe: #ff4646;
  --r-C: #9aa3b2; --r-R: #4a9bff; --r-E: #b46bff; --r-L: #ffb020; --r-M: #ff3fa4;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --fd: "Bebas Neue", Impact, "Arial Narrow Bold", sans-serif;
  --fb: "Rajdhani", "Segoe UI", Arial, sans-serif;
  --fm: "Share Tech Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--txt); font: 500 15px/1.45 var(--fb); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--o); outline-offset: 2px; }
canvas { display: block; }
svg.i { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }
.coin { color: var(--gold); }
.kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; font: 400 10px/16px var(--fm); color: #777; text-align: center; letter-spacing: 0; }
.lab { font: 700 10px/1.2 var(--fb); letter-spacing: 4px; color: #55555e; text-transform: uppercase; }
.mono { font-family: var(--fm); letter-spacing: 0; }
.noise { position: fixed; inset: 0; opacity: .045; pointer-events: none; z-index: 1; background-size: 200px;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

/* ---- buttons ---- */
.btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line2); color: #8a8a94; padding: 8px 18px; border-radius: 6px; font: 400 17px/1.2 var(--fd); letter-spacing: 4px; transition: border-color .15s, color .15s, background .15s; }
.btn2:hover:not(:disabled), .btn2:focus-visible { border-color: var(--o); color: var(--o); outline: none; }
.btn2:disabled { opacity: .3; cursor: default; }
.btn2.on { border-color: var(--o); color: #fff; background: rgba(255, 45, 120, .1); }
.go { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 18px 13px; border-radius: 8px; background: var(--o); color: #16020a; font: 400 32px/1 var(--fd); letter-spacing: 6px; transition: background .15s, transform .15s var(--ease); }
.go:hover:not(:disabled) { background: var(--o2); transform: translateY(-2px); }
.go:disabled { background: #22222a; color: #55555e; cursor: default; }
.go .kbd { border-color: rgba(22, 2, 10, .35); color: rgba(22, 2, 10, .7); }
.link { color: var(--mute); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.link:hover { color: var(--o); }
.back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line2); border-radius: 6px; color: #888; font: 400 16px/1.2 var(--fd); letter-spacing: 3px; transition: all .15s; }
.back:hover, .back:focus-visible { color: var(--o); border-color: var(--o); outline: none; }

/* ---- main menu ---- */
.scr { position: fixed; inset: 0; z-index: 10; }
#menu { background: linear-gradient(90deg, rgba(5,5,6,.95) 0%, rgba(5,5,6,.78) 36%, rgba(5,5,6,.18) 66%, rgba(5,5,6,.5) 100%); }
#menu .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 66% 50%, transparent 32%, rgba(0,0,0,.7) 92%); }
.m-left { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(520px, 86vw); }
.logo-wrap { width: max-content; max-width: 100%; text-align: center; margin-bottom: 30px; }
.logo-tag, .logo-sub { font: 600 11px/1 var(--fb); color: #55555e; letter-spacing: 6px; }
.logo-tag { margin-bottom: 8px; }
.logo-sub { margin-top: 10px; }
.logo-main { font: 400 86px/.9 var(--fd); letter-spacing: 5px; color: var(--o); white-space: nowrap; }
.logo-main .two { color: var(--txt); margin-left: .16em; }
.m-nav { display: flex; flex-direction: column; gap: 2px; }
.m-item { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; text-align: left; padding: 8px 14px 8px 12px; border-radius: 8px; width: 100%;
  transition: background .25s var(--ease), transform .3s var(--ease); animation: mIn .7s var(--ease) backwards; }
.m-item:nth-child(1) { animation-delay: .05s } .m-item:nth-child(2) { animation-delay: .1s } .m-item:nth-child(3) { animation-delay: .15s } .m-item:nth-child(4) { animation-delay: .2s } .m-item:nth-child(5) { animation-delay: .25s } .m-item:nth-child(6) { animation-delay: .3s } .m-item:nth-child(7) { animation-delay: .35s }
@keyframes mIn { from { opacity: 0; transform: translateX(-24px) } }
.m-item::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 2px; border-radius: 2px; background: var(--o); transform: scaleY(0); transition: transform .3s var(--ease); }
.m-n { font: 400 12px var(--fm); color: #44444c; letter-spacing: 1px; transition: color .2s; }
.m-t { font: 400 40px/1 var(--fd); letter-spacing: 4px; color: #8a8a94; transition: color .2s, letter-spacing .3s var(--ease); }
.m-s { grid-column: 2; font: 700 11px/1.3 var(--fb); letter-spacing: 3px; color: #44444c; margin-top: 1px; text-transform: uppercase; transition: color .2s; }
.m-item:hover, .m-item.sel { background: linear-gradient(90deg, rgba(255,45,120,.1), transparent 80%); transform: translateX(6px); }
.m-item:hover::before, .m-item.sel::before { transform: scaleY(1); }
.m-item:hover .m-t, .m-item.sel .m-t { color: #fff; letter-spacing: 6px; }
.m-item:hover .m-n, .m-item.sel .m-n { color: var(--o); }
.m-item:hover .m-s, .m-item.sel .m-s { color: #94506c; }
.m-item.play .m-t { color: var(--o); }
.m-item.hot .m-t::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: 10px; vertical-align: .35em; }
.m-item.hot .m-s { color: #b39a3a; }
.m-item.play:hover .m-t, .m-item.play.sel .m-t { color: var(--o2); }
.m-item:focus-visible { outline: none; }
.m-card { position: absolute; right: max(clamp(24px, 6vw, 100px), env(safe-area-inset-right, 0px)); bottom: clamp(24px, 8vh, 90px); width: 290px; padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(160deg, rgba(26,6,15,.88), rgba(6,6,8,.88)); backdrop-filter: blur(4px); animation: mIn .8s var(--ease) .3s backwards; }
.m-card .who { display: flex; align-items: center; gap: 12px; margin: 10px 0 12px; }
.m-card .who canvas:where(.pic) { width: 64px; height: 64px; }
.m-card .nm { font: 400 28px/1 var(--fd); letter-spacing: 3px; }
.m-card .tg { font-size: 12px; color: #77777f; margin-top: 3px; font-weight: 600; }
.m-card .row { display: flex; justify-content: space-between; align-items: center; font: 700 11px/1 var(--fb); letter-spacing: 2px; color: #55555e; padding-top: 10px; border-top: 1px solid var(--line); text-transform: uppercase; }
.m-card .row + .row { border-top: 0; padding-top: 7px; }
.m-card .row b { font: 400 14px var(--fm); letter-spacing: 0; color: var(--txt); display: inline-flex; align-items: center; gap: 5px; }
.m-hint { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); bottom: 22px; font: 700 11px/1 var(--fb); letter-spacing: 3px; color: #3a3a40; display: flex; gap: 14px; align-items: center; }
.m-hint span { display: inline-flex; gap: 5px; align-items: center; }
.m-ver { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); top: 18px; font: 400 10px var(--fm); color: #3a3a40; letter-spacing: 2px; text-transform: uppercase; }
.m-top { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); top: 18px; display: flex; align-items: center; gap: 16px; z-index: 2; }
.m-online { font: 400 11px var(--fm); color: #55555e; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
#toBeeside { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px 7px 12px; border: 1px solid rgba(255,45,120,.35); border-radius: 5px; background: rgba(255,45,120,.06); color: var(--o); text-decoration: none; font: 400 17px/1 var(--fd); letter-spacing: 3px; transition: all .18s; }
#toBeeside:hover, #toBeeside:focus-visible { background: rgba(255,45,120,.14); border-color: var(--o); outline: none; }
#toBeeside[hidden] { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #3a3a40; flex: none; }
.dot.live { background: #5cff9d; }

/* ---- panels ---- */
.panel { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(ellipse at 70% 0%, rgba(70,8,34,.42), transparent 60%), var(--ink); animation: panIn .45s var(--ease); }
@keyframes panIn { from { opacity: 0; transform: translateX(40px) } }
.pan-in { max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding-block: 30px 50px;
  padding-left: max(clamp(16px, 4vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 4vw, 40px), env(safe-area-inset-right, 0px)); }
.pan-head { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; }
.pan-t { font: 400 52px/.9 var(--fd); letter-spacing: 6px; color: var(--o); }
.pan-s { font: 700 12px/1.2 var(--fb); color: #55555e; letter-spacing: 4px; margin-bottom: 6px; text-transform: uppercase; }
.pan-cash { margin-left: auto; display: flex; gap: 16px; font: 400 16px var(--fm); align-items: center; }
.pan-cash span { display: inline-flex; gap: 6px; align-items: center; }
.ptabs { display: flex; gap: 2px; width: 100%; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { position: relative; flex: none; padding: 9px 14px 8px; margin-bottom: -1px; border-bottom: 2px solid transparent; font: 400 17px/1 var(--fd); letter-spacing: 3px; color: #5d5d66; transition: color .15s, border-color .15s; }
.ptabs button:hover, .ptabs button:focus-visible { color: var(--o); outline: none; }
.ptabs button.sel { color: #fff; border-bottom-color: var(--o); }
.ptabs button.hot::after { content: ""; position: absolute; top: 6px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
/* daily */
.quest, .freec { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 8px; }
.freec { grid-template-columns: 56px minmax(0, 1fr) auto; }
.freec canvas:where(.pic) { width: 56px; height: 56px; }
.quest.done, .freec.done { border-color: #4a3d12; }
.quest.got { opacity: .45; }
.qt b { display: block; font: 400 20px/1.05 var(--fd); letter-spacing: 2px; color: #ddd; }
.qt small { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: #66666e; font-weight: 600; margin-top: 3px; }
.qp { display: grid; gap: 5px; font-size: 11px; color: #77777f; text-align: right; }
.qbar, .xpmini { display: block; height: 5px; border-radius: 3px; background: #1a1a1f; overflow: hidden; }
.qbar i, .xpmini i { display: block; height: 100%; background: var(--gold); }
.qbar.big { height: 8px; margin-top: 10px; }
.xpmini { display: inline-block; width: 60px; vertical-align: middle; margin-left: 8px; }
.plv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.plv .n { font: 400 44px/1 var(--fd); letter-spacing: 3px; color: var(--o); }
.plv .mono { font-size: 13px; color: #88888f; }
.box .note { margin: 10px 0 0; font-size: 13px; color: #77777f; }
.freegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 10px; }
.inside .more { font: 400 11px/24px var(--fm); color: #66666e; padding-left: 4px; }
.ladder { display: grid; gap: 6px; }
.rung { --c: #888; display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.rung b { font: 400 18px/1 var(--fd); letter-spacing: 3px; color: #55555e; }
.rung .mono { font-size: 12px; color: #55555e; }
.rung.past b { color: color-mix(in srgb, var(--c) 55%, #333); }
.rung.on { border-color: var(--c); }
.rung.on b { color: var(--c); }
.sec { font: 700 11px/1 var(--fb); letter-spacing: 5px; color: #55555e; margin: 26px 0 12px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec:first-child { margin-top: 0; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); }
.box + .box { margin-top: 12px; }
.box .h { font: 700 10px/1 var(--fb); letter-spacing: 4px; color: #55555e; margin-bottom: 12px; text-transform: uppercase; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #140a10, #060607 70%); }
.stage canvas { width: 100%; aspect-ratio: 1; }
.cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; pointer-events: none; }
.cap .n { font: 400 34px/1 var(--fd); letter-spacing: 5px; }
.cap .t { font-size: 13px; color: #77777f; letter-spacing: 1px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); }
.tile .l { font: 700 10px/1 var(--fb); letter-spacing: 3px; color: #55555e; text-transform: uppercase; }
.tile .v { font: 400 38px/1 var(--fd); letter-spacing: 2px; margin-top: 10px; color: #eee; }
.tile.hi .v { color: var(--o); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line2); border-radius: 7px; font: 400 15px/1.1 var(--fd); letter-spacing: 2px; color: #88888f; transition: all .15s; }
.chip:hover { border-color: #5a2238; color: #ccc; }
.chip.sel { border-color: var(--o); color: #fff; background: rgba(255,45,120,.1); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
.seg button { padding: 6px 12px; font: 400 14px/1.2 var(--fd); letter-spacing: 2px; color: #77777f; transition: all .15s; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.sel { background: rgba(255,45,120,.16); color: #fff; }
.seg button:hover:not(.sel) { color: #ccc; }
.empty { color: var(--mute); font-size: 14px; padding: 6px 2px; font-weight: 600; }

/* fight panel */
.fp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.stakes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stake { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .15s; }
.stake .v { font: 400 26px/1 var(--fd); letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
.stake .v svg { width: 15px; height: 15px; color: var(--gold); }
.stake small { font: 400 10px/1 var(--fm); color: #66666e; }
.stake:hover:not(:disabled) { border-color: #5a2238; }
.stake.sel { border-color: var(--o); background: rgba(255,45,120,.1); }
.stake.sel small { color: #c0708f; }
.stake:disabled { opacity: .3; cursor: default; }
.status { display: flex; align-items: center; gap: 8px; font: 400 12px var(--fm); color: #66666e; margin-top: 12px; }
.rank { display: grid; grid-template-columns: 54px 1fr; gap: 4px 14px; align-items: center; }
.rank canvas { grid-row: span 3; width: 54px; height: 54px; }
.rank .rn { font: 400 32px/1 var(--fd); letter-spacing: 3px; }
.rank .bar { height: 6px; border-radius: 3px; background: #1a1a1f; overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--gold); }
.rank .nx { font: 400 11px var(--fm); color: #66666e; }
.fp .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.botline { margin-top: 16px; font-size: 13px; color: #66666e; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }

/* balls */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.bc { --c: #888; position: relative; overflow: hidden; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 12px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(170deg, #0f0f12, #08080a); transition: border-color .2s, transform .2s var(--ease); }
.bc::before { content: ""; position: absolute; right: -34px; top: -34px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); pointer-events: none; }
.bc:hover { border-color: #3a1a28; transform: translateY(-2px); }
.bc.sel { border-color: var(--o); }
.bc canvas:where(.pic) { grid-row: span 3; width: 58px; height: 58px; }
.bc .n { font: 400 22px/1 var(--fd); letter-spacing: 2px; color: #ddd; }
.bc .r { font: 700 9px/1 var(--fb); letter-spacing: 3px; text-transform: uppercase; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 14px; height: 3px; border-radius: 2px; background: #26262c; }
.pips i.on { background: var(--o); }
.bc.locked { opacity: .55; }
.bc.locked canvas:where(.pic) { filter: grayscale(1) brightness(.55); }
.bc .eq { position: absolute; top: 10px; right: 10px; font: 400 10px var(--fm); color: var(--o); letter-spacing: 1px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; text-align: left; width: min(860px, 100%); }
.stat { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; margin-bottom: 9px; }
.stat span { font: 700 11px/1 var(--fb); letter-spacing: 3px; color: #66666e; text-transform: uppercase; }
.stat .bar { display: flex; gap: 3px; }
.stat .bar i { flex: 1; height: 6px; border-radius: 2px; background: #1c1c21; }
.stat .bar i.on { background: var(--o); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
.kv dt { font: 700 10px/1.8 var(--fb); letter-spacing: 3px; color: #55555e; text-transform: uppercase; }
.kv dd { margin: 0; font-weight: 600; color: #c8c8d0; }

/* crates */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.crate { --c: #888; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: linear-gradient(170deg, #0f0f12, #08080a); display: flex; flex-direction: column; gap: 12px; }
.crate::before { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%); pointer-events: none; }
.crate .top { display: flex; gap: 14px; align-items: center; }
.crate .top canvas:where(.pic) { width: 74px; height: 74px; }
.crate .n { font: 400 26px/1 var(--fd); letter-spacing: 2px; }
.crate .t { font: 700 9px/1 var(--fb); letter-spacing: 3px; margin-top: 5px; color: var(--c); text-transform: uppercase; }
.crate p { margin: 0; font-size: 13px; color: #88888f; line-height: 1.5; }
.odds { display: grid; gap: 6px; }
.odd { display: grid; grid-template-columns: 84px 1fr 38px; gap: 8px; align-items: center; font: 700 9px/1 var(--fb); letter-spacing: 2px; text-transform: uppercase; color: #66666e; }
.odd .b { height: 4px; border-radius: 2px; background: #1a1a1f; overflow: hidden; }
.odd .b i { display: block; height: 100%; }
.odd b { font: 400 11px var(--fm); color: #aaa; text-align: right; letter-spacing: 0; }
.inside { display: flex; flex-wrap: wrap; gap: 2px; }
.inside canvas:where(.pic) { width: 24px; height: 24px; }
.crate .btn2 { justify-content: space-between; }
.crate .btn2 b { font: 400 14px var(--fm); letter-spacing: 0; display: inline-flex; gap: 5px; align-items: center; color: var(--gold); }

/* players */
.pcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.prow { display: grid; grid-template-columns: 28px 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 8px; }
.prow .pos { font: 400 12px var(--fm); color: #55555e; }
.prow canvas:where(.pic) { width: 40px; height: 40px; }
.prow b { display: block; font: 400 21px/1 var(--fd); letter-spacing: 2px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow small { font-size: 12px; color: #66666e; font-weight: 600; }
.prow .tr { font: 400 14px var(--fm); display: inline-flex; gap: 5px; align-items: center; color: var(--txt); }
.prow .tr svg { color: var(--gold); }
.prow.me { border-color: #3a1a28; }

/* settings */
.st-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 8px; flex-wrap: wrap; }
.st-row .l { font: 400 19px/1.1 var(--fd); letter-spacing: 2px; color: #ccc; }
.st-row .d { font-size: 12px; color: #55555e; font-weight: 600; }
.st-row input { min-width: 0; flex: 1; max-width: 280px; background: #08080a; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; font: 400 20px var(--fd); letter-spacing: 3px; color: #fff; outline: none; }
.st-row input:focus { border-color: var(--o); }
.namebox { display: grid; gap: 10px; justify-items: center; margin-top: 10px; width: min(340px, 100%); }
.namein { width: 100%; box-sizing: border-box; background: #08080a; border: 1px solid var(--line2); border-radius: 8px; padding: 10px 14px; font: 400 26px var(--fd); letter-spacing: 4px; color: #fff; text-align: center; outline: none; }
.namein:focus { border-color: var(--o); }

/* ---- overlays (crates, matchmaking, welcome) ---- */
.ov { position: fixed; inset: 0; z-index: 60; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; text-align: center; box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 45%, rgba(30,4,15,.97), rgba(2,2,3,.985) 70%); animation: fadeIn .3s ease;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@keyframes fadeIn { from { opacity: 0 } }
.ov h2 { margin: 0; font: 400 58px/.95 var(--fd); color: var(--o); letter-spacing: 10px; }
.ov .lsub { font: 700 12px/1.4 var(--fb); color: #55555e; letter-spacing: 5px; margin: 6px 0 26px; text-transform: uppercase; }
.ov p { margin: 0 0 12px; max-width: 46ch; color: #99999f; font-size: 16px; font-weight: 500; }
.ov .foot { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
.ov .xbtn { position: absolute; top: max(18px, env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); }
.reelwrap { position: relative; width: min(820px, 100%); height: 170px; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #070708; }
.reel { position: absolute; top: 14px; left: 0; display: flex; gap: 8px; will-change: transform; }
.reel div { --r: #888; position: relative; width: 112px; height: 140px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, #111114, #0a0a0c); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; overflow: hidden; }
.reel div::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--r); }
.reel canvas:where(.pic) { width: 72px; height: 72px; }
.reel span { font: 400 15px/1 var(--fd); letter-spacing: 2px; color: #ccc; }
.marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--o); z-index: 2; }
.marker::before, .marker::after { content: ""; position: absolute; left: -7px; border: 8px solid transparent; }
.marker::before { top: 0; border-top-color: var(--o); }
.marker::after { bottom: 0; border-bottom-color: var(--o); }
.upcard { --r: #8a8a8a; position: relative; width: min(300px, 100%); padding: 26px 18px 20px; border: 1px solid var(--r); border-radius: 14px; background: linear-gradient(180deg, #0f0f12, #09090b); overflow: hidden; animation: cardIn .5s var(--spring) backwards; box-sizing: border-box; }
@keyframes cardIn { from { opacity: 0; transform: translateY(28px) scale(.9) } }
.upcard::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--r); }
.upcard canvas:where(.pic) { width: 150px; height: 150px; }
.upcard .name { font: 400 40px/1 var(--fd); letter-spacing: 4px; color: #eee; margin-top: 6px; }
.upcard .rtag { font: 700 10px/1 var(--fb); letter-spacing: 4px; color: var(--r); text-transform: uppercase; margin-top: 8px; }
.upcard .what { font: 400 20px/1.1 var(--fd); letter-spacing: 3px; color: var(--o); margin-top: 12px; }
.upcard .desc { font-size: 13px; color: #88888f; line-height: 1.55; margin-top: 8px; }
.spin { width: 120px; height: 120px; margin-bottom: 10px; }
.mmline { font: 400 12px/1.6 var(--fm); color: #66666e; margin: 0; max-width: 52ch; }

/* ---- the fight ---- */
#fight { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: radial-gradient(ellipse at 50% 0%, rgba(70,8,34,.35), transparent 55%), #030304; box-sizing: border-box;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 16px; align-items: center; max-width: 1000px; width: 100%; margin: 0 auto; }
.plate { --tc: var(--you); display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 5px 12px; align-items: center; min-width: 0; }
.plate canvas:where(.pic) { grid-row: span 2; width: 46px; height: 46px; }
.plate .top { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.plate .who { font: 400 24px/1 var(--fd); letter-spacing: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate .bn { font: 700 10px/1 var(--fb); letter-spacing: 3px; color: #66666e; white-space: nowrap; text-transform: uppercase; }
.hp { position: relative; height: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 5px; overflow: hidden; }
.hp i { position: absolute; inset: 0 auto 0 0; background: var(--tc); border-radius: 5px; transition: width .12s linear; }
.hp b { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.35); transition: width .6s ease .25s; }
.hpn { font: 400 12px var(--fm); color: #aaa; }
.plate.foe { --tc: var(--foe); grid-template-columns: minmax(0, 1fr) 46px; }
.plate.foe canvas:where(.pic) { grid-column: 2; grid-row: 1 / span 2; }
.plate.foe .top { flex-direction: row-reverse; }
.plate.foe .top, .plate.foe .hpw { grid-column: 1; grid-row: auto; }
.plate.foe .hp i, .plate.foe .hp b { inset: 0 0 0 auto; }
.plate.foe .hpw .hpn { text-align: right; }
.hpw { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.clock { font: 400 34px/1 var(--fd); letter-spacing: 4px; color: #fff; font-variant-numeric: tabular-nums; }
.mid .lab { letter-spacing: 3px; }
.mid .ot { color: var(--o); }
.mid .rule { font: 700 10px/1.2 var(--fb); letter-spacing: 3px; color: var(--gold); border: 1px solid #4a3d12; border-radius: 4px; padding: 3px 7px 2px; cursor: help; }
.mid .pot { font: 400 12px var(--fm); color: #77777f; display: inline-flex; align-items: center; gap: 5px; }
.arena { position: relative; min-height: 0; }
.arena canvas { width: 100%; height: 100%; }
.fbar { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; }
.fbar .hint { font: 700 10px/1 var(--fb); letter-spacing: 3px; color: #3a3a40; display: inline-flex; gap: 5px; align-items: center; margin-left: 10px; }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.banner div { font: 400 clamp(70px, 15vw, 150px)/.9 var(--fd); letter-spacing: .08em; color: #fff; -webkit-text-stroke: 2px #030304; paint-order: stroke fill; animation: bIn .35s var(--ease); }
.banner div.go2 { color: var(--o); }
.banner { align-content: center; }
.banner .bsub { margin: 10px 0 0; padding: 0 16px; font: 700 13px/1.4 var(--fb); letter-spacing: 3px; color: var(--gold); text-transform: uppercase; text-align: center; text-shadow: 0 1px 0 #030304, 0 0 6px #030304; }
.result .rlines { display: grid; gap: 6px; margin-top: 14px; width: min(380px, 100%); }
.result .rl { display: flex; gap: 8px; align-items: center; justify-content: center; font: 700 11px/1.3 var(--fb); letter-spacing: 3px; color: #88888f; text-transform: uppercase; }
.result .rl .mono { color: var(--gold); letter-spacing: 0; font-size: 13px; }
.result .rl .xpmini { margin: 0; }
.result .rl.up { color: var(--gold); }
.result .rl.q { color: #5cff9d; }
@keyframes bIn { from { opacity: 0; transform: scale(1.25) } }
.result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at 50% 45%, rgba(20,4,12,.86), rgba(0,0,0,.92) 70%); animation: fadeIn .3s ease; padding: 16px; box-sizing: border-box; }
.result h2 { margin: 0; font: 400 clamp(54px, 9vw, 82px)/.9 var(--fd); letter-spacing: 12px; color: var(--o); }
.result h2.lose { color: var(--foe); }
.result h2.draw { color: #ccc; }
.result .lsub { font: 700 12px/1.4 var(--fb); color: #55555e; letter-spacing: 5px; margin: 8px 0 22px; text-transform: uppercase; }
.result .tiles { width: min(380px, 100%); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); text-align: left; }
.result .tile .v { display: flex; align-items: center; gap: 8px; }
.result .tile .v svg { width: 22px; height: 22px; color: var(--gold); }
.result p { margin: 16px 0 0; color: #66666e; font-size: 13px; font-weight: 600; max-width: 42ch; }
.result .foot { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
.vs { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: 1fr 1fr; background: #030304; overflow: hidden; animation: fadeIn .25s ease; }
.vs .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center; min-width: 0; }
.vs .side.you { background: radial-gradient(ellipse at 50% 50%, rgba(74,163,255,.16), transparent 70%); border-right: 1px solid var(--line); }
.vs .side.foe { background: radial-gradient(ellipse at 50% 50%, rgba(255,70,70,.16), transparent 70%); }
.vs .side canvas:where(.pic) { width: min(200px, 34vw); height: min(200px, 34vw); animation: cardIn .6s var(--spring) backwards; }
.vs .side .lab { letter-spacing: 5px; }
.vs .side .who { font: 400 clamp(30px, 5vw, 52px)/.95 var(--fd); letter-spacing: 4px; overflow-wrap: anywhere; }
.vs .side .bn { font: 700 12px/1 var(--fb); letter-spacing: 4px; color: #77777f; text-transform: uppercase; }
.vs .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 400 clamp(80px, 13vw, 150px)/1 var(--fd); color: var(--o); letter-spacing: 6px; -webkit-text-stroke: 3px #030304; paint-order: stroke fill; }
.vs .vrule { display: block; width: 100%; font: 700 12px/1.4 var(--fb); letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
.vs .potline { flex-wrap: wrap; padding: 0 16px; box-sizing: border-box; position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; font: 400 14px var(--fm); color: #99999f; display: flex; justify-content: center; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: #0c0c0f; border: 1px solid var(--o); color: var(--txt); padding: 10px 18px; border-radius: 8px; font-weight: 600; max-width: calc(100% - 40px); box-sizing: border-box; text-align: center; animation: fadeIn .2s ease; }

@media (max-width: 860px) {
  .fp, .detail, .pcols { grid-template-columns: minmax(0, 1fr); }
  .quest { grid-template-columns: minmax(0, 1fr) auto; }
  .quest .qp { grid-column: 1 / -1; grid-row: 2; }
  .fp .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #menu { overflow-y: auto; background: rgba(5,5,6,.82); }
  .m-left { position: relative; left: auto; top: auto; transform: none; width: auto; padding: 64px max(20px, env(safe-area-inset-right, 0px)) 16px max(20px, env(safe-area-inset-left, 0px)); }
  .logo-wrap { margin: 0 auto 22px; }
  .logo-main { font-size: 66px; letter-spacing: 3px; }
  .logo-tag, .logo-sub { letter-spacing: 4px; font-size: 10px; }
  .m-t { font-size: 32px; }
  .m-card { position: relative; right: auto; bottom: auto; width: auto; margin: 8px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
  .m-hint, .m-ver { display: none; }
  .sec { letter-spacing: 3px; }
  .m-top { left: max(20px, env(safe-area-inset-left, 0px)); top: 14px; }
  .pan-t { font-size: 42px; }
  .pan-cash { margin-left: 0; width: 100%; }
  .plate { grid-template-columns: 34px minmax(0, 1fr); gap: 4px 8px; }
  .plate.foe { grid-template-columns: minmax(0, 1fr) 34px; }
  .plate canvas:where(.pic) { width: 34px; height: 34px; }
  .plate .who { font-size: 18px; }
  .plate .bn, .fbar .hint { display: none; }
  .clock { font-size: 26px; }
  .vs { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .vs .side.you { border-right: 0; border-bottom: 1px solid var(--line); }
  .ov h2 { font-size: 44px; letter-spacing: 6px; }
}
@media (max-width: 420px) { .logo-main { font-size: 54px; } .stake .v { font-size: 21px; } .go { font-size: 26px; letter-spacing: 4px; } }
@media (prefers-reduced-motion: reduce) { .m-item, .m-card, .panel, .upcard, .banner div { animation: none; } .hp i, .hp b { transition: none; } }
/* ---- motion: the intro, screen changes, crates, the VS screen and results ---- */
@keyframes rise { from { opacity: 0; transform: translateY(14px) } }
@keyframes ring { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.9); opacity: 0 } }
@keyframes spin { to { transform: rotate(360deg) } }
.btn2, .chip, .back { transition: border-color .15s, color .15s, background .15s, transform .12s var(--ease); }
.btn2:active:not(:disabled), .chip:active, .back:active, .stake:active:not(:disabled), .ptabs button:active, .m-item:active { transform: scale(.96); }
/* opening the game */
#intro { position: fixed; inset: 0; z-index: 90; background: #030304; display: grid; place-items: center; align-content: center; gap: 22px; pointer-events: none; animation: introOut .5s var(--ease) 1.25s forwards; }
#intro.skip { animation: introOut .2s ease forwards; }
@keyframes introOut { to { opacity: 0; visibility: hidden } }
#intro .ib { position: relative; width: 200px; height: 34px; }
#intro .ib i { position: absolute; top: 0; width: 34px; height: 34px; border-radius: 50%; box-sizing: border-box; border: 3px solid #030304; }
#intro .ib i:nth-child(1) { left: 0; background: var(--you); animation: ibL .9s forwards; }
#intro .ib i:nth-child(2) { right: 0; background: var(--foe); animation: ibR .9s forwards; }
#intro .ib b { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; border-radius: 50%; border: 3px solid var(--o); opacity: 0; animation: ring .5s var(--ease) .42s forwards; }
@keyframes ibL { 0% { transform: translateX(-40px); opacity: 0; animation-timing-function: cubic-bezier(.5,0,.9,.5) } 47% { transform: translateX(66px); opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.3,1) } 100% { transform: translateX(28px) } }
@keyframes ibR { 0% { transform: translateX(40px); opacity: 0; animation-timing-function: cubic-bezier(.5,0,.9,.5) } 47% { transform: translateX(-66px); opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.3,1) } 100% { transform: translateX(-28px) } }
#intro .it { font: 400 54px/1 var(--fd); letter-spacing: 8px; color: var(--o); animation: itIn .6s var(--ease) .45s backwards; white-space: nowrap; }
#intro .it span { color: var(--txt); }
@keyframes itIn { from { opacity: 0; letter-spacing: 26px; transform: translateY(8px) } }
#bg { transition: opacity .5s ease; }
#bg.fade, body.pre #bg { opacity: 0; }
.logo-tag { animation: rise .6s var(--ease) .05s backwards; }
.logo-main { animation: logoIn .8s var(--ease) .1s backwards; }
.logo-sub { animation: rise .6s var(--ease) .3s backwards; }
.m-top, .m-hint, .m-ver { animation: fadeIn .8s ease .5s backwards; }
@keyframes logoIn { from { opacity: 0; transform: translateY(18px); letter-spacing: 16px } }
body.pre #menu *, body.pre #menu { animation-play-state: paused !important; }
/* panels: slide in from the side you are moving towards, items rise in turn */
.panel { animation-name: panIn2; }
@keyframes panIn2 { from { opacity: 0; transform: translateX(var(--dx, 40px)) } 40% { opacity: 1 } }
.panel.out { animation: panOut .22s ease forwards; pointer-events: none; }
.panel.under { animation: none; pointer-events: none; }
@keyframes panOut { to { opacity: 0; transform: translateX(-30px) } }
.stg { animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 32ms + 90ms); }
/* sheets */
.ov > * { animation: rise .45s var(--ease) backwards; }
.ov > :nth-child(2) { animation-delay: .04s } .ov > :nth-child(3) { animation-delay: .08s } .ov > :nth-child(4) { animation-delay: .12s } .ov > :nth-child(5) { animation-delay: .16s } .ov > :nth-child(6) { animation-delay: .2s } .ov > :nth-child(7) { animation-delay: .24s }
.ov.closing { animation: ovOut .2s ease forwards; pointer-events: none; }
@keyframes ovOut { to { opacity: 0; transform: scale(.985) } }
.toast { animation: toastIn .35s var(--ease); }
.toast.out { animation: toastOut .25s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px) } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px) } }
[data-coins].bump, [data-tro].bump { display: inline-block; animation: bump .35s var(--ease); }
@keyframes bump { 40% { transform: scale(1.18); color: var(--gold) } }
/* crates: the crate shakes, bursts, and the reel rolls out */
.cpop { --c: #888; position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
.cpop canvas:where(.pic) { width: 180px; height: 180px; animation: cshake 1s ease-in forwards; }
@keyframes cshake { 0% { transform: scale(.5); opacity: 0 } 14% { transform: scale(1.06); opacity: 1 } 24% { transform: scale(1) } 38% { transform: rotate(-3deg) } 48% { transform: rotate(3deg) } 58% { transform: rotate(-5deg) translateY(-2px) } 68% { transform: rotate(6deg) } 77% { transform: rotate(-8deg) translateY(-5px) } 86% { transform: rotate(9deg) } 94% { transform: rotate(-10deg) scale(1.06) } 100% { transform: scale(1.12) } }
.cpop.burst canvas:where(.pic) { animation: cburst .3s var(--ease) forwards; }
@keyframes cburst { to { transform: scale(1.7); opacity: 0 } }
.cpop.burst::before, .cpop.burst::after { content: ""; position: absolute; inset: 30px; border-radius: 50%; border: 3px solid var(--c); animation: ring .5s var(--ease) forwards; }
.cpop.burst::after { border-color: #fff; border-width: 2px; animation-delay: .06s; opacity: 0; }
.reelwrap { animation: reelIn .45s var(--ease) backwards; }
@keyframes reelIn { from { opacity: 0; transform: scaleY(.5) } }
.reel div { transition: transform .16s var(--ease), opacity .35s ease, border-color .3s; }
.reel div.on { transform: scale(1.05); border-color: #3a3a44; }

<script>

// ===== core: deterministic maths ==========================================
// A fight is played out from a seed, separately in each player's browser, so
// the simulation may only use + - * / and sqrt (the same in every engine):
// no Math.sin/cos/atan2/hypot/pow/exp, no Math.random, no clocks.
const VERSION = 6;
const HP_SCALE = 0.33;                     // every ball's health is scaled by this, so fights end sooner
const TAU = 6.283185307179586, PI = 3.141592653589793, HALF_PI = 1.5707963267948966;
const DT = 1 / 60, SUB = 3;            // 60 steps a second, 3 physics substeps each
const ARENA = 600;                    // the box is ARENA x ARENA units
const GRAV = 0;                        // units/s^2 downward pull on balls: zero gravity, they float
const HUNT = 170;                      // units/s^2, each ball is drawn toward the other
const VMIN = 300, VMAX = 1250;         // every ball keeps moving, nothing runs away
const OT_START = 45, OT_SHRINK = 30, OT_MIN = 0.56; // overtime: the box closes to 56%
const OT_DMG = 60;                     // ...and from 60 s all damage keeps rising
const T_LIMIT = 120;                   // after this, most HP left (as a share) wins
const MAXLVL = 7;

function dsin(x) {
  x -= TAU * Math.floor(x / TAU + 0.5);
  if (x > HALF_PI) x = PI - x; else if (x < -HALF_PI) x = -PI - x;
  const x2 = x * x;
  return x * (1 - x2 / 6 * (1 - x2 / 20 * (1 - x2 / 42 * (1 - x2 / 72 * (1 - x2 / 110 * (1 - x2 / 156))))));
}
function dcos(x) { return dsin(x + HALF_PI); }

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function vlen(x, y) { return Math.sqrt(x * x + y * y); }
// squared distance from a point to a segment
function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + dx * t - px, qy = ay + dy * t - py;
  return qx * qx + qy * qy;
}
function cross3(ax, ay, bx, by, cx, cy) { return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
// squared distance between two segments given as [x0,y0,x1,y1]
function segSeg2(a, b) {
  const d1 = cross3(a[0], a[1], a[2], a[3], b[0], b[1]), d2 = cross3(a[0], a[1], a[2], a[3], b[2], b[3]);
  const d3 = cross3(b[0], b[1], b[2], b[3], a[0], a[1]), d4 = cross3(b[0], b[1], b[2], b[3], a[2], a[3]);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return 0;
  return Math.min(segDist2(a[0], a[1], b[0], b[1], b[2], b[3]), segDist2(a[2], a[3], b[0], b[1], b[2], b[3]),
                  segDist2(b[0], b[1], a[0], a[1], a[2], a[3]), segDist2(b[2], b[3], a[0], a[1], a[2], a[3]));
}
function rotv(x, y, a) { const c = dcos(a), s = dsin(a); return [x * c - y * s, x * s + y * c]; }

// ===== the fight simulation ==============================================
// S.F = the two fighters (side 0 and side 1), S.bodies = fighters + drones,
// S.projs = projectiles, S.hz = hazards (fire, bombs, holes, walls, zones...).
// S.ev collects what happened this step for the renderer (sounds, numbers).
const BALL = {};                         // id -> ball definition (filled below)
const DOT = { burn: 1, poison: 1, drain: 1, hole: 1, regen: 1, zone: 1 };
// the box rules: one is picked for every fight from its seed
const RULES = {
  normal:  { name: 'Classic', desc: 'No twist. Just the box.' },
  tiny:    { name: 'Tiny Box', desc: 'The box is a lot smaller.' },
  speed:   { name: 'Turbo', desc: 'Everything moves 30% faster.' },
  heavy:   { name: 'Heavy Hitters', desc: 'All damage is 35% higher.' },
  bumpers: { name: 'Bumpers', desc: 'Four bumpers fling balls around.' },
  giant:   { name: 'Big Balls', desc: 'Both balls are 25% bigger.' },
  gravity: { name: 'Gravity On', desc: 'Things fall down for once.' },
  shrink:  { name: 'Closing In', desc: 'The walls start closing at 10 seconds.' },
  chaos:   { name: 'Chaos', desc: 'Every 3 seconds both balls get shoved.' },
};
const RULE_BAG = ['normal', 'normal', 'normal', 'tiny', 'speed', 'heavy', 'bumpers', 'giant', 'gravity', 'shrink', 'chaos'];
const PAINT_N = 12;                      // the painter's floor grid is 12 x 12

function canMove(S, b) { return b.alive && S.tstop[b.side] <= 0 && b.st.frozenT <= 0; }
function stuck(S, b) { return !canMove(S, b) || b.st.rootT > 0; }
function rate(S, b) {                    // how fast its abilities and weapons run
  if (!canMove(S, b) || b.st.stunT > 0) return 0;
  return b.st.slowT > 0 ? 0.55 : 1;
}
function tangible(b) { return b.alive && b.st.phaseT <= 0; }
function emit(S, e) { if (S.keep) S.ev.push(e); }
function mkSt() {
  return { burnT: 0, burnBy: null, poison: 0, poisonBy: null, pdecay: 0, frozenT: 0, stunT: 0, phaseT: 0, slowT: 0,
    rootT: 0, charmT: 0, confuseT: 0, blindT: 0, weakT: 0, vulnT: 0, slamT: 0, slamBy: null, slamDmg: 0 };
}

function newFight(o) {
  const S = { t: 0, n: 0, rng: rng(o.seed >>> 0), nid: 1, bodies: [], F: [], projs: [], hz: [], ev: [],
    keep: !!o.keepEv, over: false, winner: -2, box: { x0: 0, y0: 0, x1: ARENA, y1: ARENA }, ot: 1, tstop: [0, 0],
    half0: ARENA / 2, vmul: 1, dmul: 1, grav: GRAV, otStart: OT_START, rmul: 1, paint: null };
  // the box rule comes from the seed through its own generator, so it never shifts the fight's own dice
  const rr = rng(hashStr('rule:' + (o.seed >>> 0)));
  S.rule = RULES[o.rule] ? o.rule : RULE_BAG[Math.floor(rr() * RULE_BAG.length)];
  if (S.rule === 'tiny') S.half0 = ARENA * 0.39;
  else if (S.rule === 'speed') S.vmul = 1.3;
  else if (S.rule === 'heavy') S.dmul = 1.35;
  else if (S.rule === 'giant') S.rmul = 1.25;
  else if (S.rule === 'gravity') S.grav = 330;
  else if (S.rule === 'shrink') S.otStart = 10;
  const c = ARENA / 2, h = S.half0;
  S.box = { x0: c - h, y0: c - h, x1: c + h, y1: c + h };
  const a = S.rng() * TAU, sp = 520, j = (S.rng() - 0.5) * 0.12;
  const f0 = mkFighter(S, 0, o.a, c - h * 0.42, c - h * 0.24, dcos(a) * sp, dsin(a) * sp);
  const f1 = mkFighter(S, 1, o.b, c + h * 0.42, c - h * 0.24, -dcos(a + j) * sp, dsin(a + j) * sp);
  f0.foe = f1; f1.foe = f0;
  if (S.rule === 'bumpers') for (const [x, y] of [[c - 150, c - 150], [c + 150, c - 150], [c - 150, c + 150], [c + 150, c + 150]])
    S.hz.push({ k: 'bumper', side: -1, owner: null, alive: true, cd: {}, x, y, r: 26, life: 1e9, push: 760, dmg: 2 });
  for (const f of S.F) if (f.def.init) f.def.init(S, f);
  return S;
}

function mkFighter(S, side, pick, x, y, vx, vy) {
  const d = BALL[pick.id] || BALL.sword, L = clamp(pick.lvl | 0, 1, MAXLVL);
  const hpMul = 1 + 0.07 * (L - 1), dmgMul = 1 + 0.05 * (L - 1);
  const r = (d.r || 40) * S.rmul, hp = (d.hp || 100) * hpMul * HP_SCALE;
  const r0 = d.r || 40;
  const f = { id: S.nid++, side, main: true, def: d, lvl: L, hpMul, dmgMul, x, y, vx, vy, r, r0: r, m: (d.m || r0 * r0 / 1600) * S.rmul * S.rmul,
    hp, maxHp: hp, armor: d.armor || 0, marmor: d.marmor || 0, contact: d.contact || 1, alive: true, shield: 0,
    wep: [], cd: {}, st: mkSt(), pc: {}, hits: 0, dotAcc: 0, healAcc: 0, u: {}, foe: null };
  addWeapons(S, f, d.weapons);
  S.bodies.push(f); S.F.push(f);
  return f;
}
function addWeapons(S, f, list) {
  for (const w of list || []) {
    const n = w.n || 1, a = S.rng() * TAU;
    for (let i = 0; i < n; i++) f.wep.push(mkWeapon(S, f, w, a + i * TAU / n));
  }
}

const POINTW = { orb: 1, saw: 1, gear: 1, moon: 1, guard: 1 };   // weapons that are a ball on a stick, hit only at the end
function mkWeapon(S, f, w, a) {
  if (a === undefined) a = S.rng() * TAU;
  const ang = f.side ? PI - a : a;
  const o = { k: w.kind, def: w, ang, dir: f.side ? -1 : 1, spin: w.spin || 0, len: w.len, head: POINTW[w.kind] ? 0 : (w.head || (w.len - f.r * 0.8)),
    w: w.w, dmg: w.dmg, knock: w.knock || 200, hcd: {}, cc: 0, cap: [0, 0, 0, 0], hx: 0, hy: 0, hvx: 0, hvy: 0 };
  if (w.kind === 'flail') { o.hx = f.x + dcos(ang) * w.len; o.hy = f.y + dsin(ang) * w.len; }
  wcap(f, o);
  return o;
}

// the weapon's hitting part as a segment (a capsule with radius w/2)
function wcap(f, w) {
  const c = w.cap;
  if (w.k === 'flail') { c[0] = c[2] = w.hx; c[1] = c[3] = w.hy; return; }
  const ux = dcos(w.ang), uy = dsin(w.ang);
  if (w.k === 'shield' || w.k === 'racket') {      // a curved plate, hit-tested as its chord
    const px = f.x + ux * w.len, py = f.y + uy * w.len, hl = w.len * dsin((w.def.arc || 1.2) * 0.5);
    c[0] = px + uy * hl; c[1] = py - ux * hl; c[2] = px - uy * hl; c[3] = py + ux * hl;
    return;
  }
  const a = w.len - w.head;
  c[0] = f.x + ux * a; c[1] = f.y + uy * a; c[2] = f.x + ux * w.len; c[3] = f.y + uy * w.len;
}

// ---- damage and healing -------------------------------------------------
function hurt(S, src, t, amt, kind, x, y) {
  if (!t.alive || t.st.phaseT > 0 || !(amt > 0)) return 0;
  let a = amt * S.ot * S.dmul;
  if (src) {
    if (src.st && src.st.charmT > 0) return 0;          // charmed: it can't bring itself to hurt anyone
    a *= src.dmgMul;
    if (src.st && src.st.weakT > 0) a *= 0.65;
    if (src.def && src.def.dmgMod) a *= src.def.dmgMod(S, src, t, kind);
  }
  if (t.st.frozenT > 0) a *= 1.3;
  if (t.st.vulnT > 0) a *= 1.3;
  a *= 1 - t.armor;
  if (kind === 'melee' || kind === 'contact') a *= 1 - t.marmor;
  if (t.def && t.def.takeMod) a *= t.def.takeMod(S, t, src, kind);
  if (!(a > 0)) return 0;
  if (t.shield > 0) {
    const s = Math.min(t.shield, a);
    t.shield -= s; a -= s;
    emit(S, { e: 'shieldhit', id: t.id, x: t.x, y: t.y });
    if (a <= 0) return 0;
  }
  t.hp -= a;
  if (DOT[kind]) {
    t.dotAcc += a;
    if (t.dotAcc >= 1) { const n = Math.floor(t.dotAcc); t.dotAcc -= n; emit(S, { e: 'hit', id: t.id, x: t.x, y: t.y, a: n, k: kind }); }
  } else emit(S, { e: 'hit', id: t.id, x: x === undefined ? t.x : x, y: y === undefined ? t.y : y, a: Math.max(1, Math.round(a)), k: kind });
  if (t.def && t.def.onHurt) t.def.onHurt(S, t, src, a, kind);
  if (src && src.def && src.def.onDeal) src.def.onDeal(S, src, t, a, kind);
  if (t.hp <= 0 && t.alive) {
    if (t.main && t.def.revive && !t.u.revived) {         // back from the dead, once
      t.u.revived = true; t.hp = t.maxHp * t.def.revive; t.dotAcc = 0;
      t.st.burnT = 0; t.st.poison = 0;
      emit(S, { e: 'revive', id: t.id, x: t.x, y: t.y, k: t.def.id });
      if (t.def.onRevive) t.def.onRevive(S, t);
    } else { t.hp = 0; t.alive = false; emit(S, { e: t.main ? 'ko' : 'pop', id: t.id, x: t.x, y: t.y, side: t.side }); }
  }
  return a;
}
function heal(S, f, a) {
  if (!f.alive || !(a > 0)) return;
  const h = Math.min(a, f.maxHp - f.hp);

    if ((p.life -= dt) <= 0) {

      if (p.blast && p.fuse) { aoe(S, p.owner, p.x, p.y, p.blast, p.bdmg, 300, 0); emit(S, { e: 'boom', x: p.x, y: p.y, r: p.blast }); }
      continue;
    }
    const tgt = p.owner.foe;
    if (p.ret && p.age > p.ret) {        // a boomerang on its way back
      if (!p.back) { p.back = 1; p.hit = {}; }
      steerProj(p, p.owner, dt, 7);
      if (toward(p, p.owner)[2] < p.owner.r + p.r) { p.alive = false; continue; }
    } else if (p.home && tgt && tangible(tgt)) steerProj(p, tgt, dt);
    if (p.acc) {
      const sp = vlen(p.vx, p.vy) || 1, ns = Math.min(p.max, sp + p.acc * dt);
      p.vx *= ns / sp; p.vy *= ns / sp;
    }
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
    if (p.grav) p.vy += S.grav * dt;
    const ox = p.x, oy = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    let out = 0;
    if (p.x - p.r < x.x0) { p.x = x.x0 + p.r; p.vx = Math.abs(p.vx); out = 1; }
    else if (p.x + p.r > x.x1) { p.x = x.x1 - p.r; p.vx = -Math.abs(p.vx); out = 1; }
    if (p.y - p.r < x.y0) { p.y = x.y0 + p.r; p.vy = Math.abs(p.vy); out = 1; }
    else if (p.y + p.r > x.y1) { p.y = x.y1 - p.r; p.vy = -Math.abs(p.vy); out = 1; }
    if (out) {
      if (p.bounce > 0 || p.ret) { if (p.bounce > 0) p.bounce--; emit(S, { e: 'pbounce', k: p.k, x: p.x, y: p.y }); }
      else {
        p.alive = false;
        if (p.blast) { aoe(S, p.owner, p.x, p.y, p.blast, p.bdmg, 220, 0); emit(S, { e: 'boom', x: p.x, y: p.y, r: p.blast, small: 1 }); }
        else emit(S, { e: 'poof', k: p.k, x: p.x, y: p.y });
        continue;
      }
    }
    if (blockedByWeapons(S, p)) continue;
    for (const t of S.bodies) {
      if (t.side === p.side || !tangible(t) || p.hit[t.id]) continue;
      const rr = t.r + p.r;
      if (segDist2(t.x, t.y, ox, oy, p.x, p.y) > rr * rr) continue;
      projHit(S, p, t);
      if (!p.alive || p.side === t.side) break;   // gone, or sent back by a mirror
    }
  }
}

// ---- hazards --------------------------------------------------------------
function rayToBox(S, ox, oy, dx, dy) {
  const x = S.box; let t = 1e9;
  if (dx > 1e-9) t = Math.min(t, (x.x1 - ox) / dx); else if (dx < -1e-9) t = Math.min(t, (x.x0 - ox) / dx);
  if (dy > 1e-9) t = Math.min(t, (x.y1 - oy) / dy); else if (dy < -1e-9) t = Math.min(t, (x.y0 - oy) / dy);
  return [ox + dx * t, oy + dy * t];
}
function inside(z, t, extra) { const dx = t.x - z.x, dy = t.y - z.y, rr = z.r + t.r + (extra || 0); return dx * dx + dy * dy <= rr * rr; }

function hzStep(S, dt) {
  for (const z of S.hz) {
    if (!z.alive) continue;
    const held = z.side >= 0 && S.tstop[z.side] > 0, o = z.owner;
    if (z.k === 'fire' || z.k === 'puddle') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || !inside(z, t)) continue;
        if (z.k === 'fire') burn(t, o, 1.4);
        else if ((z.cd[t.id] || 0) <= S.t) { z.cd[t.id] = S.t + 0.5; poison(t, o, 1); }
      }
    } else if (z.k === 'bomb') {
      if (!held) z.fuse -= dt;
      if (z.fuse <= 0) { z.alive = false; aoe(S, o, z.x, z.y, z.r, z.dmg, z.knock, 0); emit(S, { e: 'boom', x: z.x, y: z.y, r: z.r, big: z.r > 200 ? 1 : 0 }); }
    } else if (z.k === 'strike') {
      if (!held) z.tele -= dt;
      if (z.tele <= 0) {
        z.alive = false;
        for (const t of S.bodies) {
          if (t.side === z.side || !tangible(t) || !inside(z, t)) continue;
          hurt(S, o, t, z.dmg, 'bolt', t.x, t.y);
          if (t.alive) t.st.stunT = Math.max(t.st.stunT, z.stun === undefined ? 0.3 : z.stun);
          if (z.fx) applyFx(S, o, t, z.fx);
        }
        if (z.after) hazard(S, o, z.after.k, Object.assign({ x: z.x, y: z.y }, z.after));
        emit(S, { e: z.look === 'meteor' ? 'boom' : 'bolt', x: z.x, y: z.y, r: z.r });
      }
    } else if (z.k === 'laser') {
      if (!z.fired) {
        if (!o.alive) { z.alive = false; continue; }
        if (!held) z.ch -= dt;
        z.x0 = o.x; z.y0 = o.y;
        if (z.ch > (z.lock || 0.15) && o.foe && !held) {
          const [ex, ey] = toward(o, o.foe);
          z.dx += (ex - z.dx) * 0.16; z.dy += (ey - z.dy) * 0.16;
          const l = vlen(z.dx, z.dy) || 1; z.dx /= l; z.dy /= l;
        }
        const [x1, y1] = rayToBox(S, z.x0, z.y0, z.dx, z.dy); z.x1 = x1; z.y1 = y1;
        if (z.ch <= 0) {
          z.fired = true; z.life = 0.24;
          for (const t of S.bodies) {
            if (t.side === z.side || !tangible(t)) continue;
            const rr = t.r + (z.thick || 24);
            if (segDist2(t.x, t.y, z.x0, z.y0, x1, y1) > rr * rr) continue;
            hurt(S, o, t, z.dmg, 'beam', t.x, t.y);
            if (z.fx) applyFx(S, o, t, z.fx);
            if (canMove(S, t)) { t.vx += z.dx * 260 / t.m; t.vy += z.dy * 260 / t.m; }
          }
          emit(S, { e: 'beam', x0: z.x0, y0: z.y0, x1, y1, look: z.look });
        }
      } else if ((z.life -= dt) <= 0) z.alive = false;
    } else if (z.k === 'hole') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      const sgn = z.push ? -1 : 1;        // a white hole pushes instead
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t)) continue;
        const dx = z.x - t.x, dy = z.y - t.y, d = vlen(dx, dy) || 1;
        if (d > z.R) continue;
        if (canMove(S, t)) { const a = sgn * 2200 * (1 - d / z.R); t.vx += dx / d * a * dt; t.vy += dy / d * a * dt; }
        if (d < z.core + t.r) hurt(S, o, t, z.dps * dt, 'hole');
      }
      for (const p of S.projs) {
        if (p.side === z.side || !p.alive) continue;
        const dx = z.x - p.x, dy = z.y - p.y, d = vlen(dx, dy) || 1;
        if (d > z.R) continue;
        if (!z.push && d < z.core * 0.6) { p.alive = false; emit(S, { e: 'poof', k: p.k, x: p.x, y: p.y }); continue; }
        const a = sgn * 2600 * (1 - d / z.R); p.vx += dx / d * a * dt; p.vy += dy / d * a * dt;
      }
    } else if (z.k === 'zone') {        // clouds, webs, spores, auras, tornadoes
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      if (z.follow === 'owner' && o.alive) { z.x = o.x; z.y = o.y; }
      else if (z.follow === 'foe' && o.foe) { const [ux, uy, d] = toward(z, o.foe); if (d > 4) { z.x += ux * z.spd * dt; z.y += uy * z.spd * dt; } }
      else if (z.vx || z.vy) {
        z.x += z.vx * dt; z.y += z.vy * dt;
        const b = S.box;
        if (z.x < b.x0 + z.r * 0.5 || z.x > b.x1 - z.r * 0.5) { z.vx = -z.vx; z.x = clamp(z.x, b.x0 + z.r * 0.5, b.x1 - z.r * 0.5); }
        if (z.y < b.y0 + z.r * 0.5 || z.y > b.y1 - z.r * 0.5) { z.vy = -z.vy; z.y = clamp(z.y, b.y0 + z.r * 0.5, b.y1 - z.r * 0.5); }
      }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || !inside(z, t)) continue;
        if (z.dps) hurt(S, o, t, z.dps * dt, 'zone');
        if (z.fx && (z.cd[t.id] || 0) <= S.t) { z.cd[t.id] = S.t + (z.every || 0.5); applyFx(S, o, t, z.fx); }
        if ((z.pull || z.spin) && canMove(S, t)) {
          const dx = z.x - t.x, dy = z.y - t.y, d = vlen(dx, dy) || 1;
          if (z.pull) { t.vx += dx / d * z.pull * dt; t.vy += dy / d * z.pull * dt; }
          if (z.spin) { t.vx += -dy / d * z.spin * dt; t.vy += dx / d * z.spin * dt; }
        }
      }
      if (z.heal && o.alive && inside(z, o, -o.r)) heal(S, o, z.heal * dt);
    } else if (z.k === 'wall') {
      if ((z.life -= dt) <= 0) z.alive = false;
    } else if (z.k === 'bumper') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || !inside(z, t)) continue;
        let [nx, ny, d] = toward(z, t);
        t.x = z.x + nx * (z.r + t.r); t.y = z.y + ny * (z.r + t.r);
        if (canMove(S, t)) { const vn = t.vx * nx + t.vy * ny; if (vn < 0) { t.vx -= 2 * vn * nx; t.vy -= 2 * vn * ny; } t.vx += nx * z.push; t.vy += ny * z.push; }
        if ((z.cd[t.id] || 0) <= S.t) { z.cd[t.id] = S.t + 0.4; if (z.dmg) hurt(S, o, t, z.dmg, 'bumper', t.x, t.y); z.flash = S.t; emit(S, { e: 'bumper', x: z.x, y: z.y }); }
      }
    } else if (z.k === 'mine') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      if ((z.arm -= dt) > 0) continue;
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || !inside(z, t)) continue;
        z.alive = false; aoe(S, o, z.x, z.y, z.blast, z.dmg, 520, 0); emit(S, { e: 'boom', x: z.x, y: z.y, r: z.blast, small: 1 });
        if (z.fx) for (const u of S.bodies) if (u.side !== z.side && tangible(u) && toward(z, u)[2] < z.blast + u.r) applyFx(S, o, u, z.fx);
        break;
      }
    } else if (z.k === 'peel') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || !inside(z, t) || !canMove(S, t)) continue;
        const a = S.rng() * TAU;
        t.vx = dcos(a) * 950; t.vy = dsin(a) * 950; t.st.stunT = Math.max(t.st.stunT, 0.45);
        hurt(S, o, t, z.dmg, 'slip', t.x, t.y);
        z.alive = false; emit(S, { e: 'slip', x: t.x, y: t.y });
        break;
      }
    } else if (z.k === 'wave') {        // a wall of water across the whole box
      z.x += z.dir * z.spd * dt;
      const b = S.box;
      if (z.x < b.x0 - 60 || z.x > b.x1 + 60) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t) || Math.abs(t.x - z.x) > z.w * 0.5 + t.r) continue;
        if (canMove(S, t)) t.vx += z.dir * 2600 * dt;
        if (!z.cd[t.id]) { z.cd[t.id] = 1; hurt(S, o, t, z.dmg, 'wave', t.x, t.y); }
      }
    } else if (z.k === 'fx') {          // only something to look at
      if ((z.life -= dt) <= 0) z.alive = false;
    }
  }
}

// the painter's floor: whose colour each square is
function paintAt(S, x, y) { const n = PAINT_N, c = Math.floor(clamp(x / ARENA, 0, 0.999) * n), r = Math.floor(clamp(y / ARENA, 0, 0.999) * n); return r * n + c; }

// ---- one step of the fight ---------------------------------------------
function step(S) {
  if (S.over) return;
  const dt = DT;
  S.t += dt; S.n++;
  if (!S.keep) S.ev.length = 0;
  const k = clamp((S.t - S.otStart) / OT_SHRINK, 0, 1), half = S.half0 * (1 - (1 - OT_MIN) * k);
  S.box.x0 = S.box.y0 = ARENA * 0.5 - half; S.box.x1 = S.box.y1 = ARENA * 0.5 + half;
  S.ot = S.t > OT_DMG ? 1 + (S.t - OT_DMG) * 0.04 : 1;
  for (let s = 0; s < 2; s++) if (S.tstop[s] > 0) S.tstop[s] -= dt;
  if (S.rule === 'chaos' && Math.floor(S.t / 3) !== Math.floor((S.t - dt) / 3)) {
    for (const f of S.F) if (canMove(S, f)) { const a = S.rng() * TAU; f.vx += dcos(a) * 700; f.vy += dsin(a) * 700; }
    emit(S, { e: 'chaos' });
  }
  for (const b of S.bodies) {
    if (!b.alive) continue;
    tickStatus(S, b, dt);
    if (!b.main && (b.life -= dt) <= 0 && b.alive) { b.alive = false; emit(S, { e: 'pop', id: b.id, x: b.x, y: b.y }); }
  }
  for (const f of S.F) {
    if (!f.alive) continue;
    const r = rate(S, f);
    if (r > 0 && f.def.update) f.def.update(S, f, dt * r);
    if (f.def.always) f.def.always(S, f, dt);
  }
  const h = dt / SUB;
  for (let i = 0; i < SUB; i++) physics(S, h);
  projStep(S, dt);
  hzStep(S, dt);
  const vmin = VMIN * S.vmul, vmax = VMAX * S.vmul;
  for (const f of S.F) {
    if (stuck(S, f)) continue;
    const sp = vlen(f.vx, f.vy), lo = f.u.vmin || vmin, hi = f.u.vmax || vmax;
    if (sp < lo) { if (sp < 1) { f.vx = lo; f.vy = 0; } else { f.vx *= lo / sp; f.vy *= lo / sp; } }
    else if (sp > hi) { f.vx *= hi / sp; f.vy *= hi / sp; }
  }
  if (S.projs.some(p => !p.alive)) S.projs = S.projs.filter(p => p.alive);
  if (S.hz.some(z => !z.alive)) S.hz = S.hz.filter(z => z.alive);
  if (S.bodies.some(b => !b.alive && !b.main)) S.bodies = S.bodies.filter(b => b.alive || b.main);
  const [a, b] = S.F;
  if (!a.alive || !b.alive || S.t >= T_LIMIT) {
    S.over = true;
    if (!a.alive && !b.alive) S.winner = -1;
    else if (!a.alive) S.winner = 1;
    else if (!b.alive) S.winner = 0;
    else { const fa = a.hp / a.maxHp, fb = b.hp / b.maxHp; S.winner = Math.abs(fa - fb) < 0.005 ? -1 : fa > fb ? 0 : 1; }
    emit(S, { e: 'end', w: S.winner });
  }
}

function fightHash(S) { return hashStr(S.winner + ':' + S.n + ':' + S.F.map(f => Math.round(f.hp * 1000)).join(',')).toString(36); }
// play a whole fight at once (for checks and balance runs)
function runFight(o, maxSteps) {
  const S = newFight(o), lim = maxSteps || T_LIMIT * 60 + 5;
  while (!S.over && S.n < lim) step(S);
  return S;
}

  if ((f.cd[key] -= dt) <= 0) { f.cd[key] += period; return true; }

}

const HYDRA_HEAD = { kind: 'head', len: 96, head: 30, w: 24, dmg: 4, spin: 3.4, knock: 240 };
function brush(S, x, y, r, side) {      // paint every floor square within r of a point
  const n = PAINT_N, cs = ARENA / n;
  for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {
    const cx = (gx + 0.5) * cs, cy = (gy + 0.5) * cs, dx = cx - x, dy = cy - y;
    if (dx * dx + dy * dy <= r * r) S.paint[gy * n + gx] = side + 1;
  }
}
function wallAcross(S, f, at, len, life, hidden) {   // a wall across the line between the two balls
  const t = f.foe, [ux, uy, d] = toward(f, t), cx = f.x + ux * d * at, cy = f.y + uy * d * at;
  return hazard(S, f, 'wall', { x0: cx - uy * len / 2, y0: cy + ux * len / 2, x1: cx + uy * len / 2, y1: cy - ux * len / 2, w: 14, life, hidden: !!hidden });
}
function dashAt(S, f, t, sp, secs) {
  const [ux, uy] = toward(f, t);
  if (!canMove(S, f)) return;
  f.vx = ux * sp; f.vy = uy * sp; f.u.dash = secs;
}

// ===== Season 2: 100 more balls =============================================
// Built from the same parts as the rest (weapons, shots, zones, minions and the
// hooks), so the fight stays deterministic: randomness only from S.rng.
function fire(S, f, k, sp, o, n, spread) {
  const [ux, uy] = lead(S, f, f.foe, sp);
  f.u.aim = [ux, uy];
  n = n || 1;
  for (let i = 0; i < n; i++) {
    const a = n > 1 ? (i - (n - 1) / 2) * (spread || 0.2) : 0;
    const [vx, vy] = a ? rotv(ux, uy, a) : [ux, uy];
    proj(S, f, k, f.x + vx * (f.r + 6), f.y + vy * (f.r + 6), vx * sp, vy * sp, Object.assign({}, o));
  }
}
function fireRing(S, f, k, sp, n, o) {
  let ux = 1, uy = 0;
  if (S.rng) [ux, uy] = rotv(1, 0, S.rng() * TAU);
  for (let i = 0; i < n; i++) {
    proj(S, f, k, f.x + ux * (f.r + 6), f.y + uy * (f.r + 6), ux * sp, uy * sp, Object.assign({}, o));
    [ux, uy] = rotv(ux, uy, TAU / n);
  }
}
// a ring of force out from the ball: damage, push and an optional status
function pulse(S, f, R, dmg, knock, fx, col) {
  if (dmg || knock) aoe(S, f, f.x, f.y, R, dmg, knock, 0, 'blast');
  if (fx) for (const t of S.bodies) if (t.side !== f.side && tangible(t) && toward(f, t)[2] < R + t.r) applyFx(S, f, t, fx);
  emit(S, { e: 'pulse2', x: f.x, y: f.y, r: R, col: col || '#ffffff' });
}
function pullTo(S, f, t, sp) { if (!canMove(S, t)) return; const [ux, uy] = toward(t, f); t.vx = ux * sp; t.vy = uy * sp; }
function warpTo(S, b, x, y) {
  const [cx, cy] = inBox(S, x, y, b.r + 4);
  emit(S, { e: 'swap', x0: b.x, y0: b.y, x1: cx, y1: cy });
  b.x = cx; b.y = cy;
}
function zap(S, f, t, dmg, fx) {
  hurt(S, f, t, dmg, 'zap', t.x, t.y);
  if (fx) applyFx(S, f, t, fx);
  emit(S, { e: 'zap', x0: f.x, y0: f.y, x1: t.x, y1: t.y });
}
function inMine(S, f, look) { for (const z of S.hz) if (z.owner === f && z.alive && z.look === look && inside(z, f)) return true; return false; }
function countHz(S, f, look) { let n = 0; for (const z of S.hz) if (z.owner === f && z.alive && z.look === look) n++; return n; }
const shooter = (k, sp, per, o, n, spread, range) => function (S, f, dt) {
  f.u.aim = lead(S, f, f.foe, sp);
  if (every(f, 'shot', dt, per) && (!range || toward(f, f.foe)[2] < range)) fire(S, f, k, sp, o, n, spread);
};

function bzPool() { return BALLS.filter(b => b.rar === 'M' && !b.boss && b.id !== 'copycat'); }
// the spin: drops the last power (its weapons, timers and state) and takes a new one, like Copycat does
function beezapRoll(S, f) {
  const pool = bzPool(), d = pool[Math.floor(S.rng() * pool.length)], str = BZ_STR[Math.floor(S.rng() * BZ_STR.length)];
  const me = BALL.beezap, mul = 1 + str / 100;
  f.wep = []; f.u = {}; f.cd = {};
  f.def = Object.assign({}, d, { id: me.id, name: me.name, col: me.col, rar: me.rar, cat: me.cat, special: 1, hidden: 1, upright: 1, copied: d.id,
    dmgMod: d.dmgMod ? (S2, f2, t, k) => mul * d.dmgMod(S2, f2, t, k) : () => mul,
    always: d.always ? (S2, f2, dt) => { d.always(S2, f2, dt); bzCheck(S2, f2); } : bzCheck });
  f.contact = d.contact || 1; f.armor = d.armor || 0; f.marmor = d.marmor || 0;
  addWeapons(S, f, d.weapons);
  if (d.init) d.init(S, f);
  f.bz.pow = d.id; f.bz.str = str;

}
function bzCheck(S, f) {
  if (!f.alive || f.bz.next <= 0 || f.hp > f.maxHp * f.bz.next) return;
  f.bz.next = (Math.ceil(f.hp / f.maxHp * 5) - 1) / 5;   // a big hit past two marks still spins once
  beezapRoll(S, f);
}

function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, k) {
  let [r, g, b] = rgbOf(hex);
  if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
