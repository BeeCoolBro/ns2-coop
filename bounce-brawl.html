  if (!friendly && G.coins < stake) { cancelMatch(); toast('Not enough coins for that stake'); return; }
  MM.match = { mid, peer: p.peer };
  clearInterval(MM.timer);
  NET.set({ st: 'm', mid, vs: p.peer, want: p.peer });
  if (MM.sheet) { const s = MM.sheet.s; MM.sheet = null; s.onclose = null; closeSheet(s); }
  const foe = Object.assign(safePick(pr), { name: NET.nameFor(p.by, pr.nick), tro: +pr.tro || 0 });
  const mine = { id: G.eq, lvl: lvlOf(G.eq), name: NET.nameFor(null, myNick()) };
  const mySide = me < p.peer ? 0 : 1;
  showVs(mine, foe, stake, friendly, () => {
    // both sides must have moved into the fight; otherwise go back to searching
    const q = NET.peers.find(x => x.peer === p.peer);
    if (!q || !q.presence || q.presence.mid !== mid) {
      MM.match = null;
      toast('The other player left. Searching again.');
      NET.set({ st: 'idle', mid: null, vs: null, want: null });
      findMatch(MM.stake);
      return false;
    }
    startFight({ mode: friendly ? 'friendly' : 'pvp', seed: hashStr(mid), mySide, me: mine, foe, stake, mid, peer: p.peer });
    return true;
  });
}
function showVs(me, foe, stake, friendly, go) {
  const el = h('div', { class: 'vs' },
    h('div', { class: 'side you' }, h('div', { class: 'lab', text: 'You' }), ballImg(me.id, 200, ''), h('div', { class: 'who', text: me.name.toUpperCase() }), h('div', { class: 'bn', text: `${BALL[me.id].name} · LV ${me.lvl}` })),
    h('div', { class: 'side foe' }, h('div', { class: 'lab', text: 'Opponent' }), ballImg(foe.id, 200, ''), h('div', { class: 'who', text: foe.name.toUpperCase() }), h('div', { class: 'bn', text: `${BALL[foe.id].name} · LV ${foe.lvl}` })),
    h('div', { class: 'mark', text: 'VS' }),
    h('div', { class: 'potline', html: friendly ? 'FRIENDLY MATCH' : 'POT ' + COIN_SVG + ' ' + fmt(stake * 2) }));
  document.body.append(el);
  SFX.clang();
  let tries = 0;
  const attempt = () => {
    tries++;
    const q = NET.peers.find(x => x.peer === (MM.match && MM.match.peer));
    const ready = q && q.presence && q.presence.mid === (MM.match && MM.match.mid);
    if (!ready && tries < 12) { setTimeout(attempt, 400); return; }
    el.remove();
    go();
  };
  setTimeout(attempt, 2200);
}
// once both players have posted a result, make sure they agree
function checkPending() {
  if (!PENDING) return;
  if (Date.now() > PENDING.until) { PENDING = null; return; }
  const p = NET.peers.find(x => x.peer === PENDING.peer);
  const r = p && p.presence && p.presence.res;
  if (!r || r.mid !== PENDING.mid) return;
  if (r.h !== 'quit' && (r.w !== PENDING.w || r.h !== PENDING.h)) {
    // the two browsers disagree about the fight: undo it and return the stake
    G.coins += -(PENDING.coins || 0); G.tro -= PENDING.tro || 0;
    if (PENDING.w === -1) G.d--; else if (PENDING.w === PENDING.mySide) G.w--; else G.l--;
    save();
    toast('The two games disagreed about that fight, so it was cancelled and your stake returned.', 5000);
  }
  PENDING = null;
}

// ---- on BeeSide's site: the lobby is the server's /bb socket ------------------------
// It speaks the same calls as the artifact's room (presence, peers, onPeers),
// so the matchmaking above runs unchanged. The server hands every game's
// presence to the others; it never sees or runs a fight.
function WsRoom(url) {
  const others = new Map(), fns = [], uid = myUid();
  let ws = null, me = null, mine = {}, arr = [], wait = 1000;
  const build = () => {
    arr = (me ? [{ peer: me, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine, updatedAt: Date.now() }] : [])
      .concat([...others.values()].map(o => ({ peer: o.peer, by: null, isMe: !!(o.p.uid && o.p.uid === uid), sameTab: false, kind: 'viewer', guest: false, presence: o.p, updatedAt: o.at })));
    for (const f of fns) f({ peers: arr, joined: [], left: [], updated: [] });
  };
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { again(); return; }
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (!m || typeof m !== 'object') return;
      if (m.t === 'hello' && typeof m.id === 'string') {
        me = m.id; others.clear(); wait = 1000;
        for (const o of Array.isArray(m.peers) ? m.peers : []) if (o && typeof o.peer === 'string') others.set(o.peer, { peer: o.peer, p: o.p || {}, at: Date.now() });
        send({ t: 'p', p: mine });
        build();
      } else if (m.t === 'p' && typeof m.peer === 'string') { others.set(m.peer, { peer: m.peer, p: m.p && typeof m.p === 'object' ? m.p : {}, at: Date.now() }); build(); }
      else if (m.t === 'bye' && typeof m.peer === 'string') { others.delete(m.peer); build(); }
    };
    ws.onclose = () => { me = null; others.clear(); build(); again(); };
  }
  function again() { setTimeout(connect, wait); wait = Math.min(wait * 2, 30000); }
  setInterval(() => send({ t: 'ping' }), 20000);
  connect();
  return {
    presence(patch) { const v = Object.assign({}, mine, patch); for (const k in patch) if (patch[k] === null) delete v[k]; mine = v; send({ t: 'p', p: patch }); build(); return Promise.resolve(); },
    peers: () => arr,
    onPeers(fn) { fns.push(fn); setTimeout(() => fn({ peers: arr, joined: arr, left: [], updated: [] }), 0); return () => {}; },
    connected: () => !!(ws && ws.readyState === 1 && me),
  };
}
// the leaderboard: trophies from fights both players' games agreed on, kept by the server
let boardT = 0;
function fetchBoard() {
  if (!ON_SITE) return;
  clearTimeout(boardT);
  fetch('/api/brawl', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !Array.isArray(j.board)) return;
    NET.board = j.board.map(r => ({ id: String(r.id || ''), nick: r.name, tro: r.tro, w: r.w, l: r.l, ball: r.ball, lvl: r.lvl }));
    if (TAB === 'players' && !FIGHT) refreshLive();
  }).catch(() => {});
  boardT = setTimeout(fetchBoard, TAB === 'players' ? 20000 : 90000);
}

// ---- for testing in plain browser tabs: a stand-in room over BroadcastChannel ------
function LocalRoom() {
  const bc = new BroadcastChannel('bouncebrawl-local'), mine = { v: {} }, others = new Map(), fns = [];
  const myPeer = 'p' + Math.random().toString(36).slice(2, 10);
  let arr = [];
  const rebuild = () => { arr = [{ peer: myPeer, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine.v, updatedAt: Date.now() }, ...others.values()]; for (const f of fns) f({ peers: arr, joined: [], left: [], updated: [] }); };
  bc.onmessage = e => {
    const m = e.data;
    if (m.t === 'p') { others.set(m.peer, { peer: m.peer, by: null, isMe: !!Q.get('same'), sameTab: false, kind: 'viewer', guest: false, presence: m.p, updatedAt: Date.now(), seen: Date.now() }); rebuild(); }
    else if (m.t === 'bye') { others.delete(m.peer); rebuild(); }
  };
  setInterval(() => {
    bc.postMessage({ t: 'p', peer: myPeer, p: mine.v });
    const now = Date.now(); let ch = false;
    for (const [k, v] of others) if (now - v.seen > 4000) { others.delete(k); ch = true; }
    if (ch) rebuild();
  }, 600);
  addEventListener('pagehide', () => bc.postMessage({ t: 'bye', peer: myPeer }));
  rebuild();
  return {
    presence(patch) { const v = Object.assign({}, mine.v, patch); for (const k in patch) if (patch[k] === null) delete v[k]; mine.v = v; bc.postMessage({ t: 'p', peer: myPeer, p: v }); rebuild(); return Promise.resolve(); },
    peers: () => arr,
    onPeers(fn) { fns.push(fn); setTimeout(() => fn({ peers: arr, joined: arr, left: [], updated: [] }), 0); return () => {}; },
    connected: () => true,
  };
}

async function netInit() {
  if (Q.get('local')) { NET.room = LocalRoom(); NET.local = true; }
  else if (ON_SITE) {
    NET.room = WsRoom((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/bb');
    NET.uid = myUid().slice(0, 8);
    fetchBoard();
  }
  else if (window.claude && window.claude.use) {
    const safe = p => p.then(x => x, () => null);
    const [room, user, db] = await Promise.all([safe(claude.use('room')), safe(claude.use('user')), safe(claude.use('db'))]);
    NET.room = room; NET.user = user; NET.db = db;
  }
  NET.tried = true;
  if (NET.user) { try { NET.uid = await NET.user.id(); } catch (e) {} }
  if (NET.room) {
    NET.room.onPeers(ch => {
      NET.peers = ch.peers;
      resolveNames();
      if (MM.active) mmTick();
      checkPending();
      if (!FIGHT) refreshLive();
    }, () => { NET.room = null; refreshLive(); });
    NET.pushPresence();
  }
  if (NET.db && NET.uid) {
    try {
      const snap = await NET.db.doc('data/users/' + NET.uid + '/save').get();
      if (snap.exists) {
        const r = JSON.parse(snap.data().g);
        if (r && r.v === 1 && (r.t || 0) > (G.t || 0)) {
          G = Object.assign(freshSave(), r); applySettings(); save(); renderView();
          const w = document.getElementById('welcome'); if (w && G.starter) closeSheet(w);
        }
      }
    } catch (e) {}
    try {
      NET.db.collection('board').orderBy('tro', 'desc').limit(20).onSnapshot(s => {
        NET.board = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
        resolveNames();
        if (TAB === 'players' && !FIGHT) refreshLive();
      }, () => {});
    } catch (e) {}
  }
  refreshLive();
}
// redraw the parts of the page that show who is online, without losing scroll
let liveT = 0;
function refreshLive() {
  clearTimeout(liveT);
  liveT = setTimeout(() => {
    if (FIGHT) return;
    renderOnline();
    if (document.querySelector('.ov')) return;
    if (TAB === 'players') renderPanel(true);
    else if (TAB === 'fight') {
      const st = document.getElementById('fstatus'), btn = document.querySelector('.panel .go');
      if (st) st.replaceChildren(...statusBits(G.coins < STAKES[0]));
      if (btn) btn.disabled = G.coins < STAKES[0] || !NET.room;
    }
  }, 250);
}
async function resolveNames() {
  if (!NET.user) return;
  const ids = new Set();
  for (const p of NET.peers) if (p.by) ids.add(p.by);
  for (const r of NET.board) ids.add(r.id);
  if (NET.uid) ids.add(NET.uid);
  if (!ids.size) return;
  try {
    const ps = await NET.user.profiles([...ids]);
    let changed = false;
    for (const id in ps) { const n = ps[id].name || ''; if (n && NET.names[id] !== n) { NET.names[id] = n; changed = true; } }
    if (changed) refreshLive();
  } catch (e) {}
}

// ---- start up -----------------------------------------------------------------
function applySettings() { SFX.sfx = G.sfx; SFX.music = G.music; }
let lastFrame = 0;
function loop(ts) {
  const dt = Math.min(0.05, lastFrame ? (ts - lastFrame) / 1000 : 0.016);
  lastFrame = ts;
  if (FIGHT) fightFrame(FIGHT, dt);
  bgTick(dt);
  for (const p of [...PREVIEWS]) p.tick(dt);
  if (MM.sheet) spinDraw(MM.sheet.spin, ts / 1000);
  requestAnimationFrame(loop);
}
function boot() {
  applySettings();
  const wake = () => { SFX.resume(); if (G.music) MUSIC.play(FIGHT ? 'fight' : 'menu'); };
  addEventListener('pointerdown', wake, { once: true });
  addEventListener('keydown', wake, { once: true });
  addEventListener('keydown', onKey);
  // the way back to BeeSide, except inside Bee's Vault (#bv=1), which has its own close button
  if ((ON_SITE || window.BS_ROUTE) && !/(^|[#&])bv=1(&|$)/.test(location.hash)) $('#toBeeside').hidden = false;
  setTab('menu');
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in ICON) delete ICON[k]; for (const k in CRATE_ICON) delete CRATE_ICON[k]; if (!FIGHT) renderView(); });
  if (!G.starter) setTimeout(welcome, 300);
  netInit();
}

// hooks for automated tests
window.BB = {
  get G() { return G; }, get net() { return NET; }, get fight() { return FIGHT; }, get mm() { return MM; },
  bot: (id, lvl) => { if (id) { G.owned[id] = G.owned[id] || { lvl: lvl || 1, copies: 0 }; G.eq = id; } botFight(); return !!FIGHT; },
  skip: skipFight,
  run(secs) { const F = FIGHT; if (!F) return null; F.phase = 'run'; showBanner(F, ''); const end = F.S.t + secs; while (F.S.t < end && !F.S.over) { step(F.S); F.arena.events(F.S); F.arena.step(DT); } F.arena.draw(F.S, F.S.t); updatePlates(F); return { t: F.S.t, hp: F.S.F.map(f => Math.ceil(f.hp)), over: F.S.over }; },
  finish() { const F = FIGHT; if (!F) return null; skipFight(); fightFrame(F, 0.016); F.pt = 2; fightFrame(F, 0.016); return { winner: F.S.winner, coins: G.coins, tro: G.tro }; },
  crate(id) { const cr = CRATES.find(c => c.id === id) || STARTER; if (cr === STARTER) openCrate(STARTER, true); else buyCrate(cr); },
  coins(n) { G.coins = n; save(); renderView(); },
  give(id, lvl) { G.owned[id] = { lvl: lvl || 1, copies: 0 }; if (!G.eq) G.eq = id; G.starter = true; save(); renderView(); },
  tab: setTab, find: findMatch, cancel: cancelMatch, ball: openBall,
};

boot();
