    for (let i = 0; i < 3; i++) {
      c.beginPath(); c.arc(0, 0, 9 + i * 8, i * 2.1, i * 2.1 + 2.6); c.strokeStyle = i === 1 ? '#ffffff' : k.l; c.stroke();
    }
    c.lineCap = 'butt';
  },
  blackhole(c, k, f, t) {
    const ring = (front) => {
      c.save(); c.rotate(-0.45);
      c.beginPath(); c.ellipse(0, 0, 36, 11, 0, front ? 0 : PI, front ? PI : TAU);
      c.lineWidth = 6; c.strokeStyle = '#ff9a3c'; c.stroke();
      c.lineWidth = 2; c.strokeStyle = '#ffe1a8'; c.stroke();
      c.restore();
    };
    ring(false);
    circ(c, 0, 0, 16); c.fillStyle = '#000000'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#ffb35c'; c.stroke();
    ring(true);
    for (let i = 0; i < 5; i++) { const a = t * 0.6 + i * 1.3; circ(c, Math.cos(a) * (24 + i * 2), Math.sin(a) * (20 - i), 1.3); c.fillStyle = '#ffffff'; c.fill(); }
  },
  clock(c, k) {
    circ(c, 0, 0, 32); inkFill(c, '#fbf6e6', 2);
    for (let i = 0; i < 12; i++) {
      c.save(); c.rotate(i * TAU / 12);
      c.fillStyle = INK; c.fillRect(-1.2, -30, 2.4, i % 3 ? 4 : 8);
      c.restore();
    }
    circ(c, 0, 0, 3.5); c.fillStyle = INK; c.fill();
  },
  dummy(c, k) {
    c.lineWidth = 3; c.strokeStyle = '#e5484d';
    circ(c, 0, 0, 22); c.stroke(); circ(c, 0, 0, 10); c.stroke();
    c.lineWidth = 2; c.strokeStyle = k.d;
    c.beginPath(); c.moveTo(-30, -30); c.lineTo(30, 30); c.moveTo(30, -30); c.lineTo(-30, 30); c.globalAlpha *= 0.4; c.stroke();
  },
};

// details that stick out past the outline (drawn before the ball)
const ART_OUT = {
  spikes(c, k, f) {
    const off = f ? f.u.off || 0 : 0;
    for (let i = 0; i < 8; i++) {
      const a = off + i * TAU / 8 + TAU / 16, ca = Math.cos(a), sa = Math.sin(a);
      poly(c, [ca * 36 - sa * 7, sa * 36 + ca * 7, ca * 50, sa * 50, ca * 36 + sa * 7, sa * 36 - ca * 7]);
      inkFill(c, shade(k.col, 0.35), 2);
    }
  },
  thorns(c, k) {
    for (let i = 0; i < 14; i++) {
      const a = i * TAU / 14, ca = Math.cos(a), sa = Math.sin(a);
      poly(c, [ca * 37 - sa * 4, sa * 37 + ca * 4, ca * 47, sa * 47, ca * 37 + sa * 4, sa * 37 - ca * 4]);
      inkFill(c, '#f4efe6', 1.5);
    }
  },
  balloon(c, k) {
    c.beginPath(); c.moveTo(0, 40); c.quadraticCurveTo(-9, 56, 3, 66); c.lineWidth = 1.5; c.strokeStyle = INK; c.stroke();
    poly(c, [0, 37, 6, 46, -6, 46]); inkFill(c, shade(k.col, -0.15), 1.5);
  },
  bomb(c, k, f, t) {
    rrect(c, -9, -47, 18, 10, 2); inkFill(c, STEEL_D, 2);
    c.beginPath(); c.moveTo(0, -47); c.quadraticCurveTo(6, -60, 16, -58); c.lineWidth = 3; c.strokeStyle = '#c9a26b'; c.stroke();
    const s = 1 + 0.35 * Math.sin(t * 30);
    c.save(); c.translate(16, -58); c.scale(s, s);
    const p = [];
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, r = i % 2 ? 2.5 : 7; p.push(Math.cos(a) * r, Math.sin(a) * r); }
    poly(c, p); c.fillStyle = '#ffd166'; c.fill();
    circ(c, 0, 0, 2.2); c.fillStyle = '#ffffff'; c.fill();
    c.restore();
  },
  missile(c, k) {
    for (const s of [-1, 1]) {
      rrect(c, s * 38 - 6, -12, 12, 24, 4); inkFill(c, shade(k.col, -0.3), 2);
      circ(c, s * 38, -6, 3); c.fillStyle = INK; c.fill();
      circ(c, s * 38, 5, 3); c.fill();
    }
  },
  vampire(c, k) {
    for (const s of [-1, 1]) {
      c.beginPath(); c.moveTo(s * 30, -22); c.lineTo(s * 50, -36); c.lineTo(s * 46, -24); c.lineTo(s * 56, -22); c.lineTo(s * 44, -12); c.closePath();
      inkFill(c, INK, 1);
    }
  },
};

function artKit(def) {
  const col = def.col, light = lum(col) > 0.62;
  return { col, d: shade(col, -0.45), l: light ? shade(col, -0.25) : shade(col, 0.55), e: light ? shade(col, -0.55) : shade(col, 0.6) };
}
const KITS = {};
function kitOf(def) { return KITS[def.id] || (KITS[def.id] = artKit(def)); }

// a ball: body, shading, its emblem, outline. f = live fighter (or null for icons)
function drawBall(c, def, x, y, r, f, t) {
  const k = kitOf(def), s = r / 40;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (ART_OUT[def.id]) ART_OUT[def.id](c, k, f, t);
  circ(c, 0, 0, 40); c.fillStyle = def.col; c.fill();
  c.save(); circ(c, 0, 0, 40); c.clip();
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(-40, -40, 80, 80);
  circ(c, -4.5, -5.5, 39.5); c.fillStyle = def.col; c.fill();
  if (ART[def.id]) { c.save(); ART[def.id](c, k, f, t); c.restore(); }
  c.beginPath(); c.ellipse(-17, -21, 9, 5, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.28)'; c.fill();
  c.restore();
  circ(c, 0, 0, 40); c.lineWidth = 3.2; c.strokeStyle = INK; c.stroke();
  circ(c, 0, 0, 42.3); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.17)'; c.stroke();   // a light rim, for the dark floor
  c.restore();
}

// icons for menus, cached per ball and size
const ICON = {};
function ballIcon(id, px) {
  const key = id + '@' + px;
  if (ICON[key]) return ICON[key];
  const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cv.height = Math.round(px * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const def = BALL[id], out = ART_OUT[id] ? 0.66 : 0.86;
  drawBall(c, def, px / 2, px / 2 + (id === 'balloon' ? -px * 0.06 : id === 'bomb' ? px * 0.06 : 0), px / 2 * out, null, 0);
  return (ICON[key] = cv.toDataURL());
}

// ---- weapons ------------------------------------------------------------------
function drawWeapon(c, f, w, t) {
  const w2 = WEAPON2[w.def.look || w.k];
  if (w2) { w2(c, f, w, t); return; }
  const ux = Math.cos(w.ang), uy = Math.sin(w.ang), r = f.r;
  if (w.k === 'flail') {
    const n = 9;
    for (let i = 1; i < n; i++) {
      const q = i / n, x = f.x + (w.hx - f.x) * q, y = f.y + (w.hy - f.y) * q;
      if (Math.hypot(x - f.x, y - f.y) < r) continue;
      circ(c, x, y, 3.4); c.fillStyle = STEEL_D; c.fill(); c.lineWidth = 1.2; c.strokeStyle = INK; c.stroke();
    }
    const hr = w.w * 0.5;
    c.save(); c.translate(w.hx, w.hy); c.rotate(t * 6 * w.dir);
    const p = [];
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16, rr = i % 2 ? hr * 0.72 : hr * 1.08; p.push(Math.cos(a) * rr, Math.sin(a) * rr); }
    poly(c, p); inkFill(c, STEEL_D, 2);
    circ(c, 0, 0, hr * 0.66); inkFill(c, STEEL, 2);
    circ(c, -hr * 0.2, -hr * 0.22, hr * 0.18); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    c.restore();
    return;
  }
  c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
  const L = w.len;
  switch (w.k) {
    case 'blade': {
      rrect(c, r - 10, -3.5, 20, 7, 2); inkFill(c, WOOD, 1.8);
      rrect(c, r + 8, -12, 6, 24, 2); inkFill(c, GOLD, 1.8);
      poly(c, [r + 14, -6, L - 12, -5, L, 0, L - 12, 5, r + 14, 6]); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(r + 16, 0); c.lineTo(L - 8, 0); c.lineWidth = 1.4; c.strokeStyle = STEEL_D; c.stroke();
      break;
    }
    case 'dagger': {
      rrect(c, r - 8, -3, 14, 6, 2); inkFill(c, INK, 1);
      rrect(c, r + 5, -9, 5, 18, 2); inkFill(c, kitOf(f.def).d, 1.6);
      c.beginPath(); c.moveTo(r + 10, -6); c.quadraticCurveTo(L - 14, -8, L, 1); c.quadraticCurveTo(L - 16, 6, r + 10, 6); c.closePath(); inkFill(c, STEEL, 1.8);
      break;
    }
    case 'axe': {
      rrect(c, r * 0.4, -4, L - r * 0.4 + 4, 8, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head, wd = w.w * 0.5 + 8;
      c.beginPath(); c.moveTo(h0 + 4, 3); c.lineTo(L - 2, 3); c.quadraticCurveTo(L + 10, wd, L - 6, wd + 8);
      c.quadraticCurveTo(h0 + 10, wd - 2, h0 - 2, wd + 10); c.quadraticCurveTo(h0 - 6, 14, h0 + 4, 3); c.closePath();
      c.save(); c.scale(1, -w.dir); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(L - 3, wd + 4); c.quadraticCurveTo(h0 + 8, wd + 1, h0 + 1, wd + 7); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      rrect(c, L - 10, -6, 12, 12, 2); inkFill(c, STEEL_D, 1.8);
      break;
    }
    case 'spear': {
      rrect(c, r * 0.4, -3, L - r * 0.4 - w.head + 6, 6, 3); inkFill(c, WOOD, 1.6);
      const h0 = L - w.head;
      c.beginPath(); c.moveTo(h0, 0); c.quadraticCurveTo(h0 + w.head * 0.45, -12, L, 0); c.quadraticCurveTo(h0 + w.head * 0.45, 12, h0, 0); c.closePath(); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(h0 + 4, 0); c.lineTo(L - 6, 0); c.lineWidth = 1.3; c.strokeStyle = STEEL_D; c.stroke();
      rrect(c, h0 - 4, -5, 7, 10, 2); inkFill(c, kitOf(f.def).d, 1.4);
      break;
    }
    case 'hammer': {
      rrect(c, r * 0.4, -4.5, L - r * 0.4, 9, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head;
      rrect(c, h0, -w.w * 0.5, w.head, w.w, 4); inkFill(c, STEEL_D, 2.2);
      rrect(c, h0 + 3, -w.w * 0.5 + 3, w.head - 6, 7, 2); c.fillStyle = STEEL; c.fill();
      c.fillStyle = INK; c.fillRect(h0 + w.head * 0.5 - 1, -w.w * 0.5, 2, w.w);
      break;
    }
    case 'scythe': {
      rrect(c, r * 0.4, -3.5, L - r * 0.4 + 2, 7, 3); inkFill(c, WOOD_D, 1.6);
      const s = -w.dir;
      c.save(); c.translate(L, 0); c.scale(1, s);
      c.beginPath(); c.moveTo(2, -2); c.quadraticCurveTo(-6, 30, -w.head, 44); c.quadraticCurveTo(-16, 26, -6, -4); c.closePath();
      inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(-4, 4); c.quadraticCurveTo(-10, 28, -w.head + 6, 40); c.lineWidth = 1.6; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      break;
    }
    case 'shield': {
      const half = w.def.arc / 2;
      c.beginPath(); c.arc(0, 0, L + 7, -half, half); c.arc(0, 0, L - 7, half, -half, true); c.closePath();
      inkFill(c, kitOf(f.def).l, 2.4);
      c.beginPath(); c.arc(0, 0, L, -half + 0.12, half - 0.12); c.lineWidth = 3; c.strokeStyle = GOLD; c.stroke();
      for (const a of [-half + 0.18, 0, half - 0.18]) { circ(c, Math.cos(a) * L, Math.sin(a) * L, 2.4); c.fillStyle = INK; c.fill(); }
      break;
    }
    case 'hand': case 'hand2': {
      const wd = w.k === 'hand' ? 5 : 3.4;
      poly(c, [-8, -wd, L - 16, -wd, L - 16, -wd - 5, L, 0, L - 16, wd + 5, L - 16, wd, -8, wd]);
      inkFill(c, w.k === 'hand' ? '#2a2f3a' : '#3a4150', 1.6);
      if (w.k === 'hand2') { circ(c, 0, 0, 5); inkFill(c, GOLD, 1.4); }
      break;
    }
  }
  c.restore();
}

// the bow and the cannon point where they aim
function drawAimGear(c, f, t) {
  const id = f.def.id;
  if (id !== 'bow' && id !== 'cannon') return;
  const a = f.u.aim || [1, 0], ang = Math.atan2(a[1], a[0]);
  c.save(); c.translate(f.x, f.y); c.rotate(ang);
  const r = f.r;
  if (id === 'cannon') {
    rrect(c, 0, -11, r + 22, 22, 4); inkFill(c, '#2b313b', 2.2);
    rrect(c, r + 12, -13, 12, 26, 3); inkFill(c, '#3a424f', 2);
    c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(4, -8, r + 6, 5);
  } else {
    c.beginPath(); c.arc(r - 6, 0, 26, -1.15, 1.15); c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 3.5; c.strokeStyle = WOOD; c.stroke();
    const ex = r - 6 + Math.cos(1.15) * 26, ey = Math.sin(1.15) * 26;
    c.beginPath(); c.moveTo(ex, -ey); c.lineTo(r - 2, 0); c.lineTo(ex, ey); c.lineWidth = 1.2; c.strokeStyle = '#f4efe6'; c.stroke();
  }
  c.restore();
}

// ---- shots --------------------------------------------------------------------
function drawProj(c, p, t) {
  if (PROJ2[p.k]) { PROJ2[p.k](c, p, t); return; }
  const ang = Math.atan2(p.vy, p.vx);
  c.save(); c.translate(p.x, p.y); c.rotate(ang);
  const col = teamCol(p.side);
  switch (p.k) {
    case 'arrow':
      c.beginPath(); c.moveTo(-18, 0); c.lineTo(6, 0); c.lineWidth = 2.6; c.strokeStyle = WOOD_D; c.stroke();
      poly(c, [10, 0, 2, -4.5, 3, 0, 2, 4.5]); inkFill(c, STEEL, 1.2);
      poly(c, [-18, 0, -23, -5, -14, -1]); c.fillStyle = col; c.fill();
      poly(c, [-18, 0, -23, 5, -14, 1]); c.fill();
      break;
    case 'spike':
      poly(c, [9, 0, -6, -4.5, -3, 0, -6, 4.5]); inkFill(c, '#f4efe6', 1.4);
      break;
    case 'ball':
      circ(c, 0, 0, p.r); inkFill(c, '#2b313b', 2.2);
      circ(c, -p.r * 0.3, -p.r * 0.3, p.r * 0.3); c.fillStyle = 'rgba(255,255,255,0.3)'; c.fill();
      break;
    case 'shard':
      poly(c, [11, 0, 0, -5, -8, 0, 0, 5]); inkFill(c, '#dff7ff', 1.4);
      break;
    case 'missile':
      poly(c, [-6, -3, 2, -3.5, 2, 3.5, -6, 3]); c.fillStyle = '#ff9a3c'; c.fill();
      rrect(c, -8, -4, 16, 8, 3); inkFill(c, '#e9ecef', 1.5);
      poly(c, [8, -4, 14, 0, 8, 4]); inkFill(c, '#e5484d', 1.4);
      poly(c, [-8, -4, -12, -8, -4, -4]); c.fillStyle = col; c.fill();
      poly(c, [-8, 4, -12, 8, -4, 4]); c.fill();
      c.beginPath(); c.moveTo(-9, 0); c.lineTo(-16 - Math.random() * 6, 0); c.lineWidth = 4; c.strokeStyle = 'rgba(255,190,90,0.9)'; c.stroke();
      break;
    case 'bat': {
      c.rotate(-ang);
      const fl = Math.sin(t * 28 + p.x * 0.1) * 0.6;
      c.fillStyle = '#2a1520';
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(0, 0); c.lineTo(s * 13, -6 - fl * 8); c.lineTo(s * 10, 1); c.lineTo(s * 6, -1); c.lineTo(s * 4, 3); c.closePath(); c.fill();
      }
      circ(c, 0, 0, 4.5); c.fill();
      circ(c, -1.6, -1, 1); circ(c, 1.6, -1, 1); c.fillStyle = '#ff4d4d';
      circ(c, -1.6, -1, 1); c.fill(); circ(c, 1.6, -1, 1); c.fill();
      break;
    }
  }
  c.restore();
}

function drawDrone(c, d, t) {
  if (DRONE2[d.look]) { DRONE2[d.look](c, d, t); return; }
  const col = d.owner.def.col;
  c.save(); c.translate(d.x, d.y);
  const p = [];
  for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + PI / 6; p.push(Math.cos(a) * d.r * 1.15, Math.sin(a) * d.r * 1.15); }
  poly(c, p); inkFill(c, shade(col, 0.25), 2);
  const [ex, ey] = d.owner.foe ? toward(d, d.owner.foe) : [1, 0];
  circ(c, ex * 3, ey * 3, 4); c.fillStyle = INK; c.fill();
  circ(c, ex * 3 + 1, ey * 3 - 1, 1.3); c.fillStyle = '#ffffff'; c.fill();
  const fl = Math.sin(t * 40 + d.id) > 0 ? 1 : 0.6;
  c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(-d.r * 0.9, -d.r * 1.1, 6 * fl, 3, -0.5, 0, TAU); c.ellipse(d.r * 0.9, -d.r * 1.1, 6 * fl, 3, 0.5, 0, TAU);
  c.fillStyle = '#ffffff'; c.fill();
  c.restore();
}

// ---- hazards on the floor -----------------------------------------------------
function drawHazard(c, z, S, t) {
  if (HZ2[z.k]) { HZ2[z.k](c, z, S, t); return; }
  if (hazardLook(c, z, S, t)) return;
  switch (z.k) {
    case 'fire': {
      const a = clamp(z.life / 2.2, 0, 1);
      const fl = 0.85 + 0.15 * Math.sin(t * 20 + z.x * 0.7);
      c.globalAlpha = a * 0.75;
      circ(c, z.x, z.y, z.r * fl); c.fillStyle = '#ff7a1f'; c.fill();
      circ(c, z.x, z.y - 2, z.r * 0.55 * fl); c.fillStyle = '#ffd166'; c.fill();
      c.globalAlpha = 1;
      break;
    }
    case 'puddle': {
      const a = clamp(z.life / 1, 0, 1) * clamp((S.t - z.t0) / 0.3, 0, 1);
      c.globalAlpha = 0.5 * a;
      c.beginPath(); c.ellipse(z.x, z.y, z.r, z.r * 0.9, 0, 0, TAU); c.fillStyle = '#7bc043'; c.fill();
      c.globalAlpha = 0.8 * a;
      for (let i = 0; i < 4; i++) {
        const q = (t * 0.8 + i * 0.25 + z.x * 0.01) % 1, bx = z.x + Math.cos(i * 1.7 + z.y) * z.r * 0.5, by = z.y + Math.sin(i * 2.3 + z.x) * z.r * 0.4;
        circ(c, bx, by, 2 + q * 5); c.lineWidth = 1.5; c.strokeStyle = '#d7f5a8'; c.stroke();
      }
      c.globalAlpha = 1;
      break;
    }
    case 'bomb': {
      const q = 1 - clamp(z.fuse / 1.2, 0, 1), blink = Math.sin(q * q * 60) > 0;
      c.setLineDash([8, 8]);
      circ(c, z.x, z.y, z.r); c.lineWidth = 2; c.strokeStyle = rgba('#e5484d', 0.25 + 0.5 * q); c.stroke();
      c.setLineDash([]);
      circ(c, z.x, z.y, z.r * q); c.fillStyle = rgba('#e5484d', 0.08 + 0.1 * q); c.fill();
      circ(c, z.x, z.y, 14); inkFill(c, '#20232c', 2.2);
      c.beginPath(); c.moveTo(z.x, z.y - 14); c.quadraticCurveTo(z.x + 5, z.y - 24, z.x + 11, z.y - 22); c.lineWidth = 2.5; c.strokeStyle = '#c9a26b'; c.stroke();
      circ(c, z.x + 11, z.y - 22, blink ? 5 : 3); c.fillStyle = blink ? '#ffffff' : '#ffd166'; c.fill();
      break;
    }
    case 'strike': {
      const q = 1 - clamp(z.tele / 0.45, 0, 1);
      circ(c, z.x, z.y, z.r); c.fillStyle = rgba('#f9d71c', 0.12 + 0.2 * q); c.fill();
      c.setLineDash([10, 7]); c.lineDashOffset = -t * 40;
      circ(c, z.x, z.y, z.r * (1.4 - 0.4 * q)); c.lineWidth = 3; c.strokeStyle = rgba('#c9a400', 0.9); c.stroke();
      c.setLineDash([]);
      break;
    }
    case 'laser': {
      if (!z.fired) {
        const q = 1 - clamp(z.ch / 0.75, 0, 1);
        c.setLineDash([12, 10]); c.lineDashOffset = -t * 120;
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1); c.lineWidth = 1.5 + q * 3; c.strokeStyle = rgba('#00a6c7', 0.35 + 0.5 * q); c.stroke();
        c.setLineDash([]);
      } else {
        const a = clamp(z.life / 0.24, 0, 1);
        c.lineCap = 'round';
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
        c.lineWidth = 34 * a; c.strokeStyle = rgba('#00a6c7', 0.45 * a); c.stroke();
        c.lineWidth = 16 * a; c.strokeStyle = rgba('#7fe9ff', 0.9 * a); c.stroke();
        c.lineWidth = 6 * a; c.strokeStyle = 'rgba(255,255,255,' + a + ')'; c.stroke();
        c.lineCap = 'butt';
      }
      break;
    }
    case 'hole': {
      const age = S.t - z.t0, grow = clamp(age / 0.35, 0, 1) * clamp(z.life / 0.35, 0, 1);
      circ(c, z.x, z.y, z.R * grow); c.fillStyle = 'rgba(40,20,80,0.08)'; c.fill();
      c.save(); c.translate(z.x, z.y); c.scale(grow, grow);
      for (let i = 0; i < 3; i++) {
        c.save(); c.rotate(-t * (2.2 + i) + i * 2);
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, 0, 2.2); c.lineWidth = 5 - i; c.strokeStyle = rgba(i ? '#9b7bff' : '#ff9a3c', 0.75 - i * 0.18); c.stroke();
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, PI, PI + 1.6); c.stroke();
        c.restore();
      }
      circ(c, 0, 0, z.core); c.fillStyle = '#05010d'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#ffb35c'; c.stroke();
      c.restore();
      break;
    }
  }
}

// ===== the arena view: draws a fight and its effects on a canvas =========
const NUMCOL = { burn: '#ff8a1f', poison: '#7bd23a', drain: '#ff4f8a', hole: '#a07bff', regen: '#3ddc84', zone: '#ff9f2e' };
const HEAVY = { axe: 1, hammer: 1, flail: 1, claw: 1, head: 1, moon: 1 };
// a word in big letters over the box for the events that deserve one
const SAY = { revive: ['REVIVED!', '#ffd23f'], copy: ['COPIED!', '#b69cff'], grow: ['+1 HEAD', '#7bd23a'], rewind: ['REWIND!', '#38b6ff'], split: ['SPLIT!', '#7bd23a'],
  grab: ['SLAM!', '#ff4d4d'], slip: ['SLIP!', '#ffd23f'], strike: ['STRIKE!', '#38b6ff'], lucky: ['LUCKY!', '#3ddc84'], chaos: ['CHAOS!', '#ff9f2e'], haunt: ['BOO!', '#c7d2fe'] };

class Arena {
  constructor(canvas, opt) {
    this.cv = canvas; this.c = canvas.getContext('2d');
    this.opt = opt || {};
    this.fx = []; this.nums = []; this.trail = {}; this.says = [];
    this.shake = 0; this.flip = false; this.me = 0; this.hitstop = 0; this.flash = 0;
    this.k = 1; this.ox = 0; this.oy = 0; this.dpr = 1;
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; }
    this.dpr = dpr;
    const pad = this.opt.pad === undefined ? 16 : this.opt.pad;
    if (this.opt.place) {
      const p = this.opt.place(w, h);
      this.k = p.size / (ARENA + pad * 2); this.ox = p.x + pad * this.k; this.oy = p.y + pad * this.k;
      return;
    }
    this.k = Math.min(w, h) / (ARENA + pad * 2);
    this.ox = (w - ARENA * this.k) / 2; this.oy = (h - ARENA * this.k) / 2;
  }
  reset() { this.fx.length = 0; this.nums.length = 0; this.says.length = 0; this.trail = {}; this.shake = 0; this.hitstop = 0; this.flash = 0; }
  callout(txt, col) { this.says.push({ txt, col: col || '#ffd23f', life: 1.2, max: 1.2 }); if (this.says.length > 3) this.says.shift(); }

  events(S) {
    for (const e of S.ev) this.ev(S, e);
    S.ev.length = 0;
  }
  burst(x, y, n, col, sp, life, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = sp * (0.4 + Math.random() * 0.8);
      this.fx.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col, size: size * (0.6 + Math.random() * 0.7) });
    }
  }
  ring(x, y, r0, r1, col, w, life) { this.fx.push({ k: 'ring', x, y, r0, r1, life: life || 0.3, max: life || 0.3, col, w: w || 4 }); }
  num(x, y, txt, col, big, small) {
    if (this.nums.length > 60) this.nums.shift();
    this.nums.push({ x: x + (Math.random() - 0.5) * 14, y, txt, col, big, small, life: small ? 0.6 : 0.95, max: small ? 0.6 : 0.95 });
  }
  ev(S, e) {
    const snd = this.opt.sound ? SFX : null;
    if (SAY[e.e] && this.opt.sound) this.callout(SAY[e.e][0], SAY[e.e][1]);
    switch (e.e) {
      case 'hit': {

          const rr = rng(p.seed | 0); let x = p.x + (rr() - 0.5) * 60, y = p.y0;
          c.globalAlpha = a; c.beginPath(); c.moveTo(x, y);
          for (let i = 1; i <= 9; i++) { y = p.y0 + (p.y - p.y0) * i / 9; x = (i === 9 ? p.x : p.x + (rr() - 0.5) * 70 * (1 - i / 9)); c.lineTo(x, y); }
          c.lineWidth = 14; c.strokeStyle = INK; c.stroke(); c.lineWidth = 8; c.strokeStyle = '#ffe135'; c.stroke();
          break;
        }
        case 'streak': c.globalAlpha = a * 0.8; c.beginPath(); c.moveTo(p.x0, p.y0); c.lineTo(p.x1, p.y1); c.lineWidth = 26 * a; c.lineCap = 'round'; c.strokeStyle = p.col || 'rgba(178,140,255,0.6)'; c.stroke(); c.lineCap = 'butt'; break;
        case 'die': {
          const f = this.byId(S, p.id);
          if (!f || !f.alive) break;
          const s = 1 + (1 - a) * 0.3, x = f.x, y = f.y - f.r - 54 - (1 - a) * 10;
          c.globalAlpha = Math.min(1, a * 2);
          rrect(c, x - 13 * s, y - 13 * s, 26 * s, 26 * s, 6); inkFill(c, p.a === 6 ? '#ffd23f' : '#fffdf8', 2);
          c.font = `400 ${Math.round(20 * s)}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillStyle = INK; c.lineWidth = 0; c.strokeStyle = 'transparent';
          this.text(String(p.a), x, y + 1);
          break;
        }
      }
    }
    c.globalAlpha = 1;
  }

  tag(S, f) {
    if (!f.alive) return;
    const c = this.c, hp = Math.ceil(f.hp), w = hp >= 100 ? 48 : 40, h = 26;
    let y = f.y - f.r - 28;
    if (f.def.id === 'bomb' || f.def.id === 'wizard' || f.def.id === 'king' || f.def.id === 'shark') y -= 24; else if (ART_OUT[f.def.id]) y -= 10;
    if (y < S.box.y0 + 4) y = f.y + f.r + 24;
    const x = f.x;
    rrect(c, x - w / 2, y - h / 2, w, h, 6); c.fillStyle = '#0c0c0f'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = teamCol(f.side); c.stroke();
    c.font = `400 22px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = hp / f.maxHp < 0.3 ? '#ff5a5a' : '#ffffff'; c.lineWidth = 0; c.strokeStyle = 'transparent';
    this.text(String(hp), x, y + 1);
    if (f.st.poison > 0) for (let i = 0; i < f.st.poison; i++) { circ(c, x - (f.st.poison - 1) * 4 + i * 8, y + h / 2 + 8, 3); c.fillStyle = '#7bd23a'; c.fill(); }
  }

  numbers() {
    const c = this.c;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const n of this.nums) {
      const a = clamp(n.life / n.max * 1.6, 0, 1), pop = 1 + Math.max(0, n.life - n.max + 0.15) * 3;
      c.globalAlpha = a;
      c.font = `400 ${Math.round((n.big ? 36 : n.small ? 17 : 26) * pop)}px ${FONT_D}`;
      c.lineWidth = 5; c.strokeStyle = '#030304'; c.fillStyle = n.col; c.lineJoin = 'round';
      this.text(n.txt, n.x, n.y);
    }
    c.globalAlpha = 1;
  }

  sayDraw() {
    const c = this.c;
    this.says.forEach((s, i) => {
      const a = clamp(s.life / s.max, 0, 1), pop = 1 + Math.max(0, s.life - s.max + 0.2) * 2.5;
      c.globalAlpha = Math.min(1, a * 3);
      c.font = `400 ${Math.round(54 * pop)}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 8; c.strokeStyle = '#030304'; c.lineJoin = 'round'; c.fillStyle = s.col;
      this.text(s.txt, ARENA / 2, 120 + i * 60 - (1 - a) * 20);
    });
    c.globalAlpha = 1;
  }
}

// ===== art for the 70 newer balls, and their weapons, shots and hazards =======
// Emblems are drawn in an 80-unit box centred on the ball, like ART in p5.
const star = (c, x, y, r1, r2, n, rot) => { const p = []; for (let i = 0; i < n * 2; i++) { const a = (rot || -HALF_PI) + i * PI / n, r = i % 2 ? r2 : r1; p.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } poly(c, p); };
const heart = (c, x, y, s) => { c.beginPath(); c.moveTo(x, y + s * 0.9); c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.35); c.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); c.closePath(); };
const eyes = (c, dx, y, r, look) => { for (const s of [-1, 1]) { circ(c, s * dx, y, r); inkFill(c, '#ffffff', 1.6); circ(c, s * dx + (look || 0), y + 1, r * 0.5); c.fillStyle = INK; c.fill(); } };
const line = (c, pts, w, col) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = w; c.strokeStyle = col || INK; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); c.lineCap = 'butt'; };
const txt = (c, s, x, y, size, col) => { c.font = `400 ${size}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 4; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(s, x, y); c.fillStyle = col || '#fff'; c.fillText(s, x, y); };

Object.assign(ART, {
  copycat(c, k, f, t) {
    const cp = f && f.def.copied;
    if (cp && ART[cp]) { c.save(); c.scale(0.62, 0.62); c.translate(0, 8); ART[cp](c, kitOf(BALL[cp]), f, t); c.restore(); }
    else {                       // a paw print
      c.beginPath(); c.ellipse(0, 9, 13, 11, 0, 0, TAU); inkFill(c, '#ffd6e6', 2);
      for (const [x, y] of [[-17, -5], [-6, -15], [6, -15], [17, -5]]) { c.beginPath(); c.ellipse(x, y, 5.5, 7, x * 0.03, 0, TAU); inkFill(c, '#ffd6e6', 2); }
    }
  },
  hydra(c, k) {
    for (const [x, y, a] of [[-16, -6, -0.5], [0, -14, 0], [16, -6, 0.5]]) {
      line(c, [x * 0.4, 22, x, y], 7, k.d);
      c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 7, 9, 0, 0, TAU); inkFill(c, k.l, 1.6); poly(c, [-1.5, -9, 0, -15, 1.5, -9]); c.fillStyle = '#ff4d6d'; c.fill(); c.restore();
    }
  },
  painter(c, k) {
    c.beginPath(); c.ellipse(0, 2, 27, 21, -0.2, 0, TAU); inkFill(c, '#fff3d6', 2);
    circ(c, 9, 10, 5); c.fillStyle = shade(k.col, -0.25); c.fill();
    [['#ff4d4d', -14, -2], ['#38b6ff', -4, -11], ['#3ddc84', 8, -10], ['#b46bff', 16, 0]].forEach(([col, x, y]) => { circ(c, x, y, 4.5); c.fillStyle = col; c.fill(); });
  },
  builder(c, k) {
    c.beginPath(); c.arc(0, 4, 24, PI, 0); c.closePath(); inkFill(c, '#ffd23f', 2.2);
    rrect(c, -30, 2, 60, 8, 3); inkFill(c, '#ffd23f', 2);
    rrect(c, -4, -21, 8, 22, 2); c.fillStyle = shade('#ffd23f', -0.2); c.fill();
    for (const [x, y] of [[-16, 15], [0, 15], [16, 15], [-8, 24], [8, 24]]) { rrect(c, x - 7, y - 3.5, 14, 7, 1.5); inkFill(c, '#d9663a', 1.4); }
  },
  mime(c, k) {                 // a striped shirt under the beret
    c.save(); circ(c, 0, 0, 40); c.clip();
    c.fillStyle = '#24124a'; for (const y of [-16, -3, 10, 23]) c.fillRect(-40, y, 80, 6);
    c.restore();
  },
  glitch(c, k, f, t) {
    const o = Math.floor(t * 8) % 3;
    [['#ff3b6b', -3 + o, 0], ['#38b6ff', 3 - o, 0], ['#ffffff', 0, 0]].forEach(([col, dx]) => { c.fillStyle = col; c.globalAlpha *= col === '#ffffff' ? 1 : 0.8; for (const [x, y] of [[-14, -14], [2, -14], [-14, 2], [10, 6], [-4, 14]]) c.fillRect(x + dx, y, 9, 9); c.globalAlpha = 1; });
  },
  gambler(c, k) {
    rrect(c, -15, -21, 30, 42, 4); inkFill(c, '#ffffff', 2);
    c.fillStyle = INK; heart(c, 0, -3, 9); c.save(); c.translate(0, -3); c.scale(1, -1); heart(c, 0, 0, 9); c.restore(); c.fill();
    rrect(c, -2, 4, 4, 9, 1); c.fill();
    txt(c, 'A', -9, -14, 11, INK);
  },
  swap(c, k) {
    c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, 20, -2.6, -0.4); c.stroke(); c.beginPath(); c.arc(0, 0, 20, 0.54, 2.74); c.stroke(); c.lineCap = 'butt';
    poly(c, [20, -15, 23, -2, 11, -6]); c.fillStyle = '#ffffff'; c.fill();
    poly(c, [-20, 15, -23, 2, -11, 6]); c.fill();
  },
  chess(c, k) {
    c.beginPath(); c.moveTo(-14, 24); c.lineTo(16, 24); c.lineTo(14, 4); c.quadraticCurveTo(18, -14, 2, -24); c.lineTo(-2, -18); c.lineTo(-8, -22); c.lineTo(-8, -14);
    c.quadraticCurveTo(-22, -6, -20, 4); c.lineTo(-12, 6); c.quadraticCurveTo(-4, 2, -2, -2); c.quadraticCurveTo(-12, 10, -14, 24); c.closePath();
    inkFill(c, '#f4f1ea', 2); circ(c, 2, -12, 2.4); c.fillStyle = INK; c.fill();
  },
  rewind(c, k) {
    for (const x of [-12, 6]) { poly(c, [x + 14, -15, x - 4, 0, x + 14, 15]); inkFill(c, '#ffffff', 2); }
    c.beginPath(); c.arc(0, 0, 30, -2.4, 2.1); c.lineWidth = 3; c.strokeStyle = '#ffffff'; c.stroke();
  },
  supernova(c, k, f, t) { star(c, 0, 0, 30, 12, 8, t * 0.6); inkFill(c, '#fff4b0', 2); circ(c, 0, 0, 10); c.fillStyle = '#ffffff'; c.fill(); },
  nuke(c, k) {
    circ(c, 0, 0, 27); c.fillStyle = '#ffde2e'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    c.fillStyle = INK;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 23, -HALF_PI + i * TAU / 3 - 0.52, -HALF_PI + i * TAU / 3 + 0.52); c.closePath(); c.fill(); }
    circ(c, 0, 0, 7); c.fillStyle = '#ffde2e'; c.fill(); circ(c, 0, 0, 4.5); c.fillStyle = INK; c.fill();
  },
  phoenix(c, k) {
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, 6); c.quadraticCurveTo(s * 16, -4, s * 30, -18); c.quadraticCurveTo(s * 22, -2, s * 28, 2); c.quadraticCurveTo(s * 16, 6, s * 22, 14); c.quadraticCurveTo(s * 10, 14, 0, 14); c.closePath(); inkFill(c, '#ffd23f', 1.8); }
    c.beginPath(); c.ellipse(0, 0, 7, 12, 0, 0, TAU); inkFill(c, '#ff8a2e', 1.8);
    poly(c, [0, -14, 4, -8, -4, -8]); inkFill(c, '#ffd23f', 1.4);
  },
  zombie(c, k) {               // a brain
    c.beginPath(); c.ellipse(0, 0, 24, 18, 0, 0, TAU); inkFill(c, '#ff9ab8', 2.2);
    const fold = '#c2557a';
    line(c, [0, -17, 0, 17], 2, fold);
    line(c, [-20, -6, -13, -10, -8, -4, -14, 2], 1.8, fold); line(c, [-18, 9, -10, 6, -5, 12], 1.8, fold);
    line(c, [20, -6, 13, -10, 8, -4, 14, 2], 1.8, fold); line(c, [18, 9, 10, 6, 5, 12], 1.8, fold);
    line(c, [-8, -14, -4, -9], 1.8, fold); line(c, [8, -14, 4, -9], 1.8, fold);
  },
  slime(c, k) { c.beginPath(); c.ellipse(-12, -14, 9, 6, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill(); for (const [x, y, r] of [[8, -4, 6], [-4, 10, 4], [14, 14, 3], [-14, 4, 2.5]]) { circ(c, x, y, r); c.fillStyle = shade(k.col, 0.35); c.fill(); c.lineWidth = 1.4; c.strokeStyle = shade(k.col, -0.35); c.stroke(); } },
  clone(c, k) { for (const [x, a] of [[-9, 0.5], [9, 1]]) { c.globalAlpha = a; circ(c, x, 0, 16); inkFill(c, k.l, 2); c.beginPath(); c.ellipse(x - 6, -7, 5, 3, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill(); } c.globalAlpha = 1; },
  mirror(c, k) { c.save(); circ(c, 0, 0, 40); c.clip(); c.rotate(-0.7); c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillRect(-6, -60, 9, 120); c.fillRect(10, -60, 4, 120); c.fillStyle = 'rgba(120,170,220,0.35)'; c.fillRect(-30, -60, 14, 120); c.restore(); },
  sponge(c, k) { for (const [x, y, r] of [[-14, -12, 6], [8, -16, 4], [14, 2, 7], [-6, 6, 5], [-18, 14, 3.5], [6, 20, 4], [-2, -26, 3]]) { circ(c, x, y, r); c.fillStyle = shade(k.col, -0.3); c.fill(); } },
  chomper(c, k) {              // a bear trap's jaws
    for (const s of [-1, 1]) {
      rrect(c, -24, s > 0 ? 12 : -18, 48, 6, 2); inkFill(c, '#c9d2dc', 2);
      c.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) { const x = -20 + i * 10 + (s > 0 ? 5 : 0); poly(c, [x - 4, s > 0 ? 12 : -12, x + 4, s > 0 ? 12 : -12, x, s > 0 ? 3 : -3]); inkFill(c, '#f4efe6', 1.4); }
      circ(c, s * 26, 0, 6); inkFill(c, '#8a8f99', 2);
    }
    line(c, [-26, -15, -26, 15], 2.4, '#8a8f99'); line(c, [26, -15, 26, 15], 2.4, '#8a8f99');
  },
  jelly(c, k, f, t) {          // a wobbling jelly with a cherry
    const w = Math.sin(t * 9) * 2;
    line(c, [-24, 19, 24, 19], 3, '#f4efe6');
    c.beginPath(); c.moveTo(-18 - w, 16); c.lineTo(18 + w, 16); c.lineTo(13 - w, -9); c.quadraticCurveTo(0, -15, -13 + w, -9); c.closePath(); inkFill(c, shade(k.col, 0.25), 2);
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-9 + w * 0.5, -5, 4, 15);
    circ(c, 0, -17, 5); inkFill(c, '#e8364a', 1.6); line(c, [0, -22, 4, -28], 1.6);
  },
  battery(c, k, f) {
    rrect(c, -14, -22, 28, 44, 4); inkFill(c, '#2a2f3a', 2.2); rrect(c, -6, -27, 12, 6, 2); inkFill(c, '#c9d2dc', 1.6);
    const n = f ? Math.ceil((f.u.ch || 0) / 2.5) : 3;
    for (let i = 0; i < 4; i++) { rrect(c, -9, 13 - i * 9, 18, 7, 2); c.fillStyle = i < n ? '#5bff9d' : '#3a404c'; c.fill(); }
  },
  snowball(c, k) { c.fillStyle = '#c7defa'; for (const [x, y] of [[-14, -10], [10, -16], [16, 8], [-6, 14], [-20, 10], [4, -2]]) { circ(c, x, y, 3); c.fill(); } },
  puffer(c, k) { c.beginPath(); c.ellipse(-3, 0, 18, 13, 0, 0, TAU); inkFill(c, '#fff3d6', 2); poly(c, [13, 0, 26, -11, 26, 11]); inkFill(c, '#fff3d6', 2); for (const [x, y] of [[-12, -3], [-3, 5], [-6, -7], [5, -4], [3, 7]]) { circ(c, x, y, 2); c.fillStyle = shade(k.col, -0.3); c.fill(); } },
  wrestler(c, k) {             // a title belt
    rrect(c, -34, -6, 68, 14, 4); inkFill(c, '#3a2a20', 2);
    for (const s of [-1, 1]) { rrect(c, s * 23 - 5, -4, 10, 10, 2); inkFill(c, '#ffd23f', 1.4); }
    c.beginPath(); c.ellipse(0, 1, 16, 14, 0, 0, TAU); inkFill(c, '#ffd23f', 2.2);
    c.beginPath(); c.ellipse(0, 1, 9, 8, 0, 0, TAU); inkFill(c, '#e8364a', 1.6);
  },
  disco(c, k, f, t) {
    c.save(); circ(c, 0, 0, 40); c.clip();
    for (let y = -40; y < 40; y += 10) for (let x = -40; x < 40; x += 10) { const v = (Math.sin((x * 3 + y * 7) * 0.1 + t * 4) + 1) * 0.5; c.fillStyle = `rgba(255,255,255,${0.1 + v * 0.45})`; c.fillRect(x + 1, y + 1, 8, 8); }
    c.restore();
  },
  cupid(c, k) { heart(c, 0, 0, 20); inkFill(c, '#ff3f6f', 2.2); line(c, [-28, 22, 26, -22], 3, '#8b5a33'); poly(c, [28, -24, 18, -22, 24, -14]); inkFill(c, '#ffd23f', 1.4); },
  banana(c, k) { c.beginPath(); c.moveTo(-24, -12); c.quadraticCurveTo(-18, 22, 22, 18); c.quadraticCurveTo(4, 12, -16, -14); c.closePath(); inkFill(c, '#ffe135', 2.2); circ(c, -20, -13, 3); c.fillStyle = '#6b4a1a'; c.fill(); },
  tsunami(c, k) { c.beginPath(); c.moveTo(-30, 18); c.quadraticCurveTo(-24, -24, 12, -20); c.quadraticCurveTo(28, -16, 22, 0); c.quadraticCurveTo(10, -8, 6, 4); c.quadraticCurveTo(4, 14, 30, 18); c.closePath(); inkFill(c, '#9fe3ff', 2.2); c.beginPath(); c.arc(14, -6, 6, PI, TAU); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke(); },
  pinball(c, k) { star(c, 0, 0, 26, 11, 5); inkFill(c, '#ffd23f', 2.2); circ(c, 0, 0, 7); inkFill(c, '#d5dce5', 1.6); },
  eightball(c, k) { circ(c, 0, -2, 17); inkFill(c, '#ffffff', 2); txt(c, '8', 0, 0, 24, INK); },
  tornado(c, k, f, t) { for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(Math.sin(t * 3 + i) * 3 + i * 1.5, -20 + i * 10, 24 - i * 4, 5, 0, 0, TAU); c.lineWidth = 3; c.strokeStyle = '#ffffff'; c.stroke(); } },
  whitehole(c, k, f, t) { for (let i = 0; i < 8; i++) { c.save(); c.rotate(i * TAU / 8 + t * 0.5); poly(c, [16, -3, 34, 0, 16, 3]); c.fillStyle = '#ffd6f8'; c.fill(); c.restore(); } circ(c, 0, 0, 14); inkFill(c, '#ffffff', 2); },

  knight(c, k) { rrect(c, -20, -22, 40, 42, 12); inkFill(c, '#d5dce5', 2.2); c.fillStyle = INK; c.fillRect(-14, -6, 28, 5); c.fillRect(-2, -1, 4, 14); poly(c, [-6, -22, 0, -34, 6, -22]); inkFill(c, '#e8364a', 1.6); },
  samurai(c, k) { rrect(c, -30, -10, 60, 9, 3); inkFill(c, '#ffffff', 2); circ(c, 0, -6, 5); c.fillStyle = '#e8364a'; c.fill(); for (const s of [-1, 1]) { line(c, [-18 * s, 26, 16 * s, 4], 5, INK); line(c, [-18 * s, 26, 16 * s, 4], 3, '#d5dce5'); line(c, [-12 * s, 18, -16 * s, 24], 5, '#24124a'); } },
  viking(c, k) {
    c.beginPath(); c.arc(0, 2, 22, PI, 0); c.closePath(); inkFill(c, '#c9d2dc', 2.2);
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 18, -6); c.quadraticCurveTo(s * 34, -14, s * 30, -32); c.quadraticCurveTo(s * 26, -18, s * 12, -14); c.closePath(); inkFill(c, '#f4efe6', 1.8); }
    rrect(c, -24, 2, 48, 7, 3); inkFill(c, '#8a6a3a', 1.8);
    for (const x of [-14, 0, 14]) { circ(c, x, 5.5, 2); c.fillStyle = '#c9d2dc'; c.fill(); }
  },
  crab(c, k) {                 // a big claw
    const cl = shade(k.col, 0.3);
    circ(c, -12, 12, 11); inkFill(c, cl, 2);
    c.beginPath(); c.moveTo(-18, 4); c.quadraticCurveTo(-14, -28, 20, -16); c.quadraticCurveTo(2, -12, -2, 4); c.closePath(); inkFill(c, cl, 2.2);
    c.beginPath(); c.moveTo(-2, 10); c.quadraticCurveTo(14, 6, 24, -6); c.quadraticCurveTo(22, 18, -6, 20); c.closePath(); inkFill(c, cl, 2.2);
  },
  scorpion(c, k) { c.beginPath(); c.moveTo(-10, 20); c.quadraticCurveTo(-24, -6, -4, -20); c.quadraticCurveTo(14, -30, 16, -10); c.lineWidth = 7; c.strokeStyle = shade(k.col, -0.35); c.lineCap = 'round'; c.stroke(); c.lineCap = 'butt'; poly(c, [16, -12, 24, -2, 12, -2]); inkFill(c, '#ffd23f', 1.6); },

  snake(c, k) {                // a coiled snake

const WEAPON2 = {
  head(c, f, w) {          // a hydra's neck and head
    const ux = Math.cos(w.ang), uy = Math.sin(w.ang), hx = f.x + ux * (w.len - 10), hy = f.y + uy * (w.len - 10);
    c.beginPath(); c.moveTo(f.x + ux * f.r * 0.6, f.y + uy * f.r * 0.6); c.quadraticCurveTo(f.x + ux * w.len * 0.6 - uy * 18 * w.dir, f.y + uy * w.len * 0.6 + ux * 18 * w.dir, hx, hy);
    c.lineWidth = 13; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke(); c.lineWidth = 9; c.strokeStyle = shade(f.def.col, -0.15); c.stroke(); c.lineCap = 'butt';
    c.save(); c.translate(hx, hy); c.rotate(w.ang);
    c.beginPath(); c.ellipse(4, 0, 16, 11, 0, 0, TAU); inkFill(c, f.def.col, 2.2);

    circ(c, 2, -6, 3); inkFill(c, '#ffd23f', 1.2);
    c.restore();
  },
  katana(c, f, w) {
    c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
    const r = f.r, L = w.len;
    rrect(c, r - 10, -3, 22, 6, 2); inkFill(c, '#24124a', 1.4);
    circ(c, r + 13, 0, 6); inkFill(c, '#ffd23f', 1.6);
    c.beginPath(); c.moveTo(r + 18, -3); c.quadraticCurveTo(L * 0.8, -7 * w.dir * -1, L, -2 * w.dir); c.lineTo(r + 18, 3); c.closePath(); inkFill(c, '#eef3f8', 1.8);
    c.restore();
  },
  claw(c, f, w) {
    c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
    rrect(c, f.r - 6, -5, w.len - f.r - 18, 10, 4); inkFill(c, f.def.col, 2);
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(w.len - 26, 0); c.quadraticCurveTo(w.len - 10, s * 20, w.len + 2, s * 4); c.quadraticCurveTo(w.len - 12, s * 8, w.len - 26, 0); c.closePath(); inkFill(c, shade(f.def.col, 0.2), 2); }
    c.restore();
  },
  tail(c, f, w) {
    c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
    for (let i = 0; i < 5; i++) { const x = f.r + 8 + i * (w.len - f.r - 30) / 4; circ(c, x, Math.sin(i * 1.1) * 4, 9 - i * 0.6); inkFill(c, shade(f.def.col, -0.1), 1.8); }
    poly(c, [w.len - 22, -8, w.len + 4, 0, w.len - 22, 8]); inkFill(c, '#ffd23f', 2);
    c.restore();
  },
  moon(c, f, w) {
    const x = f.x + Math.cos(w.ang) * w.len, y = f.y + Math.sin(w.ang) * w.len, r = w.w / 2;
    circ(c, x, y, r); inkFill(c, '#e6e9ef', 2.2);

// a few hazards the first 30 had, in new looks
function hazardLook(c, z, S, t) {
  if (z.k === 'bomb' && z.look === 'nuke') {
    const q = 1 - clamp(z.fuse / 2.6, 0, 1);
    c.setLineDash([14, 10]); circ(c, z.x, z.y, z.r); c.lineWidth = 4; c.strokeStyle = `rgba(255,222,46,${0.4 + 0.5 * q})`; c.stroke(); c.setLineDash([]);

    c.save(); c.translate(z.x, z.y); c.scale(0.5, 0.5); circ(c, 0, 0, 34); inkFill(c, '#ffde2e', 4); ART.nuke(c, kitOf(BALL.nuke)); c.restore();
    c.font = `400 26px ${FONT_D}`; c.textAlign = 'center'; c.fillStyle = INK; c.fillText(Math.ceil(z.fuse), z.x, z.y - 30);
    return true;
  }
  if (z.k === 'strike' && z.look === 'meteor') {
    const q = 1 - clamp(z.tele / 0.8, 0, 1);
    circ(c, z.x, z.y, z.r); c.fillStyle = `rgba(140,59,30,${0.12 + 0.2 * q})`; c.fill();
    c.setLineDash([10, 8]); c.lineWidth = 3; c.strokeStyle = '#8c3b1e'; circ(c, z.x, z.y, z.r); c.stroke(); c.setLineDash([]);
    const mx = z.x + (1 - q) * 160, my = z.y - (1 - q) * 260;
    circ(c, mx, my, 16 + q * 8); inkFill(c, '#8c3b1e', 2.5);
    return true;
  }
  if (z.k === 'laser' && z.look && !z.fired) {
    const q = 1 - clamp(z.ch / 1.1, 0, 1), col = z.look === 'rail' ? '#2fc4ff' : '#ff3b3b';
    c.setLineDash(z.look === 'snipe' ? [4, 6] : [10, 8]);
    c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1); c.lineWidth = 1.5 + q * 2; c.strokeStyle = rgba(col, 0.4 + 0.5 * q); c.stroke(); c.setLineDash([]);
    if (z.look === 'snipe') { circ(c, z.x1 - (z.x1 - z.x0) * 0.02, z.y1 - (z.y1 - z.y0) * 0.02, 10); c.lineWidth = 2; c.stroke(); }
    return true;
  }
  if (z.k === 'laser' && z.look && z.fired) {
    const a = clamp(z.life / 0.24, 0, 1), col = z.look === 'rail' ? '#2fc4ff' : '#ff3b3b', w = z.look === 'snipe' ? 10 : z.look === 'rail' ? 26 : 18;
    c.lineCap = 'round'; c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
    c.lineWidth = w * a; c.strokeStyle = rgba(col, 0.8 * a); c.stroke(); c.lineWidth = w * 0.35 * a; c.strokeStyle = 'rgba(255,255,255,' + a + ')'; c.stroke(); c.lineCap = 'butt';
    return true;
  }
  if (z.k === 'hole' && z.push) {
    const age = S.t - z.t0, g = clamp(age / 0.2, 0, 1) * clamp(z.life / 0.3, 0, 1);
    circ(c, z.x, z.y, z.R * g); c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill(); c.lineWidth = 5; c.strokeStyle = 'rgba(255,214,248,0.8)'; c.stroke();
    return true;
  }
  return false;
}

const CUE_COLS = ['#ffd23f', '#38b6ff', '#ff4d4d', '#8f5bff', '#ff9f2e', '#3ddc84', '#8c3b1e'];
const DRONE2 = {
  slime(c, d) { c.beginPath(); c.ellipse(d.x, d.y + 2, d.r * 1.05, d.r * 0.9, 0, 0, TAU); inkFill(c, d.owner.def.col, 2.2); c.beginPath(); c.ellipse(d.x - d.r * 0.35, d.y - d.r * 0.3, d.r * 0.3, d.r * 0.18, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill(); },

// the painter's floor
function drawPaint(c, S) {
  if (!S.paint) return;
  const n = PAINT_N, cs = ARENA / n;
  for (let i = 0; i < S.paint.length; i++) {
    const v = S.paint[i];
    if (!v) continue;
    const f = S.F[v - 1];
    c.fillStyle = rgba(f && f.def.id === 'painter' ? (v - 1 === ME_SIDE ? '#38b6ff' : '#ff4fa3') : '#ffd23f', 0.32);
    c.fillRect((i % n) * cs + 1, Math.floor(i / n) * cs + 1, cs - 2, cs - 2);
  }
}

// ===== sound: every effect is synthesised, no audio files ==================

    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);

    resume() { if (init() && ac.state === 'suspended') ac.resume(); },
    get sfx() { return sfxOn; },
    set sfx(v) { sfxOn = !!v; if (sfxBus) sfxBus.gain.value = sfxOn ? 0.7 : 0; },
    get music() { return musOn; },
    set music(v) { musOn = !!v; if (musBus) musBus.gain.value = musOn ? 0.32 : 0; },
    get ctx() { return ac; }, get musBus() { return musBus; },
    tone, noise,
    hit(k, a) {

    slash(k, a) {

    clang() { if (!ok('clang', 70)) return; for (const [f, v] of [[1250, 0.09], [1870, 0.07], [2630, 0.05], [3420, 0.03]]) tone('triangle', f, f * 0.98, 0.42, v); noise(0.04, 0.2, 'highpass', 4500); },
    wall(sp) { if (ok('wall', 90)) tone('sine', 130, 70, 0.07, Math.min(0.12, sp / 9000)); },

    boom(small) {

    zap() { if (!ok('zap', 80)) return; tone('sawtooth', 2200, 180, 0.22, 0.1); noise(0.18, 0.3, 'highpass', 3000, 900); tone('sine', 70, 40, 0.4, 0.3, 0.02); },
    laser() { if (!ok('laser', 80)) return; tone('square', 920, 230, 0.32, 0.08); tone('sawtooth', 1380, 345, 0.32, 0.05); noise(0.2, 0.12, 'bandpass', 3000, 1200, 2); },

    fight: { bpm: 132, swing: 0,
      bass: [45, 45, 57, 45, 45, 57, 45, 55, 41, 41, 53, 41, 43, 43, 55, 43, 45, 45, 57, 45, 45, 57, 45, 55, 41, 41, 53, 41, 40, 40, 52, 44],

// three new quests each day; the gimmick one only once you own a gimmick ball
function ensureDaily() {

  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }

// adds progress; returns the quests this finished
function questBump(id, by) {

// ---- player level --------------------------------------------------------------
function xpNeed(l) { return 100 + (l - 1) * 40; }

function fightTag(F) {

  const S = F.S, win = S.winner === F.mySide, f = S.F[F.mySide], q = f.hp / f.maxHp, out = [];
  const bump = (id, n) => out.push(...questBump(id, n));

  if (win) {
    bump('win', 1);
    if (F.mode === 'pvp') bump('rank', 1);
    if (S.t < 30) bump('fast', 1);

    if (q >= 0.75) bump('perfect', 1);

    if (fast) el.classList.add('skip');
    document.body.classList.remove('pre');
    setTimeout(() => el.remove(), fast ? 220 : 520);
  };
  setTimeout(() => end(false), 1250);
  addEventListener('pointerdown', () => end(true), { once: true });
  addEventListener('keydown', () => end(true), { once: true });
}
function boot() {
  applySettings();
  const wake = () => { SFX.resume(); if (G.music) MUSIC.play(FIGHT ? 'fight' : 'menu'); };
  addEventListener('pointerdown', wake, { once: true });
  addEventListener('keydown', wake, { once: true });
  addEventListener('keydown', onKey);
  // the way back to BeeSide, except inside Bee's Vault (#bv=1), which has its own close button
  if ((ON_SITE || window.BS_ROUTE) && !/(^|[#&])bv=1(&|$)/.test(location.hash)) $('#toBeeside').hidden = false;
  setTab('menu');
  intro();
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in ICON) delete ICON[k]; for (const k in CRATE_ICON) delete CRATE_ICON[k]; for (const k in PACK_ICON) delete PACK_ICON[k]; if (!FIGHT) renderView(); });
  if (!G.starter || !(G.named || G.nick)) setTimeout(welcome, REDUCED ? 300 : 1500);
  netInit();
}

// hooks for automated tests
window.BB = {
  get G() { return G; }, get net() { return NET; }, get fight() { return FIGHT; }, get mm() { return MM; },
  bot: (id, lvl) => { if (id) { G.owned[id] = G.owned[id] || { lvl: lvl || 1, copies: 0 }; G.eq = id; } botFight(); return !!FIGHT; },
  skip: skipFight,
  run(secs) { const F = FIGHT; if (!F) return null; F.phase = 'run'; showBanner(F, ''); const end = F.S.t + secs; while (F.S.t < end && !F.S.over) { step(F.S); F.arena.events(F.S); F.arena.step(DT); } F.arena.draw(F.S, F.S.t); updatePlates(F); return { t: F.S.t, hp: F.S.F.map(f => Math.ceil(f.hp)), over: F.S.over }; },
  finish() { const F = FIGHT; if (!F) return null; skipFight(); fightFrame(F, 0.016); F.pt = 2; fightFrame(F, 0.016); return { winner: F.S.winner, coins: G.coins, tro: G.tro }; },
  crate(id) { const cr = CRATES.find(c => c.id === id) || STARTER; if (cr === STARTER) openCrate(STARTER, true); else buyCrate(cr); },
  coins(n) { G.coins = n; save(); renderView(); },
  give(id, lvl) { G.owned[id] = { lvl: lvl || 1, copies: 0 }; if (!G.eq) G.eq = id; G.starter = true; save(); renderView(); },
  tab: setTab, find: findMatch, cancel: cancelMatch, ball: openBall, ghost: ghostMatch, xp: addXp, daily: () => { ensureDaily(); return G.quests; },
};

boot();
</script>
