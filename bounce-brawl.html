<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bounce Brawl by BeeSide Studio's: two balls fight on their own in a box. Collect 30 balls and bet coins against other players.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23ff2d78' stroke='%230f1724' stroke-width='5'/%3E%3Cpath d='M38 14l4 4-14 18-5 1 1-5z' fill='%23d5dce5' stroke='%230f1724' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M20 36l8 8M23 46l-5 5' stroke='%230f1724' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>Bounce Brawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: the BeeSide game shell (ROTFALL 2's): a live fight plays behind a
   numbered menu on the left, the current fighter sits in a card bottom right,
   and every section opens as a full-screen panel with a Back button.
   Bounce Brawl's own colour in the family is pink. */
:root {
  --o: #ff2d78;
  --o2: #ff6a9e;
  --gold: #ffd633;
  --ink: #050506;
  --card: #0c0c0f;
  --line: #1d1d22;
  --line2: #2a2a31;
  --mute: #6b6b75;
  --dim: #44444c;
  --txt: #e6e6ec;
  --you: #4aa3ff;
  --foe: #ff4646;
  --r-C: #9aa3b2; --r-R: #4a9bff; --r-E: #b46bff; --r-L: #ffb020;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --fd: "Bebas Neue", Impact, "Arial Narrow Bold", sans-serif;
  --fb: "Rajdhani", "Segoe UI", Arial, sans-serif;
  --fm: "Share Tech Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--txt); font: 500 15px/1.45 var(--fb); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--o); outline-offset: 2px; }
canvas { display: block; }
svg.i { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }
.coin { color: var(--gold); }
.kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; font: 400 10px/16px var(--fm); color: #777; text-align: center; letter-spacing: 0; }
.lab { font: 700 10px/1.2 var(--fb); letter-spacing: 4px; color: #55555e; text-transform: uppercase; }
.mono { font-family: var(--fm); letter-spacing: 0; }
.noise { position: fixed; inset: 0; opacity: .045; pointer-events: none; z-index: 1; background-size: 200px;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

/* ---- buttons ---- */
.btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line2); color: #8a8a94; padding: 8px 18px; border-radius: 6px; font: 400 17px/1.2 var(--fd); letter-spacing: 4px; transition: border-color .15s, color .15s, background .15s; }
.btn2:hover:not(:disabled), .btn2:focus-visible { border-color: var(--o); color: var(--o); outline: none; }
.btn2:disabled { opacity: .3; cursor: default; }
.btn2.on { border-color: var(--o); color: #fff; background: rgba(255, 45, 120, .1); }
.go { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 18px 13px; border-radius: 8px; background: var(--o); color: #16020a; font: 400 32px/1 var(--fd); letter-spacing: 6px; transition: background .15s, transform .15s var(--ease); }
.go:hover:not(:disabled) { background: var(--o2); transform: translateY(-2px); }
.go:disabled { background: #22222a; color: #55555e; cursor: default; }
.go .kbd { border-color: rgba(22, 2, 10, .35); color: rgba(22, 2, 10, .7); }
.link { color: var(--mute); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.link:hover { color: var(--o); }
.back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line2); border-radius: 6px; color: #888; font: 400 16px/1.2 var(--fd); letter-spacing: 3px; transition: all .15s; }
.back:hover, .back:focus-visible { color: var(--o); border-color: var(--o); outline: none; }

/* ---- main menu ---- */
.scr { position: fixed; inset: 0; z-index: 10; }
#menu { background: linear-gradient(90deg, rgba(5,5,6,.95) 0%, rgba(5,5,6,.78) 36%, rgba(5,5,6,.18) 66%, rgba(5,5,6,.5) 100%); }
#menu .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 66% 50%, transparent 32%, rgba(0,0,0,.7) 92%); }
.m-left { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(520px, 86vw); }
.logo-wrap { width: max-content; max-width: 100%; text-align: center; margin-bottom: 30px; }
.logo-tag, .logo-sub { font: 600 11px/1 var(--fb); color: #55555e; letter-spacing: 6px; }
.logo-tag { margin-bottom: 8px; }
.logo-sub { margin-top: 10px; }
.logo-main { font: 400 92px/.9 var(--fd); letter-spacing: 5px; color: var(--o); white-space: nowrap; }
.logo-main .two { color: var(--txt); margin-left: .16em; }
.m-nav { display: flex; flex-direction: column; gap: 2px; }
.m-item { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; text-align: left; padding: 8px 14px 8px 12px; border-radius: 8px; width: 100%;
  transition: background .25s var(--ease), transform .3s var(--ease); animation: mIn .7s var(--ease) backwards; }
.m-item:nth-child(1) { animation-delay: .05s } .m-item:nth-child(2) { animation-delay: .1s } .m-item:nth-child(3) { animation-delay: .15s } .m-item:nth-child(4) { animation-delay: .2s } .m-item:nth-child(5) { animation-delay: .25s }
@keyframes mIn { from { opacity: 0; transform: translateX(-24px) } }
.m-item::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 2px; border-radius: 2px; background: var(--o); transform: scaleY(0); transition: transform .3s var(--ease); }
.m-n { font: 400 12px var(--fm); color: #44444c; letter-spacing: 1px; transition: color .2s; }
.m-t { font: 400 40px/1 var(--fd); letter-spacing: 4px; color: #8a8a94; transition: color .2s, letter-spacing .3s var(--ease); }
.m-s { grid-column: 2; font: 700 11px/1.3 var(--fb); letter-spacing: 3px; color: #44444c; margin-top: 1px; text-transform: uppercase; transition: color .2s; }
.m-item:hover, .m-item.sel { background: linear-gradient(90deg, rgba(255,45,120,.1), transparent 80%); transform: translateX(6px); }
.m-item:hover::before, .m-item.sel::before { transform: scaleY(1); }
.m-item:hover .m-t, .m-item.sel .m-t { color: #fff; letter-spacing: 6px; }
.m-item:hover .m-n, .m-item.sel .m-n { color: var(--o); }
.m-item:hover .m-s, .m-item.sel .m-s { color: #94506c; }
.m-item.play .m-t { color: var(--o); }
.m-item.play:hover .m-t, .m-item.play.sel .m-t { color: var(--o2); }
.m-item:focus-visible { outline: none; }
.m-card { position: absolute; right: max(clamp(24px, 6vw, 100px), env(safe-area-inset-right, 0px)); bottom: clamp(24px, 8vh, 90px); width: 290px; padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(160deg, rgba(26,6,15,.88), rgba(6,6,8,.88)); backdrop-filter: blur(4px); animation: mIn .8s var(--ease) .3s backwards; }
.m-card .who { display: flex; align-items: center; gap: 12px; margin: 10px 0 12px; }
.m-card .who img { width: 64px; height: 64px; }
.m-card .nm { font: 400 28px/1 var(--fd); letter-spacing: 3px; }
.m-card .tg { font-size: 12px; color: #77777f; margin-top: 3px; font-weight: 600; }
.m-card .row { display: flex; justify-content: space-between; align-items: center; font: 700 11px/1 var(--fb); letter-spacing: 2px; color: #55555e; padding-top: 10px; border-top: 1px solid var(--line); text-transform: uppercase; }
.m-card .row + .row { border-top: 0; padding-top: 7px; }
.m-card .row b { font: 400 14px var(--fm); letter-spacing: 0; color: var(--txt); display: inline-flex; align-items: center; gap: 5px; }
.m-hint { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); bottom: 22px; font: 700 11px/1 var(--fb); letter-spacing: 3px; color: #3a3a40; display: flex; gap: 14px; align-items: center; }
.m-hint span { display: inline-flex; gap: 5px; align-items: center; }
.m-ver { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); top: 18px; font: 400 10px var(--fm); color: #3a3a40; letter-spacing: 2px; text-transform: uppercase; }
.m-top { position: absolute; left: max(clamp(24px, 7vw, 110px), env(safe-area-inset-left, 0px)); top: 18px; display: flex; align-items: center; gap: 16px; z-index: 2; }
.m-online { font: 400 11px var(--fm); color: #55555e; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
#toBeeside { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px 7px 12px; border: 1px solid rgba(255,45,120,.35); border-radius: 5px; background: rgba(255,45,120,.06); color: var(--o); text-decoration: none; font: 400 17px/1 var(--fd); letter-spacing: 3px; transition: all .18s; }
#toBeeside:hover, #toBeeside:focus-visible { background: rgba(255,45,120,.14); border-color: var(--o); outline: none; }
#toBeeside[hidden] { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #3a3a40; flex: none; }
.dot.live { background: #5cff9d; }

/* ---- panels ---- */
.panel { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(ellipse at 70% 0%, rgba(70,8,34,.42), transparent 60%), var(--ink); animation: panIn .45s var(--ease); }
@keyframes panIn { from { opacity: 0; transform: translateX(40px) } }
.pan-in { max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding-block: 30px 50px;
  padding-left: max(clamp(16px, 4vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 4vw, 40px), env(safe-area-inset-right, 0px)); }
.pan-head { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; }
.pan-t { font: 400 52px/.9 var(--fd); letter-spacing: 6px; color: var(--o); }
.pan-s { font: 700 12px/1.2 var(--fb); color: #55555e; letter-spacing: 4px; margin-bottom: 6px; text-transform: uppercase; }
.pan-cash { margin-left: auto; display: flex; gap: 16px; font: 400 16px var(--fm); align-items: center; }
.pan-cash span { display: inline-flex; gap: 6px; align-items: center; }
.sec { font: 700 11px/1 var(--fb); letter-spacing: 5px; color: #55555e; margin: 26px 0 12px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec:first-child { margin-top: 0; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); }
.box + .box { margin-top: 12px; }
.box .h { font: 700 10px/1 var(--fb); letter-spacing: 4px; color: #55555e; margin-bottom: 12px; text-transform: uppercase; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #140a10, #060607 70%); }
.stage canvas { width: 100%; aspect-ratio: 1; }
.cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; pointer-events: none; }
.cap .n { font: 400 34px/1 var(--fd); letter-spacing: 5px; }
.cap .t { font-size: 13px; color: #77777f; letter-spacing: 1px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); }
.tile .l { font: 700 10px/1 var(--fb); letter-spacing: 3px; color: #55555e; text-transform: uppercase; }
.tile .v { font: 400 38px/1 var(--fd); letter-spacing: 2px; margin-top: 10px; color: #eee; }
.tile.hi .v { color: var(--o); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line2); border-radius: 7px; font: 400 15px/1.1 var(--fd); letter-spacing: 2px; color: #88888f; transition: all .15s; }
.chip:hover { border-color: #5a2238; color: #ccc; }
.chip.sel { border-color: var(--o); color: #fff; background: rgba(255,45,120,.1); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
.seg button { padding: 6px 12px; font: 400 14px/1.2 var(--fd); letter-spacing: 2px; color: #77777f; transition: all .15s; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.sel { background: rgba(255,45,120,.16); color: #fff; }
.seg button:hover:not(.sel) { color: #ccc; }
.empty { color: var(--mute); font-size: 14px; padding: 6px 2px; font-weight: 600; }

/* fight panel */
.fp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.stakes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stake { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .15s; }
.stake .v { font: 400 26px/1 var(--fd); letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
.stake .v svg { width: 15px; height: 15px; color: var(--gold); }
.stake small { font: 400 10px/1 var(--fm); color: #66666e; }
.stake:hover:not(:disabled) { border-color: #5a2238; }
.stake.sel { border-color: var(--o); background: rgba(255,45,120,.1); }
.stake.sel small { color: #c0708f; }
.stake:disabled { opacity: .3; cursor: default; }
.status { display: flex; align-items: center; gap: 8px; font: 400 12px var(--fm); color: #66666e; margin-top: 12px; }
.rank { display: grid; grid-template-columns: 54px 1fr; gap: 4px 14px; align-items: center; }
.rank canvas { grid-row: span 3; width: 54px; height: 54px; }
.rank .rn { font: 400 32px/1 var(--fd); letter-spacing: 3px; }
.rank .bar { height: 6px; border-radius: 3px; background: #1a1a1f; overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--gold); }
.rank .nx { font: 400 11px var(--fm); color: #66666e; }
.fp .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.botline { margin-top: 16px; font-size: 13px; color: #66666e; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }

/* balls */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.bc { --c: #888; position: relative; overflow: hidden; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 12px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(170deg, #0f0f12, #08080a); transition: border-color .2s, transform .2s var(--ease); }
.bc::before { content: ""; position: absolute; right: -34px; top: -34px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); pointer-events: none; }
.bc:hover { border-color: #3a1a28; transform: translateY(-2px); }
.bc.sel { border-color: var(--o); }
.bc img { grid-row: span 3; width: 58px; height: 58px; }
.bc .n { font: 400 22px/1 var(--fd); letter-spacing: 2px; color: #ddd; }
.bc .r { font: 700 9px/1 var(--fb); letter-spacing: 3px; text-transform: uppercase; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 14px; height: 3px; border-radius: 2px; background: #26262c; }
.pips i.on { background: var(--o); }
.bc.locked { opacity: .55; }
.bc.locked img { filter: grayscale(1) brightness(.55); }
.bc .eq { position: absolute; top: 10px; right: 10px; font: 400 10px var(--fm); color: var(--o); letter-spacing: 1px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; text-align: left; width: min(860px, 100%); }
.stat { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; margin-bottom: 9px; }
.stat span { font: 700 11px/1 var(--fb); letter-spacing: 3px; color: #66666e; text-transform: uppercase; }
.stat .bar { display: flex; gap: 3px; }
.stat .bar i { flex: 1; height: 6px; border-radius: 2px; background: #1c1c21; }
.stat .bar i.on { background: var(--o); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
.kv dt { font: 700 10px/1.8 var(--fb); letter-spacing: 3px; color: #55555e; text-transform: uppercase; }
.kv dd { margin: 0; font-weight: 600; color: #c8c8d0; }

/* crates */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.crate { --c: #888; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: linear-gradient(170deg, #0f0f12, #08080a); display: flex; flex-direction: column; gap: 12px; }
.crate::before { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%); pointer-events: none; }
.crate .top { display: flex; gap: 14px; align-items: center; }
.crate .top img { width: 74px; height: 74px; }
.crate .n { font: 400 26px/1 var(--fd); letter-spacing: 2px; }
.crate .t { font: 700 9px/1 var(--fb); letter-spacing: 3px; margin-top: 5px; color: var(--c); text-transform: uppercase; }
.crate p { margin: 0; font-size: 13px; color: #88888f; line-height: 1.5; }
.odds { display: grid; gap: 6px; }
.odd { display: grid; grid-template-columns: 84px 1fr 38px; gap: 8px; align-items: center; font: 700 9px/1 var(--fb); letter-spacing: 2px; text-transform: uppercase; color: #66666e; }
.odd .b { height: 4px; border-radius: 2px; background: #1a1a1f; overflow: hidden; }
.odd .b i { display: block; height: 100%; }
.odd b { font: 400 11px var(--fm); color: #aaa; text-align: right; letter-spacing: 0; }
.inside { display: flex; flex-wrap: wrap; gap: 2px; }
.inside img { width: 24px; height: 24px; }
.crate .btn2 { justify-content: space-between; }
.crate .btn2 b { font: 400 14px var(--fm); letter-spacing: 0; display: inline-flex; gap: 5px; align-items: center; color: var(--gold); }

/* players */
.pcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.prow { display: grid; grid-template-columns: 28px 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 8px; }
.prow .pos { font: 400 12px var(--fm); color: #55555e; }
.prow img { width: 40px; height: 40px; }
.prow b { display: block; font: 400 21px/1 var(--fd); letter-spacing: 2px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow small { font-size: 12px; color: #66666e; font-weight: 600; }
.prow .tr { font: 400 14px var(--fm); display: inline-flex; gap: 5px; align-items: center; color: var(--txt); }
.prow .tr svg { color: var(--gold); }
.prow.me { border-color: #3a1a28; }

/* settings */
.st-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 8px; flex-wrap: wrap; }
.st-row .l { font: 400 19px/1.1 var(--fd); letter-spacing: 2px; color: #ccc; }
.st-row .d { font-size: 12px; color: #55555e; font-weight: 600; }
.st-row input { min-width: 0; flex: 1; max-width: 280px; background: #08080a; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; font: 400 20px var(--fd); letter-spacing: 3px; color: #fff; outline: none; }
.st-row input:focus { border-color: var(--o); }

/* ---- overlays (crates, matchmaking, welcome) ---- */
.ov { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; text-align: center; box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 45%, rgba(30,4,15,.97), rgba(2,2,3,.985) 70%); animation: fadeIn .3s ease;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@keyframes fadeIn { from { opacity: 0 } }

<script>

// ===== core: deterministic maths ==========================================
// A fight is played out from a seed, separately in each player's browser, so

const OT_START = 45, OT_SHRINK = 30, OT_MIN = 0.56; // overtime: the box closes to 56%
const OT_DMG = 60;                     // ...and from 60 s all damage keeps rising
const T_LIMIT = 120;                   // after this, most HP left (as a share) wins
const MAXLVL = 7;

}

function rng(seed) {

    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function hashStr(s) {

  return h >>> 0;
}

// squared distance from a point to a segment
function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;

// S.projs = projectiles, S.hz = hazards on the floor (fire, bombs, holes...).
// S.ev collects what happened this step for the renderer (sounds, numbers).

  c[0] = f.x + ux * a; c[1] = f.y + uy * a; c[2] = f.x + ux * w.len; c[3] = f.y + uy * w.len;

// ---- damage and healing -------------------------------------------------
function hurt(S, src, t, amt, kind, x, y) {

  if (kind === 'melee' || kind === 'contact') a *= 1 - t.marmor;

    t.dotAcc += a;
    if (t.dotAcc >= 1) { const n = Math.floor(t.dotAcc); t.dotAcc -= n; emit(S, { e: 'hit', id: t.id, x: t.x, y: t.y, a: n, k: kind }); }

}

}
// damage everything of the other side inside a circle
function aoe(S, src, x, y, R, dmg, knock, skipId, kind) {
  for (const t of S.bodies) {
    if (t.side === src.side || !tangible(t) || t.id === skipId) continue;
    const dx = t.x - x, dy = t.y - y, d = vlen(dx, dy);
    if (d > R + t.r) continue;
    hurt(S, src, t, dmg, kind || 'blast', t.x, t.y);
    if (knock && canMove(S, t)) { const l = d || 1; t.vx += dx / l * knock / t.m; t.vy += dy / l * knock / t.m; }
  }
}

function tickStatus(S, b, dt) {
  const s = b.st;
  if (s.burnT > 0) { s.burnT -= dt; hurt(S, s.burnBy, b, 3.2 * dt, 'burn'); }
  if (s.poison > 0) {
    hurt(S, s.poisonBy, b, s.poison * 0.6 * dt, 'poison');
    if ((s.pdecay -= dt) <= 0) { s.poison--; s.pdecay = 1.6; }
  }
  if (s.frozenT > 0) s.frozenT -= dt;
  if (s.stunT > 0) s.stunT -= dt;
  if (s.phaseT > 0) s.phaseT -= dt;
  if (s.slowT > 0) s.slowT -= dt;
}
function burn(t, src, secs) { if (!t.alive) return; t.st.burnT = Math.max(t.st.burnT, secs); t.st.burnBy = src; }
function poison(t, src, n) { if (!t.alive) return; t.st.poison = Math.min(6, t.st.poison + n); t.st.poisonBy = src; t.st.pdecay = 2; }

// ---- spawning -----------------------------------------------------------
function proj(S, f, k, x, y, vx, vy, o) {
  const p = { k, side: f.side, owner: f, x, y, vx, vy, r: 5, dmg: 3, knock: 120, life: 3, bounce: 0, hit: {}, alive: true };
  for (const key in o) p[key] = o[key];
  S.projs.push(p);
  return p;
}
function hazard(S, f, k, o) {
  const z = { k, side: f.side, owner: f, alive: true, cd: {} };
  for (const key in o) z[key] = o[key];
  S.hz.push(z);
  return z;
}
function spawnDrone(S, f) {
  const d = { id: S.nid++, side: f.side, main: false, owner: f, def: null, x: f.x, y: f.y - f.r,
    vx: (S.rng() - 0.5) * 400, vy: -260, r: 11, m: 0.22, hp: 8 * f.hpMul, maxHp: 8 * f.hpMul, armor: 0, marmor: 0,
    alive: true, st: mkSt(), pc: {}, ram: 3, dotAcc: 0, healAcc: 0 };
  S.bodies.push(d);
  emit(S, { e: 'spawn', id: d.id, x: d.x, y: d.y });
  return d;
}
// where to aim to hit t with something travelling at sp
function lead(S, f, t, sp) {
  let dx = t.x - f.x, dy = t.y - f.y;
  const T = clamp(vlen(dx, dy) / sp, 0, 0.7);
  if (canMove(S, t)) { dx += t.vx * T; dy += t.vy * T + (t.main ? 0.5 * GRAV * T * T : 0); }
  const l = vlen(dx, dy) || 1;
  return [dx / l, dy / l];
}
function toward(a, b) { const dx = b.x - a.x, dy = b.y - a.y, l = vlen(dx, dy) || 1; return [dx / l, dy / l, l]; }

// ---- physics --------------------------------------------------------------
function walls(S, b) {
  const x = S.box; let hit = 0;
  if (b.x - b.r < x.x0) { b.x = x.x0 + b.r; if (b.vx < 0) { b.vx = -b.vx; hit = 1; } }
  else if (b.x + b.r > x.x1) { b.x = x.x1 - b.r; if (b.vx > 0) { b.vx = -b.vx; hit = 1; } }
  if (b.y - b.r < x.y0) { b.y = x.y0 + b.r; if (b.vy < 0) { b.vy = -b.vy; hit = 1; } }
  else if (b.y + b.r > x.y1) { b.y = x.y1 - b.r; if (b.vy > 0) { b.vy = -b.vy; hit = 1; } }
  if (hit && b.main) {
    emit(S, { e: 'wall', id: b.id, x: b.x, y: b.y, sp: vlen(b.vx, b.vy) });
    if (b.def.onWall) b.def.onWall(S, b);
  }
}

function contact(S, f, t, imp) {
  if (!f.alive || !t.alive) return;
  if ((f.pc[t.id] || 0) > S.t) return;
  f.pc[t.id] = S.t + 0.3;
  const mx = (f.x + t.x) / 2, my = (f.y + t.y) / 2;
  if (!f.main) { hurt(S, f.owner, t, f.ram, 'contact', mx, my); return; }
  let d = f.contact * clamp(imp / 500, 0.5, 2);
  if (f.def.onContact) { const r = f.def.onContact(S, f, t, d, imp); if (r !== undefined) d = r; }
  if (d > 0) hurt(S, f, t, d, 'contact', mx, my);
}

function collide(S, a, b) {
  let dx = b.x - a.x, dy = b.y - a.y;
  const rs = a.r + b.r, d2 = dx * dx + dy * dy;
  if (d2 >= rs * rs) return;
  let d = Math.sqrt(d2);
  if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
  const nx = dx / d, ny = dy / d;
  const ia = canMove(S, a) ? 1 / a.m : 0, ib = canMove(S, b) ? 1 / b.m : 0, is = ia + ib;
  const ov = rs - d, pa = is ? ia / is : 0.5, pb = is ? ib / is : 0.5;
  a.x -= nx * ov * pa; a.y -= ny * ov * pa; b.x += nx * ov * pb; b.y += ny * ov * pb;
  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  let imp = 0;
  if (vn < 0 && is > 0) {
    const j = -2 * vn / is;
    a.vx -= j * ia * nx; a.vy -= j * ia * ny; b.vx += j * ib * nx; b.vy += j * ib * ny;
    imp = -vn;
  }
  if (a.main && b.main && imp > 40) emit(S, { e: 'bump', x: a.x + nx * a.r, y: a.y + ny * a.r, sp: imp });
  contact(S, a, b, imp); contact(S, b, a, imp);
}

// the flail's head is a weight on a rope, pushed round and round
function flailStep(S, f, w, h, rt) {
  let dx = w.hx - f.x, dy = w.hy - f.y, d = vlen(dx, dy) || 1;
  if (rt > 0) {
    const ux = dx / d, uy = dy / d;
    w.hvx += -uy * w.dir * 1900 * h * rt; w.hvy += ux * w.dir * 1900 * h * rt;
    w.hvy += GRAV * 0.5 * h;
    w.hvx -= w.hvx * 2 * h; w.hvy -= w.hvy * 2 * h;
    w.hx += w.hvx * h; w.hy += w.hvy * h;
  } else { w.hx += f.vx * h; w.hy += f.vy * h; }
  dx = w.hx - f.x; dy = w.hy - f.y; d = vlen(dx, dy) || 1;
  if (d > w.len) {
    const nx = dx / d, ny = dy / d;
    w.hx = f.x + nx * w.len; w.hy = f.y + ny * w.len;
    const vr = (w.hvx - f.vx) * nx + (w.hvy - f.vy) * ny;
    if (vr > 0) { w.hvx -= vr * nx; w.hvy -= vr * ny; }
  }
  const x = S.box, hr = w.w * 0.5;
  if (w.hx < x.x0 + hr) { w.hx = x.x0 + hr; w.hvx = Math.abs(w.hvx); }
  else if (w.hx > x.x1 - hr) { w.hx = x.x1 - hr; w.hvx = -Math.abs(w.hvx); }
  if (w.hy < x.y0 + hr) { w.hy = x.y0 + hr; w.hvy = Math.abs(w.hvy); }
  else if (w.hy > x.y1 - hr) { w.hy = x.y1 - hr; w.hvy = -Math.abs(w.hvy); }
  wcap(f, w);
}

function weaponHit(S, f, w, t) {
  let nx = t.x - f.x, ny = t.y - f.y;
  const d = vlen(nx, ny) || 1; nx /= d; ny /= d;
  let dmg = w.dmg, kn = w.knock;
  if (w.k === 'flail') {
    const rv = vlen(w.hvx - t.vx, w.hvy - t.vy);
    dmg = w.dmg + rv * 0.0062; kn = w.knock * clamp(rv / 700, 0.4, 1.6);
    const hl = vlen(w.hvx, w.hvy) || 1;
    nx = (nx + w.hvx / hl) * 0.5; ny = (ny + w.hvy / hl) * 0.5;
    const l = vlen(nx, ny) || 1; nx /= l; ny /= l;
    w.hvx *= -0.4; w.hvy *= -0.4;
  }
  if (canMove(S, t)) { t.vx += nx * kn / t.m; t.vy += ny * kn / t.m; }
  if (canMove(S, f)) { f.vx -= nx * kn * 0.2 / f.m; f.vy -= ny * kn * 0.2 / f.m; }
  const px = t.x - nx * t.r, py = t.y - ny * t.r;
  const dealt = hurt(S, f, t, dmg, 'melee', px, py);
  emit(S, { e: 'slash', k: w.k, x: px, y: py, a: dealt, nx, ny });
  if (w.def.stun && t.alive) t.st.stunT = Math.max(t.st.stunT, w.def.stun);
  if (t.main) {
    f.hits++;
    const g = w.def.grow;
    if (g) {
      if (g.dmg) w.dmg += g.dmg;
      if (g.spin) w.spin = Math.min(w.spin + g.spin, g.maxSpin);
      if (g.len) w.len = Math.min(w.len + g.len, g.maxLen);
    }
    if (f.def.onWeaponHit) f.def.onWeaponHit(S, f, w, t);
  }
}

function weaponHits(S, f, w) {
  const c = w.cap, hr = w.w * 0.5;
  for (const t of S.bodies) {
    if (t.side === f.side || !tangible(t)) continue;
    const rr = t.r + hr;
    if (segDist2(t.x, t.y, c[0], c[1], c[2], c[3]) > rr * rr) continue;
    if ((w.hcd[t.id] || 0) > S.t) continue;
    w.hcd[t.id] = S.t + (w.def.hcd || 0.35);
    weaponHit(S, f, w, t);
  }
}

// two weapons meeting bounce off each other and both reverse their spin
function clashes(S) {
  const a = S.F[0], b = S.F[1];
  if (!tangible(a) || !tangible(b)) return;
  for (const wa of a.wep) for (const wb of b.wep) {
    if (wa.cc > S.t || wb.cc > S.t) continue;
    const rr = (wa.w + wb.w) * 0.5;
    if (segSeg2(wa.cap, wb.cap) > rr * rr) continue;
    wa.cc = wb.cc = S.t + 0.18;
    for (const w of [wa, wb]) {
      if (w.k === 'flail') { w.hvx = -w.hvx * 0.8; w.hvy = -w.hvy * 0.8; w.dir = -w.dir; }
      else w.dir = -w.dir;
    }
    const [nx, ny] = toward(a, b);
    if (canMove(S, a)) { a.vx -= nx * 90 / a.m; a.vy -= ny * 90 / a.m; }
    if (canMove(S, b)) { b.vx += nx * 90 / b.m; b.vy += ny * 90 / b.m; }
    emit(S, { e: 'clash', x: (wa.cap[2] + wb.cap[2]) / 2, y: (wa.cap[3] + wb.cap[3]) / 2 });
  }
}

function physics(S, h) {
  const B = S.bodies;
  for (const b of B) {
    if (!b.alive || !canMove(S, b)) continue;
    if (b.main) {
      b.vy += GRAV * h;
      const t = b.foe;
      if (t && tangible(t) && tangible(b)) { const [ux, uy] = toward(b, t); b.vx += ux * HUNT * h; b.vy += uy * HUNT * h; }
    } else if (b.owner) droneSteer(S, b, h);
    b.x += b.vx * h; b.y += b.vy * h;
    walls(S, b);
  }
  for (let i = 0; i < B.length; i++) {
    const a = B[i];
    if (!tangible(a)) continue;
    for (let j = i + 1; j < B.length; j++) {
      const b = B[j];
      if (a.side === b.side || !tangible(b)) continue;
      collide(S, a, b);
    }
  }
  for (const f of S.F) {
    if (!f.alive) continue;
    const rt = rate(S, f);
    for (const w of f.wep) {
      if (w.k === 'flail') flailStep(S, f, w, h, rt);
      else { w.ang += w.dir * w.spin * h * rt; if (w.ang > 1e4 || w.ang < -1e4) w.ang %= TAU; wcap(f, w); }
    }
  }
  for (const f of S.F) if (tangible(f) && rate(S, f) > 0) for (const w of f.wep) weaponHits(S, f, w);
  clashes(S);
}

function droneSteer(S, d, h) {
  const t = d.owner.foe;
  if (!t || !t.alive) return;
  const [ux, uy] = toward(d, t);
  d.vx += ux * 1500 * h; d.vy += uy * 1500 * h;
  const sp = vlen(d.vx, d.vy);
  if (sp > 520) { d.vx *= 520 / sp; d.vy *= 520 / sp; }
}

// ---- projectiles ----------------------------------------------------------
function steerProj(p, t, dt) {
  const sp = vlen(p.vx, p.vy) || 1, ux = p.vx / sp, uy = p.vy / sp;
  const [ex, ey] = toward(p, t);
  const cr = ux * ey - uy * ex, dot = ux * ex + uy * ey, mx = p.turn * dt;
  if (dot > 0 && Math.abs(cr) <= dsin(mx)) { p.vx = ex * sp; p.vy = ey * sp; return; }
  const [rx, ry] = rotv(ux, uy, cr >= 0 ? mx : -mx);
  p.vx = rx * sp; p.vy = ry * sp;
}

function blockedByWeapons(S, p) {
  for (const f of S.F) {
    if (f.side === p.side || !tangible(f)) continue;
    for (const w of f.wep) {
      if (w.def.noBlock) continue;
      const c = w.cap, rr = p.r + w.w * 0.5;
      if (segDist2(p.x, p.y, c[0], c[1], c[2], c[3]) > rr * rr) continue;
      if (w.k === 'shield') {             // the shield sends it back as its own
        const nx = dcos(w.ang), ny = dsin(w.ang), vn = p.vx * nx + p.vy * ny;
        if (vn < 0) { p.vx -= 2 * vn * nx; p.vy -= 2 * vn * ny; }
        p.side = f.side; p.owner = f; p.hit = {}; p.home = 0; p.life = Math.max(p.life, 1.5);
        emit(S, { e: 'reflect', x: p.x, y: p.y });
        return true;
      }
      p.alive = false;
      emit(S, { e: 'block', x: p.x, y: p.y, k: p.k });
      return true;
    }
  }
  return false;
}

function projHit(S, p, t) {
  p.hit[t.id] = 1;
  const sp = vlen(p.vx, p.vy) || 1;
  if (p.knock && canMove(S, t)) { t.vx += p.vx / sp * p.knock / t.m; t.vy += p.vy / sp * p.knock / t.m; }
  hurt(S, p.owner, t, p.dmg, 'proj', p.x, p.y);
  if (p.slow && t.alive) t.st.slowT = Math.max(t.st.slowT, p.slow);
  if (p.heal) heal(S, p.owner, p.heal * p.owner.dmgMul);
  if (p.blast) { aoe(S, p.owner, p.x, p.y, p.blast, p.bdmg, 220, t.id); emit(S, { e: 'boom', x: p.x, y: p.y, r: p.blast, small: 1 }); }
  if (t.main && p.owner.def.onProjHit) p.owner.def.onProjHit(S, p.owner, p, t);
  emit(S, { e: 'phit', k: p.k, x: p.x, y: p.y });
  if (!p.pierce) p.alive = false;
}

function projStep(S, dt) {
  const x = S.box;
  for (const p of S.projs) {
    if (!p.alive || S.tstop[p.side] > 0) continue;
    if ((p.life -= dt) <= 0) { p.alive = false; continue; }
    const tgt = p.owner.foe;
    if (p.home && tgt && tangible(tgt)) steerProj(p, tgt, dt);
    if (p.acc) {
      const sp = vlen(p.vx, p.vy) || 1, ns = Math.min(p.max, sp + p.acc * dt);
      p.vx *= ns / sp; p.vy *= ns / sp;
    }
    const ox = p.x, oy = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    let out = 0;
    if (p.x - p.r < x.x0) { p.x = x.x0 + p.r; p.vx = Math.abs(p.vx); out = 1; }
    else if (p.x + p.r > x.x1) { p.x = x.x1 - p.r; p.vx = -Math.abs(p.vx); out = 1; }
    if (p.y - p.r < x.y0) { p.y = x.y0 + p.r; p.vy = Math.abs(p.vy); out = 1; }
    else if (p.y + p.r > x.y1) { p.y = x.y1 - p.r; p.vy = -Math.abs(p.vy); out = 1; }
    if (out) {
      if (p.bounce > 0) { p.bounce--; emit(S, { e: 'pbounce', k: p.k, x: p.x, y: p.y }); }
      else {
        p.alive = false;
        if (p.blast) { aoe(S, p.owner, p.x, p.y, p.blast, p.bdmg, 220, 0); emit(S, { e: 'boom', x: p.x, y: p.y, r: p.blast, small: 1 }); }
        else emit(S, { e: 'poof', k: p.k, x: p.x, y: p.y });
        continue;
      }
    }
    if (blockedByWeapons(S, p)) continue;
    for (const t of S.bodies) {
      if (t.side === p.side || !tangible(t) || p.hit[t.id]) continue;
      const rr = t.r + p.r;
      if (segDist2(t.x, t.y, ox, oy, p.x, p.y) > rr * rr) continue;
      projHit(S, p, t);
      if (!p.alive) break;
    }
  }
}

// ---- hazards --------------------------------------------------------------
function rayToBox(S, ox, oy, dx, dy) {
  const x = S.box; let t = 1e9;
  if (dx > 1e-9) t = Math.min(t, (x.x1 - ox) / dx); else if (dx < -1e-9) t = Math.min(t, (x.x0 - ox) / dx);
  if (dy > 1e-9) t = Math.min(t, (x.y1 - oy) / dy); else if (dy < -1e-9) t = Math.min(t, (x.y0 - oy) / dy);
  return [ox + dx * t, oy + dy * t];
}

function hzStep(S, dt) {
  for (const z of S.hz) {
    if (!z.alive) continue;
    const held = S.tstop[z.side] > 0, o = z.owner;
    if (z.k === 'fire' || z.k === 'puddle') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t)) continue;
        const rr = z.r + t.r, dx = t.x - z.x, dy = t.y - z.y;
        if (dx * dx + dy * dy > rr * rr) continue;
        if (z.k === 'fire') burn(t, o, 1.4);
        else if ((z.cd[t.id] || 0) <= S.t) { z.cd[t.id] = S.t + 0.5; poison(t, o, 1); }
      }
    } else if (z.k === 'bomb') {
      if (!held) z.fuse -= dt;
      if (z.fuse <= 0) { z.alive = false; aoe(S, o, z.x, z.y, z.r, z.dmg, z.knock, 0); emit(S, { e: 'boom', x: z.x, y: z.y, r: z.r }); }
    } else if (z.k === 'strike') {
      if (!held) z.tele -= dt;
      if (z.tele <= 0) {
        z.alive = false;
        for (const t of S.bodies) {
          if (t.side === z.side || !tangible(t)) continue;
          const dx = t.x - z.x, dy = t.y - z.y, rr = z.r + t.r;
          if (dx * dx + dy * dy > rr * rr) continue;
          hurt(S, o, t, z.dmg, 'bolt', t.x, t.y);
          if (t.alive) t.st.stunT = Math.max(t.st.stunT, 0.3);
        }
        emit(S, { e: 'bolt', x: z.x, y: z.y, r: z.r });
      }
    } else if (z.k === 'laser') {
      if (!z.fired) {
        if (!o.alive) { z.alive = false; continue; }
        if (!held) z.ch -= dt;
        z.x0 = o.x; z.y0 = o.y;
        if (z.ch > 0.15 && o.foe && !held) {
          const [ex, ey] = toward(o, o.foe);
          z.dx += (ex - z.dx) * 0.16; z.dy += (ey - z.dy) * 0.16;
          const l = vlen(z.dx, z.dy) || 1; z.dx /= l; z.dy /= l;
        }
        const [x1, y1] = rayToBox(S, z.x0, z.y0, z.dx, z.dy); z.x1 = x1; z.y1 = y1;
        if (z.ch <= 0) {
          z.fired = true; z.life = 0.24;
          for (const t of S.bodies) {
            if (t.side === z.side || !tangible(t)) continue;
            const rr = t.r + 24;
            if (segDist2(t.x, t.y, z.x0, z.y0, x1, y1) > rr * rr) continue;
            hurt(S, o, t, z.dmg, 'beam', t.x, t.y);
            if (canMove(S, t)) { t.vx += z.dx * 260 / t.m; t.vy += z.dy * 260 / t.m; }
          }
          emit(S, { e: 'beam', x0: z.x0, y0: z.y0, x1, y1 });
        }
      } else if ((z.life -= dt) <= 0) z.alive = false;
    } else if (z.k === 'hole') {
      if ((z.life -= dt) <= 0) { z.alive = false; continue; }
      for (const t of S.bodies) {
        if (t.side === z.side || !tangible(t)) continue;
        const dx = z.x - t.x, dy = z.y - t.y, d = vlen(dx, dy) || 1;
        if (d > z.R) continue;
        if (canMove(S, t)) { const a = 2200 * (1 - d / z.R); t.vx += dx / d * a * dt; t.vy += dy / d * a * dt; }
        if (d < z.core + t.r) hurt(S, o, t, z.dps * dt, 'hole');
      }
      for (const p of S.projs) {
        if (p.side === z.side || !p.alive) continue;
        const dx = z.x - p.x, dy = z.y - p.y, d = vlen(dx, dy) || 1;
        if (d > z.R) continue;
        if (d < z.core * 0.6) { p.alive = false; emit(S, { e: 'poof', k: p.k, x: p.x, y: p.y }); continue; }
        const a = 2600 * (1 - d / z.R); p.vx += dx / d * a * dt; p.vy += dy / d * a * dt;
      }
    }
  }
}

// ---- one step of the fight ---------------------------------------------
function step(S) {
  if (S.over) return;
  const dt = DT;
  S.t += dt; S.n++;
  if (!S.keep) S.ev.length = 0;
  const k = clamp((S.t - OT_START) / OT_SHRINK, 0, 1), half = ARENA * 0.5 * (1 - (1 - OT_MIN) * k);
  S.box.x0 = S.box.y0 = ARENA * 0.5 - half; S.box.x1 = S.box.y1 = ARENA * 0.5 + half;
  S.ot = S.t > OT_DMG ? 1 + (S.t - OT_DMG) * 0.04 : 1;
  for (let s = 0; s < 2; s++) if (S.tstop[s] > 0) S.tstop[s] -= dt;
  for (const b of S.bodies) if (b.alive) tickStatus(S, b, dt);
  for (const f of S.F) {
    if (!f.alive) continue;
    const r = rate(S, f);
    if (r > 0 && f.def.update) f.def.update(S, f, dt * r);
  }
  const h = dt / SUB;
  for (let i = 0; i < SUB; i++) physics(S, h);
  projStep(S, dt);
  hzStep(S, dt);
  for (const f of S.F) {
    if (!canMove(S, f)) continue;
    const sp = vlen(f.vx, f.vy);
    if (sp < VMIN) { if (sp < 1) { f.vx = VMIN; f.vy = 0; } else { f.vx *= VMIN / sp; f.vy *= VMIN / sp; } }
    else if (sp > VMAX) { f.vx *= VMAX / sp; f.vy *= VMAX / sp; }
  }
  if (S.projs.some(p => !p.alive)) S.projs = S.projs.filter(p => p.alive);
  if (S.hz.some(z => !z.alive)) S.hz = S.hz.filter(z => z.alive);
  if (S.bodies.some(b => !b.alive && !b.main)) S.bodies = S.bodies.filter(b => b.alive || b.main);
  const [a, b] = S.F;
  if (!a.alive || !b.alive || S.t >= T_LIMIT) {
    S.over = true;
    if (!a.alive && !b.alive) S.winner = -1;
    else if (!a.alive) S.winner = 1;
    else if (!b.alive) S.winner = 0;
    else { const fa = a.hp / a.maxHp, fb = b.hp / b.maxHp; S.winner = Math.abs(fa - fb) < 0.005 ? -1 : fa > fb ? 0 : 1; }
    emit(S, { e: 'end', w: S.winner });
  }
}

function fightHash(S) { return hashStr(S.winner + ':' + S.n + ':' + S.F.map(f => Math.round(f.hp * 1000)).join(',')).toString(36); }
// play a whole fight at once (for checks, balance runs and the "skip" button)
function runFight(o, maxSteps) {
  const S = newFight(o), lim = maxSteps || T_LIMIT * 60 + 5;
  while (!S.over && S.n < lim) step(S);
  return S;
}

  if (f.cd[key] === undefined) f.cd[key] = period * 0.55;

  return false;
}

const TEAM = ['#4aa3ff', '#ff4646'];   // you, them
let ME_SIDE = 0;                         // which fight side is "you" (set by the arena)
const teamCol = side => TEAM[side === ME_SIDE ? 0 : 1];
const FONT_D = '"Bebas Neue", Impact, "Arial Narrow Bold", sans-serif';
const FONT_B = 'Rajdhani, "Segoe UI", Arial, sans-serif';
const CHARGE = new Set();              // lasers charging this frame (set by the arena)

function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, k) {
  let [r, g, b] = rgbOf(hex);
  if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function lum(hex) { const [r, g, b] = rgbOf(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function rgba(hex, a) { const [r, g, b] = rgbOf(hex); return `rgba(${r},${g},${b},${a})`; }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function inkFill(c, fill, lw) { c.fillStyle = fill; c.fill(); c.lineWidth = lw || 2; c.strokeStyle = INK; c.stroke(); }

// ---- the emblem on each ball (drawn in a 80-unit box, centred, upright) --------------
// e = emblem colour picked to read on the ball, d = darker, l = lighter
const ART = {
  sword(c, k) {
    c.rotate(-0.62);
    poly(c, [0, -27, 6, -19, 6, 7, -6, 7, -6, -19]); inkFill(c, STEEL);
    c.beginPath(); c.moveTo(0, -24); c.lineTo(0, 5); c.strokeStyle = STEEL_D; c.lineWidth = 1.5; c.stroke();
    rrect(c, -13, 7, 26, 5, 2); inkFill(c, GOLD);
    rrect(c, -3, 12, 6, 11, 2); inkFill(c, WOOD);
    circ(c, 0, 25, 4); inkFill(c, GOLD);
  },
  dagger(c, k) {
    c.rotate(0.7);
    c.beginPath(); c.moveTo(0, -24); c.quadraticCurveTo(9, -10, 7, 4); c.lineTo(-7, 4); c.quadraticCurveTo(-7, -10, 0, -24); c.closePath(); inkFill(c, STEEL);
    rrect(c, -11, 4, 22, 5, 2); inkFill(c, k.d);
    rrect(c, -3, 9, 6, 12, 2); inkFill(c, INK);
  },
  bow(c, k) {
    const rings = [[30, '#f4efe6'], [23, k.d], [16, '#f4efe6'], [9, '#e5484d'], [4, GOLD]];
    for (const [r, col] of rings) { circ(c, 0, 0, r); c.fillStyle = col; c.fill(); }
    circ(c, 0, 0, 30); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    // an arrow stuck in it
    c.save(); c.rotate(-0.8);
    c.beginPath(); c.moveTo(2, 0); c.lineTo(34, 0); c.lineWidth = 3; c.strokeStyle = WOOD_D; c.stroke();
    poly(c, [30, 0, 38, -6, 36, 0, 38, 6]); inkFill(c, '#f4efe6', 1.5);
    c.restore();
  },
  spikes(c, k) {
    const pts = [];
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16, r = i % 2 ? 9 : 22; pts.push(Math.cos(a) * r, Math.sin(a) * r); }
    poly(c, pts); inkFill(c, k.l);
    circ(c, 0, 0, 5); c.fillStyle = k.d; c.fill();
  },
  axe(c, k) {
    c.rotate(-0.5);
    rrect(c, -3, -24, 6, 50, 3); inkFill(c, WOOD);
    c.beginPath(); c.moveTo(2, -22); c.quadraticCurveTo(26, -30, 24, -6); c.quadraticCurveTo(16, -10, 2, -6); c.closePath(); inkFill(c, STEEL);
  },
  spear(c, k) {
    c.rotate(0.35);
    rrect(c, -2.5, -6, 5, 34, 2); inkFill(c, WOOD);
    c.beginPath(); c.moveTo(0, -30); c.quadraticCurveTo(11, -14, 0, -2); c.quadraticCurveTo(-11, -14, 0, -30); c.closePath(); inkFill(c, STEEL);
    rrect(c, -5, -4, 10, 4, 1); inkFill(c, k.d, 1.5);
  },
  flail(c, k) {
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10; circ(c, Math.cos(a) * 30, Math.sin(a) * 30, 3); c.fillStyle = k.d; c.fill(); }
    const pts = [];
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16, r = i % 2 ? 12 : 19; pts.push(Math.cos(a) * r, Math.sin(a) * r); }
    poly(c, pts); inkFill(c, STEEL_D);
    circ(c, 0, 0, 11); inkFill(c, STEEL);
  },
  cannon(c, k) {
    circ(c, 0, 0, 22); inkFill(c, k.d);
    circ(c, 0, 0, 14); c.fillStyle = INK; c.fill();
    circ(c, -4, -4, 4); c.fillStyle = rgba('#ffffff', 0.25); c.fill();
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; circ(c, Math.cos(a) * 30, Math.sin(a) * 30, 2.6); c.fillStyle = k.l; c.fill(); }
  },
  hammer(c, k) {
    c.rotate(0.55);
    rrect(c, -3, -10, 6, 36, 3); inkFill(c, WOOD);
    rrect(c, -18, -24, 36, 16, 3); inkFill(c, STEEL_D);
    rrect(c, -18, -24, 7, 16, 2); c.fillStyle = STEEL; c.fill();
  },
  scythe(c, k) {
    c.beginPath(); c.arc(0, 0, 24, -2.3, 1.2); c.arc(7, -6, 18, 1.0, -2.0, true); c.closePath(); inkFill(c, k.l);
    circ(c, 15, -18, 2.5); c.fillStyle = k.d; c.fill();
    circ(c, 20, 6, 1.8); c.fill();
  },
  laser(c, k, f, t) {
    const ch = f && CHARGE.has(f) ? 1 : 0;
    circ(c, 0, 0, 27); inkFill(c, k.d);
    circ(c, 0, 0, 19); c.fillStyle = '#bff4ff'; c.fill();
    circ(c, 0, 0, 11 + ch * 3); c.fillStyle = ch ? '#ffffff' : '#5fe0f7'; c.fill();
    circ(c, -6, -6, 4); c.fillStyle = rgba('#ffffff', 0.85); c.fill();
  },
  missile(c, k) {
    c.save(); circ(c, 0, 0, 40); c.clip();
    c.rotate(-0.6);
    c.fillStyle = '#f6c33c'; c.fillRect(-60, -11, 120, 22);
    c.fillStyle = INK;
    for (let x = -60; x < 60; x += 16) poly(c, [x, -11, x + 8, -11, x - 2, 11, x - 10, 11]), c.fill();
    c.restore();
    c.save(); c.rotate(-0.6);
    c.beginPath(); c.moveTo(-40, -11); c.lineTo(40, -11); c.moveTo(-40, 11); c.lineTo(40, 11); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    c.restore();
  },
  shield(c, k) {
    c.beginPath(); c.moveTo(0, -26); c.quadraticCurveTo(14, -20, 21, -22); c.quadraticCurveTo(22, 8, 0, 27); c.quadraticCurveTo(-22, 8, -21, -22); c.quadraticCurveTo(-14, -20, 0, -26); c.closePath();
    inkFill(c, k.l);
    c.save(); c.clip(); c.fillStyle = k.d; c.fillRect(-4, -30, 8, 60); c.fillRect(-30, -8, 60, 7); c.restore();
  },
  tank(c, k) {
    c.save(); circ(c, 0, 0, 40); c.clip();
    c.fillStyle = k.d; c.fillRect(-50, -12, 100, 24);
    c.restore();
    c.beginPath(); c.moveTo(-40, -12); c.lineTo(40, -12); c.moveTo(-40, 12); c.lineTo(40, 12); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    for (let i = -2; i <= 2; i++) { circ(c, i * 14, 0, 3); c.fillStyle = k.l; c.fill(); }
    circ(c, 0, -24, 8); inkFill(c, k.d);
    circ(c, 0, -24, 3); c.fillStyle = k.l; c.fill();
  },
  thorns(c, k) {
    c.lineWidth = 2.5; c.strokeStyle = k.d;
    for (const x of [-18, 0, 18]) { c.beginPath(); c.moveTo(x, -34 + Math.abs(x) * 0.4); c.quadraticCurveTo(x * 1.25, 0, x, 34 - Math.abs(x) * 0.4); c.stroke(); }
    c.fillStyle = '#f4efe6';
    for (const [x, y] of [[-9, -18], [9, -6], [-9, 8], [9, 20], [-24, -2], [24, 6]]) { poly(c, [x, y - 4, x + 2, y + 2, x - 2, y + 2]); c.fill(); }
    circ(c, 0, -26, 5); c.fillStyle = '#ff6fae'; c.fill();
  },
  medic(c, k) {
    rrect(c, -8, -24, 16, 48, 4); inkFill(c, '#ffffff', 2);
    rrect(c, -24, -8, 48, 16, 4); inkFill(c, '#ffffff', 2);
    c.fillStyle = '#ffffff'; c.fillRect(-6.5, -6.5, 13, 13);
    rrect(c, -4, -18, 8, 36, 2); c.fillStyle = '#e5484d'; c.fill();
    rrect(c, -18, -4, 36, 8, 2); c.fill();
  },
  balloon(c, k) {
    c.beginPath(); c.ellipse(-13, -15, 7, 11, -0.6, 0, TAU); c.fillStyle = rgba('#ffffff', 0.7); c.fill();
    circ(c, -3, -27, 2.5); c.fill();
  },
  ghost(c, k, f, t) {
    const blink = f && ((t * 0.7) % 3) < 0.08;
    for (const x of [-11, 11]) { c.beginPath(); c.ellipse(x, -5, 6, blink ? 1.2 : 9, 0, 0, TAU); c.fillStyle = INK; c.fill(); }
    if (!blink) for (const x of [-9, 13]) { circ(c, x, -9, 2); c.fillStyle = '#ffffff'; c.fill(); }
    c.beginPath(); c.ellipse(0, 15, 6, 5, 0, 0, TAU); c.fillStyle = INK; c.fill();
  },
  vampire(c, k) {
    c.save(); circ(c, 0, 0, 40); c.clip();
    c.beginPath(); c.moveTo(-50, -50); c.lineTo(50, -50); c.lineTo(50, -16); c.quadraticCurveTo(20, -22, 0, -6); c.quadraticCurveTo(-20, -22, -50, -16); c.closePath();
    c.fillStyle = INK; c.fill();
    c.restore();
    for (const s of [-1, 1]) { poly(c, [s * 4, 0, s * 20, -4, s * 16, 6]); inkFill(c, '#ffd166', 1.5); }
    c.beginPath(); c.moveTo(-14, 16); c.quadraticCurveTo(0, 22, 14, 16); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();
    for (const s of [-1, 1]) { poly(c, [s * 6, 17, s * 9, 18, s * 7.5, 26]); inkFill(c, '#ffffff', 1.2); }
  },
  fire(c, k, f, t) {
    const w = 1 + 0.06 * Math.sin(t * 13), h = 1 + 0.08 * Math.sin(t * 9 + 1);
    c.save(); c.scale(w, h);
    c.beginPath(); c.moveTo(0, 26); c.bezierCurveTo(-22, 24, -24, 2, -10, -10); c.bezierCurveTo(-10, -2, -6, 0, -4, 2);
    c.bezierCurveTo(-8, -14, 0, -22, 4, -30); c.bezierCurveTo(6, -18, 22, -12, 20, 6); c.bezierCurveTo(18, 22, 8, 26, 0, 26); c.closePath();
    inkFill(c, '#ffd166', 2);
    c.beginPath(); c.moveTo(0, 22); c.bezierCurveTo(-11, 21, -11, 8, -3, 0); c.bezierCurveTo(-2, 8, 4, 8, 4, 2); c.bezierCurveTo(12, 8, 10, 21, 0, 22); c.closePath();
    c.fillStyle = '#fff4d1'; c.fill();
    c.restore();
  },
  poison(c, k) {
    c.beginPath(); c.ellipse(0, -5, 18, 17, 0, 0, TAU); inkFill(c, '#f4efe6');
    rrect(c, -10, 7, 20, 12, 3); inkFill(c, '#f4efe6');
    for (const x of [-7, 7]) { c.beginPath(); c.ellipse(x, -6, 5, 6, 0, 0, TAU); c.fillStyle = INK; c.fill(); }
    poly(c, [0, 1, 3, 6, -3, 6]); c.fill();
    c.lineWidth = 1.5; c.strokeStyle = INK;
    for (const x of [-4, 0, 4]) { c.beginPath(); c.moveTo(x, 12); c.lineTo(x, 19); c.stroke(); }
  },
  dice(c, k, f) {
    rrect(c, -26, -26, 52, 52, 10); inkFill(c, '#fffdf8', 2);
    const n = f ? f.u.face || 5 : 5, P = {
      1: [[0, 0]], 2: [[-12, -12], [12, 12]], 3: [[-12, -12], [0, 0], [12, 12]], 4: [[-12, -12], [12, -12], [-12, 12], [12, 12]],
      5: [[-12, -12], [12, -12], [0, 0], [-12, 12], [12, 12]], 6: [[-12, -13], [12, -13], [-12, 0], [12, 0], [-12, 13], [12, 13]] };
    c.fillStyle = n === 1 ? '#e5484d' : INK;
    for (const [x, y] of P[n]) { circ(c, x, y, n === 1 ? 7 : 5); c.fill(); }
  },
  magnet(c, k) {
    c.beginPath(); c.arc(0, -2, 16, PI, 0, true); c.lineWidth = 13; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 9; c.strokeStyle = '#f4efe6'; c.stroke();
    for (const s of [-1, 1]) {
      rrect(c, s * 16 - 6.5, -22, 13, 20, 1); inkFill(c, '#f4efe6');
      rrect(c, s * 16 - 6.5, -27, 13, 8, 1); inkFill(c, STEEL_D);
    }
    c.save(); c.translate(0, 12); c.scale(1, -1); c.restore();
  },
  ice(c, k) {
    c.strokeStyle = '#ffffff'; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      c.save(); c.rotate(i * TAU / 6);
      c.lineWidth = 5; c.strokeStyle = shade(k.col, -0.5);
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -27); c.moveTo(0, -15); c.lineTo(-7, -22); c.moveTo(0, -15); c.lineTo(7, -22); c.stroke();
      c.lineWidth = 2.5; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
    }
    c.lineCap = 'butt';
  },
  bomb(c, k, f, t) {
    c.beginPath(); c.ellipse(-13, -14, 8, 12, -0.7, 0, TAU); c.fillStyle = rgba('#ffffff', 0.22); c.fill();
    c.beginPath(); c.arc(0, 0, 27, 0.4, 1.5); c.lineWidth = 3; c.strokeStyle = rgba('#ffffff', 0.12); c.stroke();
  },
  lightning(c, k) {
    poly(c, [6, -30, -14, 4, -1, 4, -8, 30, 16, -6, 3, -6, 12, -30]); inkFill(c, '#fff8d6', 2.2);
  },
  swarm(c, k) {
    const hex = (x, y, r) => { const p = []; for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + PI / 6; p.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } poly(c, p); };
    for (const [x, y] of [[0, -11], [-10, 7], [10, 7]]) { hex(x, y, 11); inkFill(c, k.l, 2); }
    for (const [x, y] of [[0, -11], [-10, 7], [10, 7]]) { circ(c, x, y, 3.5); c.fillStyle = k.d; c.fill(); }
  },
  blink(c, k, f, t) {
    c.rotate(t * 2.2);
    c.lineWidth = 4; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      c.beginPath(); c.arc(0, 0, 9 + i * 8, i * 2.1, i * 2.1 + 2.6); c.strokeStyle = i === 1 ? '#ffffff' : k.l; c.stroke();
    }
    c.lineCap = 'butt';
  },
  blackhole(c, k, f, t) {
    const ring = (front) => {
      c.save(); c.rotate(-0.45);
      c.beginPath(); c.ellipse(0, 0, 36, 11, 0, front ? 0 : PI, front ? PI : TAU);
      c.lineWidth = 6; c.strokeStyle = '#ff9a3c'; c.stroke();
      c.lineWidth = 2; c.strokeStyle = '#ffe1a8'; c.stroke();
      c.restore();
    };
    ring(false);
    circ(c, 0, 0, 16); c.fillStyle = '#000000'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#ffb35c'; c.stroke();
    ring(true);
    for (let i = 0; i < 5; i++) { const a = t * 0.6 + i * 1.3; circ(c, Math.cos(a) * (24 + i * 2), Math.sin(a) * (20 - i), 1.3); c.fillStyle = '#ffffff'; c.fill(); }
  },
  clock(c, k) {
    circ(c, 0, 0, 32); inkFill(c, '#fbf6e6', 2);
    for (let i = 0; i < 12; i++) {
      c.save(); c.rotate(i * TAU / 12);
      c.fillStyle = INK; c.fillRect(-1.2, -30, 2.4, i % 3 ? 4 : 8);
      c.restore();
    }
    circ(c, 0, 0, 3.5); c.fillStyle = INK; c.fill();
  },
  dummy(c, k) {
    c.lineWidth = 3; c.strokeStyle = '#e5484d';
    circ(c, 0, 0, 22); c.stroke(); circ(c, 0, 0, 10); c.stroke();
    c.lineWidth = 2; c.strokeStyle = k.d;
    c.beginPath(); c.moveTo(-30, -30); c.lineTo(30, 30); c.moveTo(30, -30); c.lineTo(-30, 30); c.globalAlpha *= 0.4; c.stroke();
  },
};

// details that stick out past the outline (drawn before the ball)
const ART_OUT = {
  spikes(c, k, f) {
    const off = f ? f.u.off || 0 : 0;
    for (let i = 0; i < 8; i++) {
      const a = off + i * TAU / 8 + TAU / 16, ca = Math.cos(a), sa = Math.sin(a);
      poly(c, [ca * 36 - sa * 7, sa * 36 + ca * 7, ca * 50, sa * 50, ca * 36 + sa * 7, sa * 36 - ca * 7]);
      inkFill(c, shade(k.col, 0.35), 2);
    }
  },
  thorns(c, k) {
    for (let i = 0; i < 14; i++) {
      const a = i * TAU / 14, ca = Math.cos(a), sa = Math.sin(a);
      poly(c, [ca * 37 - sa * 4, sa * 37 + ca * 4, ca * 47, sa * 47, ca * 37 + sa * 4, sa * 37 - ca * 4]);
      inkFill(c, '#f4efe6', 1.5);
    }
  },
  balloon(c, k) {
    c.beginPath(); c.moveTo(0, 40); c.quadraticCurveTo(-9, 56, 3, 66); c.lineWidth = 1.5; c.strokeStyle = INK; c.stroke();
    poly(c, [0, 37, 6, 46, -6, 46]); inkFill(c, shade(k.col, -0.15), 1.5);
  },
  bomb(c, k, f, t) {
    rrect(c, -9, -47, 18, 10, 2); inkFill(c, STEEL_D, 2);
    c.beginPath(); c.moveTo(0, -47); c.quadraticCurveTo(6, -60, 16, -58); c.lineWidth = 3; c.strokeStyle = '#c9a26b'; c.stroke();
    const s = 1 + 0.35 * Math.sin(t * 30);
    c.save(); c.translate(16, -58); c.scale(s, s);
    const p = [];
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, r = i % 2 ? 2.5 : 7; p.push(Math.cos(a) * r, Math.sin(a) * r); }
    poly(c, p); c.fillStyle = '#ffd166'; c.fill();
    circ(c, 0, 0, 2.2); c.fillStyle = '#ffffff'; c.fill();
    c.restore();
  },
  missile(c, k) {
    for (const s of [-1, 1]) {
      rrect(c, s * 38 - 6, -12, 12, 24, 4); inkFill(c, shade(k.col, -0.3), 2);
      circ(c, s * 38, -6, 3); c.fillStyle = INK; c.fill();
      circ(c, s * 38, 5, 3); c.fill();
    }
  },
  vampire(c, k) {
    for (const s of [-1, 1]) {
      c.beginPath(); c.moveTo(s * 30, -22); c.lineTo(s * 50, -36); c.lineTo(s * 46, -24); c.lineTo(s * 56, -22); c.lineTo(s * 44, -12); c.closePath();
      inkFill(c, INK, 1);
    }
  },
};

function artKit(def) {
  const col = def.col, light = lum(col) > 0.62;
  return { col, d: shade(col, -0.45), l: light ? shade(col, -0.25) : shade(col, 0.55), e: light ? shade(col, -0.55) : shade(col, 0.6) };
}
const KITS = {};
function kitOf(def) { return KITS[def.id] || (KITS[def.id] = artKit(def)); }

// a ball: body, shading, its emblem, outline. f = live fighter (or null for icons)
function drawBall(c, def, x, y, r, f, t) {
  const k = kitOf(def), s = r / 40;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (ART_OUT[def.id]) ART_OUT[def.id](c, k, f, t);
  circ(c, 0, 0, 40); c.fillStyle = def.col; c.fill();
  c.save(); circ(c, 0, 0, 40); c.clip();
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(-40, -40, 80, 80);
  circ(c, -4.5, -5.5, 39.5); c.fillStyle = def.col; c.fill();
  if (ART[def.id]) { c.save(); ART[def.id](c, k, f, t); c.restore(); }
  c.beginPath(); c.ellipse(-17, -21, 9, 5, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.28)'; c.fill();
  c.restore();
  circ(c, 0, 0, 40); c.lineWidth = 3.2; c.strokeStyle = INK; c.stroke();
  circ(c, 0, 0, 42.3); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.17)'; c.stroke();   // a light rim, for the dark floor
  c.restore();
}

// icons for menus, cached per ball and size
const ICON = {};
function ballIcon(id, px) {
  const key = id + '@' + px;
  if (ICON[key]) return ICON[key];
  const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cv.height = Math.round(px * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const def = BALL[id], out = ART_OUT[id] ? 0.66 : 0.86;
  drawBall(c, def, px / 2, px / 2 + (id === 'balloon' ? -px * 0.06 : id === 'bomb' ? px * 0.06 : 0), px / 2 * out, null, 0);
  return (ICON[key] = cv.toDataURL());
}

// ---- weapons ------------------------------------------------------------------
function drawWeapon(c, f, w, t) {
  const ux = Math.cos(w.ang), uy = Math.sin(w.ang), r = f.r;
  if (w.k === 'flail') {
    const n = 9;
    for (let i = 1; i < n; i++) {
      const q = i / n, x = f.x + (w.hx - f.x) * q, y = f.y + (w.hy - f.y) * q;
      if (Math.hypot(x - f.x, y - f.y) < r) continue;
      circ(c, x, y, 3.4); c.fillStyle = STEEL_D; c.fill(); c.lineWidth = 1.2; c.strokeStyle = INK; c.stroke();
    }
    const hr = w.w * 0.5;
    c.save(); c.translate(w.hx, w.hy); c.rotate(t * 6 * w.dir);
    const p = [];
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16, rr = i % 2 ? hr * 0.72 : hr * 1.08; p.push(Math.cos(a) * rr, Math.sin(a) * rr); }
    poly(c, p); inkFill(c, STEEL_D, 2);
    circ(c, 0, 0, hr * 0.66); inkFill(c, STEEL, 2);
    circ(c, -hr * 0.2, -hr * 0.22, hr * 0.18); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    c.restore();
    return;
  }
  c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
  const L = w.len;
  switch (w.k) {
    case 'blade': {
      rrect(c, r - 10, -3.5, 20, 7, 2); inkFill(c, WOOD, 1.8);
      rrect(c, r + 8, -12, 6, 24, 2); inkFill(c, GOLD, 1.8);
      poly(c, [r + 14, -6, L - 12, -5, L, 0, L - 12, 5, r + 14, 6]); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(r + 16, 0); c.lineTo(L - 8, 0); c.lineWidth = 1.4; c.strokeStyle = STEEL_D; c.stroke();
      break;
    }
    case 'dagger': {
      rrect(c, r - 8, -3, 14, 6, 2); inkFill(c, INK, 1);
      rrect(c, r + 5, -9, 5, 18, 2); inkFill(c, kitOf(f.def).d, 1.6);
      c.beginPath(); c.moveTo(r + 10, -6); c.quadraticCurveTo(L - 14, -8, L, 1); c.quadraticCurveTo(L - 16, 6, r + 10, 6); c.closePath(); inkFill(c, STEEL, 1.8);
      break;
    }
    case 'axe': {
      rrect(c, r * 0.4, -4, L - r * 0.4 + 4, 8, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head, wd = w.w * 0.5 + 8;
      c.beginPath(); c.moveTo(h0 + 4, 3); c.lineTo(L - 2, 3); c.quadraticCurveTo(L + 10, wd, L - 6, wd + 8);
      c.quadraticCurveTo(h0 + 10, wd - 2, h0 - 2, wd + 10); c.quadraticCurveTo(h0 - 6, 14, h0 + 4, 3); c.closePath();
      c.save(); c.scale(1, -w.dir); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(L - 3, wd + 4); c.quadraticCurveTo(h0 + 8, wd + 1, h0 + 1, wd + 7); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      rrect(c, L - 10, -6, 12, 12, 2); inkFill(c, STEEL_D, 1.8);
      break;
    }
    case 'spear': {
      rrect(c, r * 0.4, -3, L - r * 0.4 - w.head + 6, 6, 3); inkFill(c, WOOD, 1.6);
      const h0 = L - w.head;
      c.beginPath(); c.moveTo(h0, 0); c.quadraticCurveTo(h0 + w.head * 0.45, -12, L, 0); c.quadraticCurveTo(h0 + w.head * 0.45, 12, h0, 0); c.closePath(); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(h0 + 4, 0); c.lineTo(L - 6, 0); c.lineWidth = 1.3; c.strokeStyle = STEEL_D; c.stroke();
      rrect(c, h0 - 4, -5, 7, 10, 2); inkFill(c, kitOf(f.def).d, 1.4);
      break;
    }
    case 'hammer': {
      rrect(c, r * 0.4, -4.5, L - r * 0.4, 9, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head;
      rrect(c, h0, -w.w * 0.5, w.head, w.w, 4); inkFill(c, STEEL_D, 2.2);
      rrect(c, h0 + 3, -w.w * 0.5 + 3, w.head - 6, 7, 2); c.fillStyle = STEEL; c.fill();
      c.fillStyle = INK; c.fillRect(h0 + w.head * 0.5 - 1, -w.w * 0.5, 2, w.w);
      break;
    }
    case 'scythe': {
      rrect(c, r * 0.4, -3.5, L - r * 0.4 + 2, 7, 3); inkFill(c, WOOD_D, 1.6);
      const s = -w.dir;
      c.save(); c.translate(L, 0); c.scale(1, s);
      c.beginPath(); c.moveTo(2, -2); c.quadraticCurveTo(-6, 30, -w.head, 44); c.quadraticCurveTo(-16, 26, -6, -4); c.closePath();
      inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(-4, 4); c.quadraticCurveTo(-10, 28, -w.head + 6, 40); c.lineWidth = 1.6; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      break;
    }
    case 'shield': {
      const half = w.def.arc / 2;
      c.beginPath(); c.arc(0, 0, L + 7, -half, half); c.arc(0, 0, L - 7, half, -half, true); c.closePath();
      inkFill(c, kitOf(f.def).l, 2.4);
      c.beginPath(); c.arc(0, 0, L, -half + 0.12, half - 0.12); c.lineWidth = 3; c.strokeStyle = GOLD; c.stroke();
      for (const a of [-half + 0.18, 0, half - 0.18]) { circ(c, Math.cos(a) * L, Math.sin(a) * L, 2.4); c.fillStyle = INK; c.fill(); }
      break;
    }
    case 'hand': case 'hand2': {
      const wd = w.k === 'hand' ? 5 : 3.4;
      poly(c, [-8, -wd, L - 16, -wd, L - 16, -wd - 5, L, 0, L - 16, wd + 5, L - 16, wd, -8, wd]);
      inkFill(c, w.k === 'hand' ? '#2a2f3a' : '#3a4150', 1.6);
      if (w.k === 'hand2') { circ(c, 0, 0, 5); inkFill(c, GOLD, 1.4); }
      break;
    }
  }
  c.restore();
}

// the bow and the cannon point where they aim
function drawAimGear(c, f, t) {
  const id = f.def.id;
  if (id !== 'bow' && id !== 'cannon') return;
  const a = f.u.aim || [1, 0], ang = Math.atan2(a[1], a[0]);
  c.save(); c.translate(f.x, f.y); c.rotate(ang);
  const r = f.r;
  if (id === 'cannon') {
    rrect(c, 0, -11, r + 22, 22, 4); inkFill(c, '#2b313b', 2.2);
    rrect(c, r + 12, -13, 12, 26, 3); inkFill(c, '#3a424f', 2);
    c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(4, -8, r + 6, 5);
  } else {
    c.beginPath(); c.arc(r - 6, 0, 26, -1.15, 1.15); c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 3.5; c.strokeStyle = WOOD; c.stroke();
    const ex = r - 6 + Math.cos(1.15) * 26, ey = Math.sin(1.15) * 26;
    c.beginPath(); c.moveTo(ex, -ey); c.lineTo(r - 2, 0); c.lineTo(ex, ey); c.lineWidth = 1.2; c.strokeStyle = '#f4efe6'; c.stroke();
  }
  c.restore();
}

// ---- shots --------------------------------------------------------------------
function drawProj(c, p, t) {
  const ang = Math.atan2(p.vy, p.vx);
  c.save(); c.translate(p.x, p.y); c.rotate(ang);
  const col = teamCol(p.side);
  switch (p.k) {
    case 'arrow':
      c.beginPath(); c.moveTo(-18, 0); c.lineTo(6, 0); c.lineWidth = 2.6; c.strokeStyle = WOOD_D; c.stroke();
      poly(c, [10, 0, 2, -4.5, 3, 0, 2, 4.5]); inkFill(c, STEEL, 1.2);
      poly(c, [-18, 0, -23, -5, -14, -1]); c.fillStyle = col; c.fill();
      poly(c, [-18, 0, -23, 5, -14, 1]); c.fill();
      break;
    case 'spike':
      poly(c, [9, 0, -6, -4.5, -3, 0, -6, 4.5]); inkFill(c, '#f4efe6', 1.4);
      break;
    case 'ball':
      circ(c, 0, 0, p.r); inkFill(c, '#2b313b', 2.2);
      circ(c, -p.r * 0.3, -p.r * 0.3, p.r * 0.3); c.fillStyle = 'rgba(255,255,255,0.3)'; c.fill();
      break;
    case 'shard':
      poly(c, [11, 0, 0, -5, -8, 0, 0, 5]); inkFill(c, '#dff7ff', 1.4);
      break;
    case 'missile':
      poly(c, [-6, -3, 2, -3.5, 2, 3.5, -6, 3]); c.fillStyle = '#ff9a3c'; c.fill();
      rrect(c, -8, -4, 16, 8, 3); inkFill(c, '#e9ecef', 1.5);
      poly(c, [8, -4, 14, 0, 8, 4]); inkFill(c, '#e5484d', 1.4);
      poly(c, [-8, -4, -12, -8, -4, -4]); c.fillStyle = col; c.fill();
      poly(c, [-8, 4, -12, 8, -4, 4]); c.fill();
      c.beginPath(); c.moveTo(-9, 0); c.lineTo(-16 - Math.random() * 6, 0); c.lineWidth = 4; c.strokeStyle = 'rgba(255,190,90,0.9)'; c.stroke();
      break;
    case 'bat': {
      c.rotate(-ang);
      const fl = Math.sin(t * 28 + p.x * 0.1) * 0.6;
      c.fillStyle = '#2a1520';
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(0, 0); c.lineTo(s * 13, -6 - fl * 8); c.lineTo(s * 10, 1); c.lineTo(s * 6, -1); c.lineTo(s * 4, 3); c.closePath(); c.fill();
      }
      circ(c, 0, 0, 4.5); c.fill();
      circ(c, -1.6, -1, 1); circ(c, 1.6, -1, 1); c.fillStyle = '#ff4d4d';
      circ(c, -1.6, -1, 1); c.fill(); circ(c, 1.6, -1, 1); c.fill();
      break;
    }
  }
  c.restore();
}

function drawDrone(c, d, t) {
  const col = d.owner.def.col;
  c.save(); c.translate(d.x, d.y);
  const p = [];
  for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + PI / 6; p.push(Math.cos(a) * d.r * 1.15, Math.sin(a) * d.r * 1.15); }
  poly(c, p); inkFill(c, shade(col, 0.25), 2);
  const [ex, ey] = d.owner.foe ? toward(d, d.owner.foe) : [1, 0];
  circ(c, ex * 3, ey * 3, 4); c.fillStyle = INK; c.fill();
  circ(c, ex * 3 + 1, ey * 3 - 1, 1.3); c.fillStyle = '#ffffff'; c.fill();
  const fl = Math.sin(t * 40 + d.id) > 0 ? 1 : 0.6;
  c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(-d.r * 0.9, -d.r * 1.1, 6 * fl, 3, -0.5, 0, TAU); c.ellipse(d.r * 0.9, -d.r * 1.1, 6 * fl, 3, 0.5, 0, TAU);
  c.fillStyle = '#ffffff'; c.fill();
  c.restore();
}

// ---- hazards on the floor -----------------------------------------------------
function drawHazard(c, z, S, t) {
  switch (z.k) {
    case 'fire': {
      const a = clamp(z.life / 2.2, 0, 1);
      const fl = 0.85 + 0.15 * Math.sin(t * 20 + z.x * 0.7);
      c.globalAlpha = a * 0.75;
      circ(c, z.x, z.y, z.r * fl); c.fillStyle = '#ff7a1f'; c.fill();
      circ(c, z.x, z.y - 2, z.r * 0.55 * fl); c.fillStyle = '#ffd166'; c.fill();
      c.globalAlpha = 1;
      break;
    }
    case 'puddle': {
      const a = clamp(z.life / 1, 0, 1) * clamp((S.t - z.t0) / 0.3, 0, 1);
      c.globalAlpha = 0.5 * a;
      c.beginPath(); c.ellipse(z.x, z.y, z.r, z.r * 0.9, 0, 0, TAU); c.fillStyle = '#7bc043'; c.fill();
      c.globalAlpha = 0.8 * a;
      for (let i = 0; i < 4; i++) {
        const q = (t * 0.8 + i * 0.25 + z.x * 0.01) % 1, bx = z.x + Math.cos(i * 1.7 + z.y) * z.r * 0.5, by = z.y + Math.sin(i * 2.3 + z.x) * z.r * 0.4;
        circ(c, bx, by, 2 + q * 5); c.lineWidth = 1.5; c.strokeStyle = '#d7f5a8'; c.stroke();
      }
      c.globalAlpha = 1;
      break;
    }
    case 'bomb': {
      const q = 1 - clamp(z.fuse / 1.2, 0, 1), blink = Math.sin(q * q * 60) > 0;
      c.setLineDash([8, 8]);
      circ(c, z.x, z.y, z.r); c.lineWidth = 2; c.strokeStyle = rgba('#e5484d', 0.25 + 0.5 * q); c.stroke();
      c.setLineDash([]);
      circ(c, z.x, z.y, z.r * q); c.fillStyle = rgba('#e5484d', 0.08 + 0.1 * q); c.fill();
      circ(c, z.x, z.y, 14); inkFill(c, '#20232c', 2.2);
      c.beginPath(); c.moveTo(z.x, z.y - 14); c.quadraticCurveTo(z.x + 5, z.y - 24, z.x + 11, z.y - 22); c.lineWidth = 2.5; c.strokeStyle = '#c9a26b'; c.stroke();
      circ(c, z.x + 11, z.y - 22, blink ? 5 : 3); c.fillStyle = blink ? '#ffffff' : '#ffd166'; c.fill();
      break;
    }
    case 'strike': {
      const q = 1 - clamp(z.tele / 0.45, 0, 1);
      circ(c, z.x, z.y, z.r); c.fillStyle = rgba('#f9d71c', 0.12 + 0.2 * q); c.fill();
      c.setLineDash([10, 7]); c.lineDashOffset = -t * 40;
      circ(c, z.x, z.y, z.r * (1.4 - 0.4 * q)); c.lineWidth = 3; c.strokeStyle = rgba('#c9a400', 0.9); c.stroke();
      c.setLineDash([]);
      break;
    }
    case 'laser': {
      if (!z.fired) {
        const q = 1 - clamp(z.ch / 0.75, 0, 1);
        c.setLineDash([12, 10]); c.lineDashOffset = -t * 120;
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1); c.lineWidth = 1.5 + q * 3; c.strokeStyle = rgba('#00a6c7', 0.35 + 0.5 * q); c.stroke();
        c.setLineDash([]);
      } else {
        const a = clamp(z.life / 0.24, 0, 1);
        c.lineCap = 'round';
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
        c.lineWidth = 34 * a; c.strokeStyle = rgba('#00a6c7', 0.45 * a); c.stroke();
        c.lineWidth = 16 * a; c.strokeStyle = rgba('#7fe9ff', 0.9 * a); c.stroke();
        c.lineWidth = 6 * a; c.strokeStyle = 'rgba(255,255,255,' + a + ')'; c.stroke();
        c.lineCap = 'butt';
      }
      break;
    }
    case 'hole': {
      const age = S.t - z.t0, grow = clamp(age / 0.35, 0, 1) * clamp(z.life / 0.35, 0, 1);
      circ(c, z.x, z.y, z.R * grow); c.fillStyle = 'rgba(40,20,80,0.08)'; c.fill();
      c.save(); c.translate(z.x, z.y); c.scale(grow, grow);
      for (let i = 0; i < 3; i++) {
        c.save(); c.rotate(-t * (2.2 + i) + i * 2);
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, 0, 2.2); c.lineWidth = 5 - i; c.strokeStyle = rgba(i ? '#9b7bff' : '#ff9a3c', 0.75 - i * 0.18); c.stroke();
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, PI, PI + 1.6); c.stroke();
        c.restore();
      }
      circ(c, 0, 0, z.core); c.fillStyle = '#05010d'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#ffb35c'; c.stroke();
      c.restore();
      break;
    }
  }
}

// ===== the arena view: draws a fight and its effects on a canvas =========
const NUMCOL = { burn: '#ff9a3c', poison: '#a5e35f', drain: '#ff5c8a', hole: '#b69cff', regen: '#5be38f' };
const HEAVY = { axe: 1, hammer: 1, flail: 1 };

class Arena {
  constructor(canvas, opt) {
    this.cv = canvas; this.c = canvas.getContext('2d');
    this.opt = opt || {};
    this.fx = []; this.nums = []; this.trail = {};
    this.shake = 0; this.flip = false; this.me = 0; this.hitstop = 0; this.flash = 0;
    this.k = 1; this.ox = 0; this.oy = 0; this.dpr = 1;
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; }
    this.dpr = dpr;
    const pad = this.opt.pad === undefined ? 16 : this.opt.pad;
    if (this.opt.place) {             // the menu's background fight sits where the page wants it
      const p = this.opt.place(w, h);
      this.k = p.size / (ARENA + pad * 2); this.ox = p.x + pad * this.k; this.oy = p.y + pad * this.k;
      return;
    }
    this.k = Math.min(w, h) / (ARENA + pad * 2);
    this.ox = (w - ARENA * this.k) / 2; this.oy = (h - ARENA * this.k) / 2;
  }
  reset() { this.fx.length = 0; this.nums.length = 0; this.trail = {}; this.shake = 0; this.hitstop = 0; this.flash = 0; }

  // turn the fight's events into particles, numbers and sounds
  events(S) {
    for (const e of S.ev) this.ev(S, e);
    S.ev.length = 0;
  }
  burst(x, y, n, col, sp, life, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = sp * (0.4 + Math.random() * 0.8);
      this.fx.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col, size: size * (0.6 + Math.random() * 0.7) });
    }
  }
  num(x, y, txt, col, big, small) {
    if (this.nums.length > 60) this.nums.shift();
    this.nums.push({ x: x + (Math.random() - 0.5) * 14, y, txt, col, big, small, life: small ? 0.6 : 0.95, max: small ? 0.6 : 0.95 });
  }
  ev(S, e) {
    const snd = this.opt.sound ? SFX : null;
    switch (e.e) {
      case 'hit': {
        const tb = this.byId(S, e.id), minor = tb && !tb.main;
        const big = e.a >= 10 && !minor, col = minor ? '#c3cbd5' : NUMCOL[e.k] || (big ? '#ffd166' : '#ffffff');
        this.num(e.x, e.y - 8, String(e.a), col, big, minor);
        if (!DOT[e.k]) {
          this.burst(e.x, e.y, Math.min(14, 3 + e.a), big ? '#ffd166' : '#ffffff', 260 + e.a * 18, 0.32, 3.2);
          this.shake = Math.min(14, this.shake + e.a * 0.45);
          if (big) this.hitstop = Math.max(this.hitstop, 0.06);
          if (snd) snd.hit(e.k, e.a);
        }
        break;
      }
      case 'heal': this.num(e.x, e.y - 30, '+' + e.a, '#5be38f', false); break;
      case 'slash': if (snd) snd.slash(e.k, e.a); this.fx.push({ k: 'slash', x: e.x, y: e.y, nx: e.nx, ny: e.ny, life: 0.18, max: 0.18, heavy: HEAVY[e.k] }); break;
      case 'clash':
        this.burst(e.x, e.y, 12, '#ffe08a', 420, 0.3, 3);
        this.fx.push({ k: 'ring', x: e.x, y: e.y, r0: 6, r1: 34, life: 0.22, max: 0.22, col: '#ffffff', w: 3 });
        this.shake = Math.min(14, this.shake + 3); this.hitstop = Math.max(this.hitstop, 0.035);
        if (snd) snd.clang();
        break;
      case 'wall': if (e.sp > 760) { this.burst(e.x, e.y, 4, '#b8c2cf', 120, 0.3, 3); if (snd) snd.wall(e.sp); } break;
      case 'bump': this.fx.push({ k: 'ring', x: e.x, y: e.y, r0: 4, r1: 22 + e.sp * 0.02, life: 0.2, max: 0.2, col: '#ffffff', w: 2.5 }); if (snd) snd.bump(e.sp); break;
      case 'boom':
        this.fx.push({ k: 'ring', x: e.x, y: e.y, r0: e.r * 0.2, r1: e.r, life: 0.35, max: 0.35, col: e.crit ? '#fff2a8' : '#ff9a3c', w: e.small ? 5 : 9 });
        this.fx.push({ k: 'disc', x: e.x, y: e.y, r: e.r * 0.8, life: 0.18, max: 0.18, col: e.crit ? '#fff7d1' : '#ffd8a0' });
        this.burst(e.x, e.y, e.small ? 10 : 22, e.crit ? '#ffe066' : '#ff8a3c', e.small ? 300 : 520, 0.5, 4.5);
        this.burst(e.x, e.y, e.small ? 4 : 10, '#5a5f6b', 200, 0.8, 6);
        this.shake = Math.min(16, this.shake + (e.small ? 4 : 9));
        if (e.crit) this.num(e.x, e.y - 60, 'SIX!', '#ffd166', true);
        if (snd) snd.boom(!!e.small);
        break;
      case 'bolt':
        this.fx.push({ k: 'bolt', x: e.x, y: e.y, y0: S.box.y0, life: 0.28, max: 0.28, seed: Math.random() * 1000 });
        this.fx.push({ k: 'ring', x: e.x, y: e.y, r0: 10, r1: e.r, life: 0.25, max: 0.25, col: '#fff3a0', w: 5 });
        this.flash = Math.max(this.flash, 0.35); this.shake = Math.min(14, this.shake + 5);
        if (snd) snd.zap();
        break;
      case 'beam': this.shake = Math.min(14, this.shake + 5); if (snd) snd.laser(); break;

}

// menu: a relaxed shuffle in F; fight: a driving loop in A minor that picks up
// in overtime. Notes are scheduled a little ahead on the audio clock.
const MUSIC = (() => {

    menu: { bpm: 96, swing: 0.16,
      bass: [41, 0, 0, 41, 0, 0, 48, 0, 46, 0, 0, 46, 0, 0, 45, 0, 43, 0, 0, 43, 0, 0, 50, 0, 48, 0, 0, 46, 0, 45, 43, 0],
      lead: [0, 0, 65, 0, 69, 0, 72, 0, 0, 0, 70, 0, 69, 0, 0, 0, 0, 0, 67, 0, 70, 0, 74, 0, 72, 0, 0, 70, 0, 69, 0, 0],
      kick: 'x.......x.......x.......x.......', snare: '....x.......x.......x.......x...', hat: '..x...x...x...x...x...x...x...x.' },
    fight: { bpm: 132, swing: 0,
      bass: [45, 45, 57, 45, 45, 57, 45, 55, 41, 41, 53, 41, 43, 43, 55, 43, 45, 45, 57, 45, 45, 57, 45, 55, 41, 41, 53, 41, 40, 40, 52, 44],
      lead: [69, 0, 0, 72, 0, 0, 76, 0, 74, 0, 72, 0, 71, 0, 67, 0, 69, 0, 0, 72, 0, 0, 77, 0, 76, 0, 74, 0, 72, 0, 71, 0],
      kick: 'x...x...x...x...x...x...x..xx...', snare: '....x.......x.......x.......x.x.', hat: 'x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.xx' },

      const b = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate), d = b.getChannelData(0);

      if (S.bass[i]) note('sawtooth', S.bass[i] - 12, t, spb * 1.6, 0.22);

    play(name) {

    if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }
    else e.setAttribute(k, v === true ? '' : v);

}

  const friendly = !!p.isMe;
