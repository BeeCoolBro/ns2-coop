    c.save(); c.translate(16, -58); c.scale(s, s);
    const p = [];
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, r = i % 2 ? 2.5 : 7; p.push(Math.cos(a) * r, Math.sin(a) * r); }
    poly(c, p); c.fillStyle = '#ffd166'; c.fill();
    circ(c, 0, 0, 2.2); c.fillStyle = '#ffffff'; c.fill();
    c.restore();
  },
  missile(c, k) {
    for (const s of [-1, 1]) {
      rrect(c, s * 38 - 6, -12, 12, 24, 4); inkFill(c, shade(k.col, -0.3), 2);
      circ(c, s * 38, -6, 3); c.fillStyle = INK; c.fill();
      circ(c, s * 38, 5, 3); c.fill();
    }
  },
  vampire(c, k) {
    for (const s of [-1, 1]) {
      c.beginPath(); c.moveTo(s * 30, -22); c.lineTo(s * 50, -36); c.lineTo(s * 46, -24); c.lineTo(s * 56, -22); c.lineTo(s * 44, -12); c.closePath();
      inkFill(c, INK, 1);
    }
  },
};

function artKit(def) {
  const col = def.col, light = lum(col) > 0.62;
  return { col, d: shade(col, -0.45), l: light ? shade(col, -0.25) : shade(col, 0.55), e: light ? shade(col, -0.55) : shade(col, 0.6) };
}
const KITS = {};
function kitOf(def) { return KITS[def.id] || (KITS[def.id] = artKit(def)); }

// a ball: body, shading, its emblem, outline. f = live fighter (or null for icons)
function drawBall(c, def, x, y, r, f, t, rot) {
  const k = kitOf(def), s = r / 40;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (ART_OUT[def.id]) ART_OUT[def.id](c, k, f, t);
  circ(c, 0, 0, 40); c.fillStyle = def.col; c.fill();
  c.save(); circ(c, 0, 0, 40); c.clip();
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(-40, -40, 80, 80);
  circ(c, -4.5, -5.5, 39.5); c.fillStyle = def.col; c.fill();
  if (ART[def.id]) { c.save(); if (rot && !def.upright) c.rotate(rot); ART[def.id](c, k, f, t); c.restore(); }
  c.beginPath(); c.ellipse(-17, -21, 9, 5, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.28)'; c.fill();
  c.restore();
  circ(c, 0, 0, 40); c.lineWidth = 3.2; c.strokeStyle = INK; c.stroke();
  circ(c, 0, 0, 42.3); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.17)'; c.stroke();   // a light rim, for the dark floor
  c.restore();
}

// icons for menus, cached per ball and size (a canvas; pic() puts a copy on the page)
const ICON = {};
function ballIcon(id, px) {
  const key = id + '@' + px;
  if (ICON[key]) return ICON[key];
  const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cv.height = Math.round(px * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const def = BALL[id], out = ART_OUT[id] && !def.grows ? 0.66 : 0.86;
  drawBall(c, def, px / 2, px / 2 + (id === 'balloon' ? -px * 0.06 : id === 'bomb' ? px * 0.06 : 0), px / 2 * out, null, 0);
  return (ICON[key] = cv);
}

// ---- weapons ------------------------------------------------------------------
function drawWeapon(c, f, w, t) {
  const w2 = WEAPON2[w.def.look || w.k];
  if (w2) { w2(c, f, w, t); return; }
  const ux = Math.cos(w.ang), uy = Math.sin(w.ang), r = f.r;
  if (w.k === 'flail') {
    const n = 9;
    for (let i = 1; i < n; i++) {
      const q = i / n, x = f.x + (w.hx - f.x) * q, y = f.y + (w.hy - f.y) * q;
      if (Math.hypot(x - f.x, y - f.y) < r) continue;
      circ(c, x, y, 3.4); c.fillStyle = STEEL_D; c.fill(); c.lineWidth = 1.2; c.strokeStyle = INK; c.stroke();
    }
    const hr = w.w * 0.5;
    c.save(); c.translate(w.hx, w.hy); c.rotate(t * 6 * w.dir);
    const p = [];
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16, rr = i % 2 ? hr * 0.72 : hr * 1.08; p.push(Math.cos(a) * rr, Math.sin(a) * rr); }
    poly(c, p); inkFill(c, STEEL_D, 2);
    circ(c, 0, 0, hr * 0.66); inkFill(c, STEEL, 2);
    circ(c, -hr * 0.2, -hr * 0.22, hr * 0.18); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    c.restore();
    return;
  }
  c.save(); c.translate(f.x, f.y); c.rotate(w.ang);
  const L = w.len;
  switch (w.k) {
    case 'blade': {
      rrect(c, r - 10, -3.5, 20, 7, 2); inkFill(c, WOOD, 1.8);
      rrect(c, r + 8, -12, 6, 24, 2); inkFill(c, GOLD, 1.8);
      poly(c, [r + 14, -6, L - 12, -5, L, 0, L - 12, 5, r + 14, 6]); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(r + 16, 0); c.lineTo(L - 8, 0); c.lineWidth = 1.4; c.strokeStyle = STEEL_D; c.stroke();
      break;
    }
    case 'dagger': {
      rrect(c, r - 8, -3, 14, 6, 2); inkFill(c, INK, 1);
      rrect(c, r + 5, -9, 5, 18, 2); inkFill(c, kitOf(f.def).d, 1.6);
      c.beginPath(); c.moveTo(r + 10, -6); c.quadraticCurveTo(L - 14, -8, L, 1); c.quadraticCurveTo(L - 16, 6, r + 10, 6); c.closePath(); inkFill(c, STEEL, 1.8);
      break;
    }
    case 'axe': {
      rrect(c, r * 0.4, -4, L - r * 0.4 + 4, 8, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head, wd = w.w * 0.5 + 8;
      c.beginPath(); c.moveTo(h0 + 4, 3); c.lineTo(L - 2, 3); c.quadraticCurveTo(L + 10, wd, L - 6, wd + 8);
      c.quadraticCurveTo(h0 + 10, wd - 2, h0 - 2, wd + 10); c.quadraticCurveTo(h0 - 6, 14, h0 + 4, 3); c.closePath();
      c.save(); c.scale(1, -w.dir); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(L - 3, wd + 4); c.quadraticCurveTo(h0 + 8, wd + 1, h0 + 1, wd + 7); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      rrect(c, L - 10, -6, 12, 12, 2); inkFill(c, STEEL_D, 1.8);
      break;
    }
    case 'spear': {
      rrect(c, r * 0.4, -3, L - r * 0.4 - w.head + 6, 6, 3); inkFill(c, WOOD, 1.6);
      const h0 = L - w.head;
      c.beginPath(); c.moveTo(h0, 0); c.quadraticCurveTo(h0 + w.head * 0.45, -12, L, 0); c.quadraticCurveTo(h0 + w.head * 0.45, 12, h0, 0); c.closePath(); inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(h0 + 4, 0); c.lineTo(L - 6, 0); c.lineWidth = 1.3; c.strokeStyle = STEEL_D; c.stroke();
      rrect(c, h0 - 4, -5, 7, 10, 2); inkFill(c, kitOf(f.def).d, 1.4);
      break;
    }
    case 'hammer': {
      rrect(c, r * 0.4, -4.5, L - r * 0.4, 9, 3); inkFill(c, WOOD, 1.8);
      const h0 = L - w.head;
      rrect(c, h0, -w.w * 0.5, w.head, w.w, 4); inkFill(c, STEEL_D, 2.2);
      rrect(c, h0 + 3, -w.w * 0.5 + 3, w.head - 6, 7, 2); c.fillStyle = STEEL; c.fill();
      c.fillStyle = INK; c.fillRect(h0 + w.head * 0.5 - 1, -w.w * 0.5, 2, w.w);
      break;
    }
    case 'scythe': {
      rrect(c, r * 0.4, -3.5, L - r * 0.4 + 2, 7, 3); inkFill(c, WOOD_D, 1.6);
      const s = -w.dir;
      c.save(); c.translate(L, 0); c.scale(1, s);
      c.beginPath(); c.moveTo(2, -2); c.quadraticCurveTo(-6, 30, -w.head, 44); c.quadraticCurveTo(-16, 26, -6, -4); c.closePath();
      inkFill(c, STEEL, 2);
      c.beginPath(); c.moveTo(-4, 4); c.quadraticCurveTo(-10, 28, -w.head + 6, 40); c.lineWidth = 1.6; c.strokeStyle = '#ffffff'; c.stroke();
      c.restore();
      break;
    }
    case 'shield': {
      const half = w.def.arc / 2;
      c.beginPath(); c.arc(0, 0, L + 7, -half, half); c.arc(0, 0, L - 7, half, -half, true); c.closePath();
      inkFill(c, kitOf(f.def).l, 2.4);
      c.beginPath(); c.arc(0, 0, L, -half + 0.12, half - 0.12); c.lineWidth = 3; c.strokeStyle = GOLD; c.stroke();
      for (const a of [-half + 0.18, 0, half - 0.18]) { circ(c, Math.cos(a) * L, Math.sin(a) * L, 2.4); c.fillStyle = INK; c.fill(); }
      break;
    }
    case 'hand': case 'hand2': {
      const wd = w.k === 'hand' ? 5 : 3.4;
      poly(c, [-8, -wd, L - 16, -wd, L - 16, -wd - 5, L, 0, L - 16, wd + 5, L - 16, wd, -8, wd]);
      inkFill(c, w.k === 'hand' ? '#2a2f3a' : '#3a4150', 1.6);
      if (w.k === 'hand2') { circ(c, 0, 0, 5); inkFill(c, GOLD, 1.4); }
      break;
    }
  }
  c.restore();
}

// the bow and the cannon point where they aim
function drawAimGear(c, f, t) {
  const id = f.def.id;
  if (id !== 'bow' && id !== 'cannon') return;
  const a = f.u.aim || [1, 0], ang = Math.atan2(a[1], a[0]);
  c.save(); c.translate(f.x, f.y); c.rotate(ang);
  const r = f.r;
  if (id === 'cannon') {
    rrect(c, 0, -11, r + 22, 22, 4); inkFill(c, '#2b313b', 2.2);
    rrect(c, r + 12, -13, 12, 26, 3); inkFill(c, '#3a424f', 2);
    c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(4, -8, r + 6, 5);
  } else {
    c.beginPath(); c.arc(r - 6, 0, 26, -1.15, 1.15); c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 3.5; c.strokeStyle = WOOD; c.stroke();
    const ex = r - 6 + Math.cos(1.15) * 26, ey = Math.sin(1.15) * 26;
    c.beginPath(); c.moveTo(ex, -ey); c.lineTo(r - 2, 0); c.lineTo(ex, ey); c.lineWidth = 1.2; c.strokeStyle = '#f4efe6'; c.stroke();
  }
  c.restore();
}

// ---- shots --------------------------------------------------------------------
function drawProj(c, p, t) {
  if (PROJ2[p.k]) { PROJ2[p.k](c, p, t); return; }
  const ang = Math.atan2(p.vy, p.vx);
  c.save(); c.translate(p.x, p.y); c.rotate(ang);
  const col = teamCol(p.side);
  switch (p.k) {
    case 'arrow':
      c.beginPath(); c.moveTo(-18, 0); c.lineTo(6, 0); c.lineWidth = 2.6; c.strokeStyle = WOOD_D; c.stroke();
      poly(c, [10, 0, 2, -4.5, 3, 0, 2, 4.5]); inkFill(c, STEEL, 1.2);
      poly(c, [-18, 0, -23, -5, -14, -1]); c.fillStyle = col; c.fill();
      poly(c, [-18, 0, -23, 5, -14, 1]); c.fill();
      break;
    case 'spike':
      poly(c, [9, 0, -6, -4.5, -3, 0, -6, 4.5]); inkFill(c, '#f4efe6', 1.4);
      break;
    case 'ball':
      circ(c, 0, 0, p.r); inkFill(c, '#2b313b', 2.2);
      circ(c, -p.r * 0.3, -p.r * 0.3, p.r * 0.3); c.fillStyle = 'rgba(255,255,255,0.3)'; c.fill();
      break;
    case 'shard':
      poly(c, [11, 0, 0, -5, -8, 0, 0, 5]); inkFill(c, '#dff7ff', 1.4);
      break;
    case 'missile':
      poly(c, [-6, -3, 2, -3.5, 2, 3.5, -6, 3]); c.fillStyle = '#ff9a3c'; c.fill();
      rrect(c, -8, -4, 16, 8, 3); inkFill(c, '#e9ecef', 1.5);
      poly(c, [8, -4, 14, 0, 8, 4]); inkFill(c, '#e5484d', 1.4);
      poly(c, [-8, -4, -12, -8, -4, -4]); c.fillStyle = col; c.fill();
      poly(c, [-8, 4, -12, 8, -4, 4]); c.fill();
      c.beginPath(); c.moveTo(-9, 0); c.lineTo(-16 - Math.random() * 6, 0); c.lineWidth = 4; c.strokeStyle = 'rgba(255,190,90,0.9)'; c.stroke();
      break;
    case 'bat': {
      c.rotate(-ang);
      const fl = Math.sin(t * 28 + p.x * 0.1) * 0.6;
      c.fillStyle = '#2a1520';
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(0, 0); c.lineTo(s * 13, -6 - fl * 8); c.lineTo(s * 10, 1); c.lineTo(s * 6, -1); c.lineTo(s * 4, 3); c.closePath(); c.fill();
      }
      circ(c, 0, 0, 4.5); c.fill();
      circ(c, -1.6, -1, 1); circ(c, 1.6, -1, 1); c.fillStyle = '#ff4d4d';
      circ(c, -1.6, -1, 1); c.fill(); circ(c, 1.6, -1, 1); c.fill();
      break;
    }
  }
  c.restore();
}

function drawDrone(c, d, t) {
  if (DRONE2[d.look]) { DRONE2[d.look](c, d, t); return; }
  const col = d.owner.def.col;
  c.save(); c.translate(d.x, d.y);
  const p = [];
  for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + PI / 6; p.push(Math.cos(a) * d.r * 1.15, Math.sin(a) * d.r * 1.15); }
  poly(c, p); inkFill(c, shade(col, 0.25), 2);
  const [ex, ey] = d.owner.foe ? toward(d, d.owner.foe) : [1, 0];
  circ(c, ex * 3, ey * 3, 4); c.fillStyle = INK; c.fill();
  circ(c, ex * 3 + 1, ey * 3 - 1, 1.3); c.fillStyle = '#ffffff'; c.fill();
  const fl = Math.sin(t * 40 + d.id) > 0 ? 1 : 0.6;
  c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(-d.r * 0.9, -d.r * 1.1, 6 * fl, 3, -0.5, 0, TAU); c.ellipse(d.r * 0.9, -d.r * 1.1, 6 * fl, 3, 0.5, 0, TAU);
  c.fillStyle = '#ffffff'; c.fill();
  c.restore();
}

// ---- hazards on the floor -----------------------------------------------------
function drawHazard(c, z, S, t) {
  if (HZ2[z.k]) { HZ2[z.k](c, z, S, t); return; }
  if (hazardLook(c, z, S, t)) return;
  switch (z.k) {
    case 'fire': {
      const a = clamp(z.life / 2.2, 0, 1);
      const fl = 0.85 + 0.15 * Math.sin(t * 20 + z.x * 0.7);
      c.globalAlpha = a * 0.75;
      circ(c, z.x, z.y, z.r * fl); c.fillStyle = '#ff7a1f'; c.fill();
      circ(c, z.x, z.y - 2, z.r * 0.55 * fl); c.fillStyle = '#ffd166'; c.fill();
      c.globalAlpha = 1;
      break;
    }
    case 'puddle': {
      const a = clamp(z.life / 1, 0, 1) * clamp((S.t - z.t0) / 0.3, 0, 1);
      c.globalAlpha = 0.5 * a;
      c.beginPath(); c.ellipse(z.x, z.y, z.r, z.r * 0.9, 0, 0, TAU); c.fillStyle = '#7bc043'; c.fill();
      c.globalAlpha = 0.8 * a;
      for (let i = 0; i < 4; i++) {
        const q = (t * 0.8 + i * 0.25 + z.x * 0.01) % 1, bx = z.x + Math.cos(i * 1.7 + z.y) * z.r * 0.5, by = z.y + Math.sin(i * 2.3 + z.x) * z.r * 0.4;
        circ(c, bx, by, 2 + q * 5); c.lineWidth = 1.5; c.strokeStyle = '#d7f5a8'; c.stroke();
      }
      c.globalAlpha = 1;
      break;
    }
    case 'bomb': {
      const q = 1 - clamp(z.fuse / 1.2, 0, 1), blink = Math.sin(q * q * 60) > 0;
      c.setLineDash([8, 8]);
      circ(c, z.x, z.y, z.r); c.lineWidth = 2; c.strokeStyle = rgba('#e5484d', 0.25 + 0.5 * q); c.stroke();
      c.setLineDash([]);
      circ(c, z.x, z.y, z.r * q); c.fillStyle = rgba('#e5484d', 0.08 + 0.1 * q); c.fill();
      circ(c, z.x, z.y, 14); inkFill(c, '#20232c', 2.2);
      c.beginPath(); c.moveTo(z.x, z.y - 14); c.quadraticCurveTo(z.x + 5, z.y - 24, z.x + 11, z.y - 22); c.lineWidth = 2.5; c.strokeStyle = '#c9a26b'; c.stroke();
      circ(c, z.x + 11, z.y - 22, blink ? 5 : 3); c.fillStyle = blink ? '#ffffff' : '#ffd166'; c.fill();
      break;
    }
    case 'strike': {
      const q = 1 - clamp(z.tele / 0.45, 0, 1);
      circ(c, z.x, z.y, z.r); c.fillStyle = rgba('#f9d71c', 0.12 + 0.2 * q); c.fill();
      c.setLineDash([10, 7]); c.lineDashOffset = -t * 40;
      circ(c, z.x, z.y, z.r * (1.4 - 0.4 * q)); c.lineWidth = 3; c.strokeStyle = rgba('#c9a400', 0.9); c.stroke();
      c.setLineDash([]);
      break;
    }
    case 'laser': {
      if (!z.fired) {
        const q = 1 - clamp(z.ch / 0.75, 0, 1);
        c.setLineDash([12, 10]); c.lineDashOffset = -t * 120;
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1); c.lineWidth = 1.5 + q * 3; c.strokeStyle = rgba('#00a6c7', 0.35 + 0.5 * q); c.stroke();
        c.setLineDash([]);
      } else {
        const a = clamp(z.life / 0.24, 0, 1);
        c.lineCap = 'round';
        c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
        c.lineWidth = 34 * a; c.strokeStyle = rgba('#00a6c7', 0.45 * a); c.stroke();
        c.lineWidth = 16 * a; c.strokeStyle = rgba('#7fe9ff', 0.9 * a); c.stroke();
        c.lineWidth = 6 * a; c.strokeStyle = 'rgba(255,255,255,' + a + ')'; c.stroke();
        c.lineCap = 'butt';
      }
      break;
    }
    case 'hole': {
      const age = S.t - z.t0, grow = clamp(age / 0.35, 0, 1) * clamp(z.life / 0.35, 0, 1);
      circ(c, z.x, z.y, z.R * grow); c.fillStyle = 'rgba(40,20,80,0.08)'; c.fill();
      c.save(); c.translate(z.x, z.y); c.scale(grow, grow);
      for (let i = 0; i < 3; i++) {
        c.save(); c.rotate(-t * (2.2 + i) + i * 2);
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, 0, 2.2); c.lineWidth = 5 - i; c.strokeStyle = rgba(i ? '#9b7bff' : '#ff9a3c', 0.75 - i * 0.18); c.stroke();
        c.beginPath(); c.arc(0, 0, z.core + 18 + i * 22, PI, PI + 1.6); c.stroke();
        c.restore();
      }
      circ(c, 0, 0, z.core); c.fillStyle = '#05010d'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#ffb35c'; c.stroke();
      c.restore();
      break;
    }
  }
}

// ===== the arena view: draws a fight and its effects on a canvas =========
const NUMCOL = { burn: '#ff8a1f', poison: '#7bd23a', drain: '#ff4f8a', hole: '#a07bff', regen: '#3ddc84', zone: '#ff9f2e' };
const HEAVY = { axe: 1, hammer: 1, flail: 1, claw: 1, head: 1, moon: 1 };
// a word in big letters over the box for the events that deserve one
const SAY = { revive: ['REVIVED!', '#ffd23f'], copy: ['COPIED!', '#b69cff'], grow: ['+1 HEAD', '#7bd23a'], rewind: ['REWIND!', '#38b6ff'], split: ['SPLIT!', '#7bd23a'],
  grab: ['SLAM!', '#ff4d4d'], slip: ['SLIP!', '#ffd23f'], strike: ['STRIKE!', '#38b6ff'], lucky: ['LUCKY!', '#3ddc84'], chaos: ['CHAOS!', '#ff9f2e'], haunt: ['BOO!', '#c7d2fe'] };

class Arena {
  constructor(canvas, opt) {
    this.cv = canvas; this.c = canvas.getContext('2d');
    this.opt = opt || {};
    this.fx = []; this.nums = []; this.trail = {}; this.says = [];
    this.sq = {}; this.hf = {}; this.decals = []; this.motes = null; this.cam = null; this.lt = null;
    this.shake = 0; this.flip = false; this.me = 0; this.hitstop = 0; this.flash = 0;
    this.k = 1; this.ox = 0; this.oy = 0; this.dpr = 1;
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; }
    this.dpr = dpr;
    const pad = this.opt.pad === undefined ? 16 : this.opt.pad;
    if (this.opt.place) {
      const p = this.opt.place(w, h);
      this.k = p.size / (ARENA + pad * 2); this.ox = p.x + pad * this.k; this.oy = p.y + pad * this.k;
      return;
    }
    this.k = Math.min(w, h) / (ARENA + pad * 2);
    this.ox = (w - ARENA * this.k) / 2; this.oy = (h - ARENA * this.k) / 2;
  }
  reset() { this.fx.length = 0; this.nums.length = 0; this.says.length = 0; this.trail = {}; this.shake = 0; this.hitstop = 0; this.flash = 0; this.sq = {}; this.hf = {}; this.decals.length = 0; this.cam = null; this.lt = null; }
  // short bright streaks flying out of a hit
  sparks(x, y, n, col, sp) {

    const pool = c.createRadialGradient(ARENA / 2, ARENA * 0.42, 20, ARENA / 2, ARENA * 0.42, ARENA * 0.7);
    pool.addColorStop(0, 'rgba(255,240,225,0.05)'); pool.addColorStop(1, 'rgba(255,240,225,0)');
    c.fillStyle = pool; c.fillRect(0, 0, ARENA, ARENA);
    for (const d of this.decals) {
      const g = c.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
      const al = d.a * Math.min(1, d.life / 3);
      g.addColorStop(0, `rgba(0,0,0,${al.toFixed(3)})`); g.addColorStop(0.6, `rgba(10,6,4,${(al * 0.6).toFixed(3)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
    }
    if (!this.motes) { this.motes = []; for (let i = 0; i < 16; i++) this.motes.push({ x: Math.random() * ARENA, y: Math.random() * ARENA, vx: (Math.random() - 0.5) * 9, vy: -3 - Math.random() * 7, r: 0.8 + Math.random() * 1.6, a: 0.05 + Math.random() * 0.1 }); }
    for (const m of this.motes) { circ(c, m.x, m.y, m.r); c.fillStyle = `rgba(255,255,255,${m.a.toFixed(3)})`; c.fill(); }
    const vig = c.createRadialGradient(ARENA / 2, ARENA / 2, ARENA * 0.38, ARENA / 2, ARENA / 2, ARENA * 0.74);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.38)');
    c.fillStyle = vig; c.fillRect(0, 0, ARENA, ARENA);
    c.strokeStyle = 'rgba(255,255,255,0.15)'; c.lineWidth = 3;
    c.strokeRect(0, 0, ARENA, ARENA);
    c.strokeStyle = '#ff2d78'; c.lineWidth = 4; c.lineCap = 'square';
    c.beginPath();
    for (const [x, y, sx, sy] of [[0, 0, 1, 1], [ARENA, 0, -1, 1], [0, ARENA, 1, -1], [ARENA, ARENA, -1, -1]]) { c.moveTo(x + sx * 30, y); c.lineTo(x, y); c.lineTo(x, y + sy * 30); }
    c.stroke(); c.lineCap = 'butt';
    if (b.x0 > 0.5) {
      c.fillStyle = 'rgba(0,0,0,0.78)';
      c.fillRect(0, 0, ARENA, b.y0); c.fillRect(0, b.y1, ARENA, ARENA - b.y1);
      c.fillRect(0, b.y0, b.x0, b.y1 - b.y0); c.fillRect(b.x1, b.y0, ARENA - b.x1, b.y1 - b.y0);
      c.save(); c.beginPath(); c.rect(b.x0 - 7, b.y0 - 7, b.x1 - b.x0 + 14, b.y1 - b.y0 + 14); c.rect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); c.clip('evenodd');
      c.fillStyle = '#f6c33c'; c.fillRect(b.x0 - 7, b.y0 - 7, b.x1 - b.x0 + 14, b.y1 - b.y0 + 14);
      c.fillStyle = INK;
      for (let x = b.x0 - 40; x < b.x1 + 40; x += 18) { c.beginPath(); c.moveTo(x, b.y0 - 8); c.lineTo(x + 9, b.y0 - 8); c.lineTo(x + 9 + (b.y1 - b.y0) + 16, b.y1 + 8); c.lineTo(x + (b.y1 - b.y0) + 16, b.y1 + 8); c.fill(); }
      c.restore();
    }
  }

  fighter(S, f, t) {
    const c = this.c;
    if (!f.alive) return;
    const ghost = f.st.phaseT > 0, stopped = S.tstop[f.side] > 0;
    const shx = (f.x - ARENA / 2) / ARENA * 14, shy = 5 + (f.y - ARENA * 0.42) / ARENA * 12;
    circ(c, f.x + shx * 1.3, f.y + shy * 1.3, f.r * 1.1); c.fillStyle = ghost ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.2)'; c.fill();
    circ(c, f.x + shx, f.y + shy, f.r * 1.0); c.fillStyle = ghost ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.42)'; c.fill();
    c.globalAlpha = ghost ? 0.32 : 1;
    const top = [];
    for (const w of f.wep) { if (w.k === 'hand' || w.k === 'hand2') top.push(w); else drawWeapon(c, f, w, t); }
    drawAimGear(c, f, t);
    const q = this.sq[f.id];
    if (q && Math.abs(q.s) > 0.004) {
      c.save(); c.translate(f.x, f.y); c.rotate(q.ang); c.scale(1 + q.s, 1 - q.s * 0.85); c.rotate(-q.ang); c.translate(-f.x, -f.y);
      drawBall(c, f.def, f.x, f.y, f.r, f, t, q.rot); c.restore();
    } else drawBall(c, f.def, f.x, f.y, f.r, f, t, q && q.rot);
    if (this.hf[f.id] > 0) { circ(c, f.x, f.y, f.r); c.fillStyle = `rgba(255,255,255,${(this.hf[f.id] / 0.12 * 0.55).toFixed(3)})`; c.fill(); }
    for (const w of top) drawWeapon(c, f, w, t);
    if (ghost) { c.setLineDash([6, 6]); circ(c, f.x, f.y, f.r + 3); c.lineWidth = 2.5; c.strokeStyle = '#6b7a99'; c.stroke(); c.setLineDash([]); }
    c.globalAlpha = 1;
    const st = f.st;
    if (f.shield > 0) { circ(c, f.x, f.y, f.r + 9); c.fillStyle = 'rgba(127,216,255,0.22)'; c.fill(); c.lineWidth = 3; c.strokeStyle = 'rgba(127,216,255,0.9)'; c.stroke(); }
    if (f.u.shell > 0) { circ(c, f.x, f.y, f.r + 6); c.lineWidth = 6; c.strokeStyle = '#4f9a52'; c.stroke(); }
    if (f.u.nova > 0) { circ(c, f.x, f.y, f.r + 10 + Math.sin(t * 30) * 6); c.lineWidth = 6; c.strokeStyle = '#ffd23f'; c.stroke(); }
    if (stopped) {
      circ(c, f.x, f.y, f.r); c.fillStyle = 'rgba(150,130,190,0.45)'; c.fill();
      c.save(); c.translate(f.x, f.y); c.rotate(-t * 0.5);
      c.setLineDash([4, 5]); circ(c, 0, 0, f.r + 8); c.lineWidth = 3; c.strokeStyle = '#d8c16a'; c.stroke(); c.setLineDash([]);
      c.restore();
    }
    if (st.frozenT > 0) {
      const s = f.r + 10;
      rrect(c, f.x - s, f.y - s, s * 2, s * 2, 14); c.fillStyle = 'rgba(190,235,255,0.55)'; c.fill();
      c.lineWidth = 3.5; c.strokeStyle = '#ffffff'; c.stroke();
    }
    if (st.rootT > 0 && !(f.u.shell > 0)) { c.lineWidth = 4; c.strokeStyle = '#7a5a2a'; for (let i = 0; i < 4; i++) { const a = i * HALF_PI + 0.4; c.beginPath(); c.moveTo(f.x + Math.cos(a) * f.r, f.y + Math.sin(a) * f.r); c.quadraticCurveTo(f.x + Math.cos(a + 0.4) * (f.r + 16), f.y + Math.sin(a + 0.4) * (f.r + 16), f.x + Math.cos(a) * (f.r + 24), f.y + Math.sin(a) * (f.r + 24)); c.stroke(); } }
    const over = [];
    if (st.stunT > 0) over.push(['star', '#ffd23f']);
    if (st.confuseT > 0) over.push(['swirl', '#b69cff']);
    if (st.charmT > 0) over.push(['heart', '#ff3f6f']);
    over.forEach(([kind, col], j) => {
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * TAU / 3 + j, x = f.x + Math.cos(a) * f.r * 0.7, y = f.y - f.r - 8 - j * 12 + Math.sin(a) * 5;
        if (kind === 'star') { star(c, x, y, 6, 2.6, 5); inkFill(c, col, 1); }
        else if (kind === 'heart') { heart(c, x, y, 5); inkFill(c, col, 1); }
        else { c.beginPath(); c.arc(x, y, 5, 0, 4.5); c.lineWidth = 2.5; c.strokeStyle = col; c.stroke(); }
      }
    });
    if (st.blindT > 0) { for (const s of [-1, 1]) { c.beginPath(); c.ellipse(f.x + s * f.r * 0.35, f.y - f.r * 0.1, 9, 6, 0, 0, TAU); c.fillStyle = '#1a1028'; c.fill(); } }
    if (st.weakT > 0) { poly(c, [f.x - 6, f.y - f.r - 14, f.x + 6, f.y - f.r - 14, f.x, f.y - f.r - 4]); inkFill(c, '#ff9f2e', 1.5); }
    if (st.slowT > 0) {
      c.setLineDash([3, 6]); c.lineDashOffset = t * 10;
      circ(c, f.x, f.y, f.r + 5); c.lineWidth = 3; c.strokeStyle = 'rgba(80,170,255,0.9)'; c.stroke(); c.setLineDash([]);
    }
    if (st.burnT > 0 && Math.random() < 0.6) {
      const a = Math.random() * TAU;
      this.fx.push({ k: 'p', x: f.x + Math.cos(a) * f.r * 0.8, y: f.y + Math.sin(a) * f.r * 0.8, vx: 0, vy: -120, life: 0.35, max: 0.35, col: Math.random() < 0.5 ? '#ff7a1f' : '#ffd23f', size: 4 });
    }
    if (st.poison > 0 && Math.random() < 0.25) this.fx.push({ k: 'bub', x: f.x + (Math.random() - 0.5) * f.r * 1.4, y: f.y + f.r * 0.3, life: 0.7, max: 0.7, size: 2 + Math.random() * 3 });
  }

  effects(S, t) {
    const c = this.c;
    for (const p of this.fx) {
      const a = clamp(p.life / p.max, 0, 1);
      switch (p.k) {
        case 'p': c.globalAlpha = a; circ(c, p.x, p.y, p.size * (0.5 + 0.5 * a)); c.fillStyle = p.col; c.fill(); break;
        case 'bub': c.globalAlpha = a; circ(c, p.x, p.y - (1 - a) * 40, p.size); c.lineWidth = 1.5; c.strokeStyle = '#5aa52a'; c.stroke(); break;
        case 'ring': { const r = p.r1 + (p.r0 - p.r1) * a; c.globalAlpha = a; circ(c, p.x, p.y, Math.max(0.1, r)); c.lineWidth = p.w * a + 0.5; c.strokeStyle = p.col; c.stroke(); break; }
        case 'disc': c.globalAlpha = a * 0.7; circ(c, p.x, p.y, p.r); c.fillStyle = p.col; c.fill(); break;
        case 'arc': c.globalAlpha = a; c.beginPath(); c.moveTo(p.pts[0], p.pts[1]); for (let i = 2; i < p.pts.length; i += 2) c.lineTo(p.pts[i], p.pts[i + 1]); c.lineWidth = 7; c.strokeStyle = 'rgba(120,170,255,0.5)'; c.stroke(); c.lineWidth = 2.5; c.strokeStyle = '#eef6ff'; c.stroke(); break;
        case 'line': c.globalAlpha = a; c.beginPath(); c.moveTo(p.x0, p.y0); c.lineTo(p.x1, p.y1); c.lineWidth = p.w + 3; c.lineCap = 'round'; c.strokeStyle = INK; c.stroke(); c.lineWidth = p.w; c.strokeStyle = p.col; c.stroke(); c.lineCap = 'butt'; break;
        case 'spark': c.globalAlpha = a; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); c.lineWidth = 2.6 * a + 0.6; c.lineCap = 'round'; c.strokeStyle = p.col; c.stroke(); c.lineCap = 'butt'; break;
        case 'shard': {
          c.globalAlpha = Math.min(1, a * 1.6);
          c.save(); c.translate(p.x, p.y); c.rotate(p.rot); const s = 0.55 + 0.45 * a; c.scale(s, s);
          poly(c, p.pts); inkFill(c, p.col, 2.4); c.restore();
          break;
        }
        case 'slash': {
          const len = p.heavy ? 46 : 30, px = -p.ny, py = p.nx;
          c.globalAlpha = a;
          c.beginPath(); c.moveTo(p.x - px * len, p.y - py * len); c.quadraticCurveTo(p.x + p.nx * 10, p.y + p.ny * 10, p.x + px * len, p.y + py * len);
          c.lineWidth = (p.heavy ? 9 : 6) * a; c.strokeStyle = '#ffffff'; c.lineCap = 'round'; c.stroke(); c.lineCap = 'butt';
          break;
        }
        case 'bolt': {
          const rr = rng(p.seed | 0); let x = p.x + (rr() - 0.5) * 60, y = p.y0;
          c.globalAlpha = a; c.beginPath(); c.moveTo(x, y);
          for (let i = 1; i <= 9; i++) { y = p.y0 + (p.y - p.y0) * i / 9; x = (i === 9 ? p.x : p.x + (rr() - 0.5) * 70 * (1 - i / 9)); c.lineTo(x, y); }
          c.lineWidth = 14; c.strokeStyle = INK; c.stroke(); c.lineWidth = 8; c.strokeStyle = '#ffe135'; c.stroke();
          break;
        }
        case 'streak': c.globalAlpha = a * 0.8; c.beginPath(); c.moveTo(p.x0, p.y0); c.lineTo(p.x1, p.y1); c.lineWidth = 26 * a; c.lineCap = 'round'; c.strokeStyle = p.col || 'rgba(178,140,255,0.6)'; c.stroke(); c.lineCap = 'butt'; break;
        case 'die': {
          const f = this.byId(S, p.id);
          if (!f || !f.alive) break;
          const s = 1 + (1 - a) * 0.3, x = f.x, y = f.y - f.r - 54 - (1 - a) * 10;
          c.globalAlpha = Math.min(1, a * 2);

          c.font = `400 ${Math.round(20 * s)}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillStyle = INK; c.lineWidth = 0; c.strokeStyle = 'transparent';
          this.text(String(p.a), x, y + 1);
          break;
        }
      }
    }
    c.globalAlpha = 1;
  }

  tag(S, f) {
    if (!f.alive) return;
    const c = this.c, hp = Math.ceil(f.hp), w = hp >= 100 ? 48 : 40, h = 26;
    let y = f.y - f.r - 28;
    if (f.def.id === 'bomb' || f.def.id === 'wizard' || f.def.id === 'king' || f.def.id === 'shark') y -= 24; else if (ART_OUT[f.def.id]) y -= 10;
    if (y < S.box.y0 + 4) y = f.y + f.r + 24;
    const x = f.x;
    rrect(c, x - w / 2, y - h / 2, w, h, 6); c.fillStyle = '#0c0c0f'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = teamCol(f.side); c.stroke();
    c.font = `400 22px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = hp / f.maxHp < 0.3 ? '#ff5a5a' : '#ffffff'; c.lineWidth = 0; c.strokeStyle = 'transparent';
    this.text(String(hp), x, y + 1);
    if (f.st.poison > 0) for (let i = 0; i < f.st.poison; i++) { circ(c, x - (f.st.poison - 1) * 4 + i * 8, y + h / 2 + 8, 3); c.fillStyle = '#7bd23a'; c.fill(); }
  }

  numbers() {
    const c = this.c;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const n of this.nums) {
      const a = clamp(n.life / n.max * 1.6, 0, 1), pop = 1 + Math.max(0, n.life - n.max + 0.15) * 3;
      c.globalAlpha = a;
      c.font = `400 ${Math.round((n.big ? 36 : n.small ? 17 : 26) * pop)}px ${FONT_D}`;
      c.lineWidth = 5; c.strokeStyle = '#030304'; c.fillStyle = n.col; c.lineJoin = 'round';
      this.text(n.txt, n.x, n.y);
    }
    c.globalAlpha = 1;
  }

  sayDraw() {
    const c = this.c;
    this.says.forEach((s, i) => {
      const a = clamp(s.life / s.max, 0, 1), pop = 1 + Math.max(0, s.life - s.max + 0.2) * 2.5;
      c.globalAlpha = Math.min(1, a * 3);
      c.font = `400 ${Math.round(54 * pop)}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 8; c.strokeStyle = '#030304'; c.lineJoin = 'round'; c.fillStyle = s.col;
      this.text(s.txt, ARENA / 2, 120 + i * 60 - (1 - a) * 20);
    });
    c.globalAlpha = 1;
  }
}

// ===== art for the 70 newer balls, and their weapons, shots and hazards =======
// Emblems are drawn in an 80-unit box centred on the ball, like ART in p5.
const star = (c, x, y, r1, r2, n, rot) => { const p = []; for (let i = 0; i < n * 2; i++) { const a = (rot || -HALF_PI) + i * PI / n, r = i % 2 ? r2 : r1; p.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } poly(c, p); };
const heart = (c, x, y, s) => { c.beginPath(); c.moveTo(x, y + s * 0.9); c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.35); c.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); c.closePath(); };
const eyes = (c, dx, y, r, look) => { for (const s of [-1, 1]) { circ(c, s * dx, y, r); inkFill(c, '#ffffff', 1.6); circ(c, s * dx + (look || 0), y + 1, r * 0.5); c.fillStyle = INK; c.fill(); } };
const line = (c, pts, w, col) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = w; c.strokeStyle = col || INK; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); c.lineCap = 'butt'; };
const txt = (c, s, x, y, size, col) => { c.font = `400 ${size}px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 4; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(s, x, y); c.fillStyle = col || '#fff'; c.fillText(s, x, y); };

Object.assign(ART, {
  copycat(c, k, f, t) {
    const cp = f && f.def.copied;
    if (cp && ART[cp]) { c.save(); c.scale(0.62, 0.62); c.translate(0, 8); ART[cp](c, kitOf(BALL[cp]), f, t); c.restore(); }
    else {                       // a paw print
      c.beginPath(); c.ellipse(0, 9, 13, 11, 0, 0, TAU); inkFill(c, '#ffd6e6', 2);
      for (const [x, y] of [[-17, -5], [-6, -15], [6, -15], [17, -5]]) { c.beginPath(); c.ellipse(x, y, 5.5, 7, x * 0.03, 0, TAU); inkFill(c, '#ffd6e6', 2); }
    }
  },
  hydra(c, k) {
    for (const [x, y, a] of [[-16, -6, -0.5], [0, -14, 0], [16, -6, 0.5]]) {
      line(c, [x * 0.4, 22, x, y], 7, k.d);
      c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 7, 9, 0, 0, TAU); inkFill(c, k.l, 1.6); poly(c, [-1.5, -9, 0, -15, 1.5, -9]); c.fillStyle = '#ff4d6d'; c.fill(); c.restore();
    }
  },
  painter(c, k) {
    c.beginPath(); c.ellipse(0, 2, 27, 21, -0.2, 0, TAU); inkFill(c, '#fff3d6', 2);
    circ(c, 9, 10, 5); c.fillStyle = shade(k.col, -0.25); c.fill();
    [['#ff4d4d', -14, -2], ['#38b6ff', -4, -11], ['#3ddc84', 8, -10], ['#b46bff', 16, 0]].forEach(([col, x, y]) => { circ(c, x, y, 4.5); c.fillStyle = col; c.fill(); });
  },
  builder(c, k) {
    c.beginPath(); c.arc(0, 4, 24, PI, 0); c.closePath(); inkFill(c, '#ffd23f', 2.2);
    rrect(c, -30, 2, 60, 8, 3); inkFill(c, '#ffd23f', 2);
    rrect(c, -4, -21, 8, 22, 2); c.fillStyle = shade('#ffd23f', -0.2); c.fill();
    for (const [x, y] of [[-16, 15], [0, 15], [16, 15], [-8, 24], [8, 24]]) { rrect(c, x - 7, y - 3.5, 14, 7, 1.5); inkFill(c, '#d9663a', 1.4); }
  },
  mime(c, k) {                 // a striped shirt under the beret
    c.save(); circ(c, 0, 0, 40); c.clip();
    c.fillStyle = '#24124a'; for (const y of [-16, -3, 10, 23]) c.fillRect(-40, y, 80, 6);
    c.restore();
  },
  glitch(c, k, f, t) {
    const o = Math.floor(t * 8) % 3;
    [['#ff3b6b', -3 + o, 0], ['#38b6ff', 3 - o, 0], ['#ffffff', 0, 0]].forEach(([col, dx]) => { c.fillStyle = col; c.globalAlpha *= col === '#ffffff' ? 1 : 0.8; for (const [x, y] of [[-14, -14], [2, -14], [-14, 2], [10, 6], [-4, 14]]) c.fillRect(x + dx, y, 9, 9); c.globalAlpha = 1; });
  },
  gambler(c, k) {
    rrect(c, -15, -21, 30, 42, 4); inkFill(c, '#ffffff', 2);
    c.fillStyle = INK; heart(c, 0, -3, 9); c.save(); c.translate(0, -3); c.scale(1, -1); heart(c, 0, 0, 9); c.restore(); c.fill();
    rrect(c, -2, 4, 4, 9, 1); c.fill();
    txt(c, 'A', -9, -14, 11, INK);
  },
  swap(c, k) {
    c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, 20, -2.6, -0.4); c.stroke(); c.beginPath(); c.arc(0, 0, 20, 0.54, 2.74); c.stroke(); c.lineCap = 'butt';
    poly(c, [20, -15, 23, -2, 11, -6]); c.fillStyle = '#ffffff'; c.fill();
    poly(c, [-20, 15, -23, 2, -11, 6]); c.fill();
  },
  chess(c, k) {

  planet(c, k) { c.save(); circ(c, 0, 0, 40); c.clip(); c.fillStyle = '#3ddc84'; for (const [x, y, rx, ry] of [[-14, -12, 14, 10], [12, 8, 16, 12], [-10, 18, 8, 6]]) { c.beginPath(); c.ellipse(x, y, rx, ry, 0.4, 0, TAU); c.fill(); } c.restore(); },
  soccer(c, k) { const pent = (x, y, r, a) => { const p = []; for (let i = 0; i < 5; i++) { const q = a + i * TAU / 5; p.push(x + Math.cos(q) * r, y + Math.sin(q) * r); } poly(c, p); c.fillStyle = INK; c.fill(); }; pent(0, 0, 11, -HALF_PI); for (let i = 0; i < 5; i++) { const a = -HALF_PI + i * TAU / 5; pent(Math.cos(a) * 30, Math.sin(a) * 30, 9, a + PI); } },

// ---- weapons the first 30 didn't have --------------------------------------
const WEAPON2 = {
  head(c, f, w) {          // a hydra's neck and head

    c.beginPath(); c.moveTo(f.x + ux * f.r * 0.6, f.y + uy * f.r * 0.6); c.quadraticCurveTo(f.x + ux * w.len * 0.6 - uy * 18 * w.dir, f.y + uy * w.len * 0.6 + ux * 18 * w.dir, hx, hy);

    c.save(); c.translate(hx, hy); c.rotate(w.ang);

const PROJ2 = {

  prism(c, p, t) { ['#ff4d4d', '#ffe135', '#3ddc84', '#38b6ff'].forEach((col, i) => { c.beginPath(); c.arc(p.x, p.y, p.r, t * 8 + i * HALF_PI, t * 8 + (i + 1) * HALF_PI); c.lineTo(p.x, p.y); c.fillStyle = col; c.fill(); }); circ(c, p.x, p.y, p.r); c.lineWidth = 2; c.strokeStyle = INK; c.stroke(); },

  soccer(c, p, t) { c.save(); c.translate(p.x, p.y); c.rotate(t * 8); c.scale(p.r / 40, p.r / 40); circ(c, 0, 0, 40); inkFill(c, '#ffffff', 5); ART.soccer(c, kitOf(BALL.soccer)); c.restore(); },

const ZONE_LOOK = {
  spot(c, z, S, t) { circ(c, z.x, z.y, z.r); c.fillStyle = `hsla(${(t * 120 + z.x) % 360},90%,65%,0.35)`; c.fill(); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.6)'; c.stroke(); },
  twister(c, z, S, t) { for (let i = 0; i < 6; i++) { c.beginPath(); c.ellipse(z.x + Math.sin(t * 6 + i) * 6, z.y - z.r * 0.7 + i * z.r * 0.28, z.r * (0.35 + i * 0.12), z.r * 0.12, 0, 0, TAU); c.lineWidth = 4; c.strokeStyle = 'rgba(160,180,200,0.75)'; c.stroke(); } },
  glue(c, z) { c.globalAlpha = 0.8; c.beginPath(); c.ellipse(z.x, z.y, z.r, z.r * 0.85, 0.3, 0, TAU); c.fillStyle = '#f7f3e3'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#d8ceaa'; c.stroke(); c.globalAlpha = 1; },
  web(c, z) { c.globalAlpha = 0.75; c.lineWidth = 1.6; c.strokeStyle = '#ffffff'; for (let i = 0; i < 8; i++) { const a = i * PI / 4; c.beginPath(); c.moveTo(z.x, z.y); c.lineTo(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r); c.stroke(); } for (let r = z.r * 0.3; r <= z.r; r += z.r * 0.3) { circ(c, z.x, z.y, r); c.stroke(); } c.globalAlpha = 1; },
  spore(c, z, S, t) { c.globalAlpha = 0.55; for (let i = 0; i < 9; i++) { const a = i * 2.4 + t * 0.6, r = z.r * (0.3 + (i % 3) * 0.25); circ(c, z.x + Math.cos(a) * r, z.y + Math.sin(a) * r, 12); c.fillStyle = i % 2 ? '#c9a27a' : '#9ccf6b'; c.fill(); } c.globalAlpha = 1; },
  ink(c, z) { c.globalAlpha = 0.72; for (const [dx, dy, r] of [[0, 0, 1], [-0.4, 0.3, 0.6], [0.45, -0.2, 0.55], [0.1, 0.5, 0.45]]) { circ(c, z.x + dx * z.r, z.y + dy * z.r, z.r * r); c.fillStyle = '#1a1028'; c.fill(); } c.globalAlpha = 1; },
  rain(c, z, S, t) { c.globalAlpha = 0.35; circ(c, z.x, z.y, z.r); c.fillStyle = '#38b6ff'; c.fill(); c.globalAlpha = 1; for (const [dx, dy, r] of [[-0.3, -0.55, 0.32], [0.1, -0.7, 0.4], [0.45, -0.5, 0.3]]) { circ(c, z.x + dx * z.r, z.y + dy * z.r, z.r * r); inkFill(c, '#e3ecf6', 2); } c.strokeStyle = '#38b6ff'; c.lineWidth = 2; for (let i = 0; i < 6; i++) { const x = z.x + (i - 2.5) * z.r * 0.3, y = z.y - z.r * 0.2 + ((t * 300 + i * 37) % (z.r * 0.9)); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y + 9); c.stroke(); } },
  sun(c, z, S, t) { circ(c, z.x, z.y, z.r); c.fillStyle = `rgba(255,176,0,${0.12 + 0.04 * Math.sin(t * 5)})`; c.fill(); c.setLineDash([6, 8]); c.lineWidth = 2; c.strokeStyle = 'rgba(255,140,0,0.5)'; c.stroke(); c.setLineDash([]); },
};
const HZ2 = {
  zone(c, z, S, t) {
    const L = ZONE_LOOK[z.look];
    const fade = clamp(z.life / 0.4, 0, 1) * clamp((S.t - z.t0) / 0.25, 0, 1);
    c.save(); c.globalAlpha = fade;
    if (L) L(c, z, S, t); else { circ(c, z.x, z.y, z.r); c.fillStyle = rgba(z.owner.def.col, 0.25); c.fill(); }
    c.restore();
  },
  wall(c, z, S) {
    const fresh = z.flash !== undefined && S.t - z.flash < 0.3;
    if (z.hidden && !fresh) { c.globalAlpha = 0.07; }
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
    c.lineWidth = z.w + 5; c.strokeStyle = INK; c.stroke();
    c.lineWidth = z.w; c.strokeStyle = z.hidden ? '#ffffff' : '#ff9f2e'; c.stroke();
    c.lineCap = 'butt'; c.globalAlpha = 1;
  },
  bumper(c, z, S, t) {
    const hit = z.flash !== undefined && S.t - z.flash < 0.15, s = hit ? 1.15 : 1;

    circ(c, z.x, z.y, z.r * 0.62 * s); inkFill(c, '#ffffff', 2);

  },
  mine(c, z, S, t) {
    const mine = z.side === ME_SIDE;
    c.globalAlpha = mine ? 0.6 : 0.16;
    circ(c, z.x, z.y, 11); inkFill(c, '#3a3f4b', 2);
    circ(c, z.x, z.y, 4); c.fillStyle = Math.sin(t * 10) > 0 ? '#ff4d4d' : '#7a1f1f'; c.fill();
    c.globalAlpha = 1;
  },
  peel(c, z) { c.save(); c.translate(z.x, z.y); for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * TAU / 3); c.beginPath(); c.ellipse(0, -9, 5, 10, 0, 0, TAU); inkFill(c, '#ffe135', 1.8); c.restore(); } circ(c, 0, 0, 5); inkFill(c, '#f2d03b', 1.6); c.restore(); },
  wave(c, z, S, t) {

    c.fillStyle = '#ffffff';
    for (let y = b.y0; y < b.y1; y += 26) { circ(c, x + z.dir * z.w / 2 + Math.sin(y * 0.2 + t * 12) * 4, y + 13, 8); c.fill(); }
  },
  fx() {},
};

// a few hazards the first 30 had, in new looks
function hazardLook(c, z, S, t) {
  if (z.k === 'bomb' && z.look === 'nuke') {
    const q = 1 - clamp(z.fuse / 2.6, 0, 1);
    c.setLineDash([14, 10]); circ(c, z.x, z.y, z.r); c.lineWidth = 4; c.strokeStyle = `rgba(255,222,46,${0.4 + 0.5 * q})`; c.stroke(); c.setLineDash([]);
    circ(c, z.x, z.y, z.r * q); c.fillStyle = `rgba(255,222,46,${0.08 + 0.12 * q})`; c.fill();
    c.save(); c.translate(z.x, z.y); c.scale(0.5, 0.5); circ(c, 0, 0, 34); inkFill(c, '#ffde2e', 4); ART.nuke(c, kitOf(BALL.nuke)); c.restore();
    c.font = `400 26px ${FONT_D}`; c.textAlign = 'center'; c.fillStyle = INK; c.fillText(Math.ceil(z.fuse), z.x, z.y - 30);
    return true;
  }
  if (z.k === 'strike' && z.look === 'meteor') {
    const q = 1 - clamp(z.tele / 0.8, 0, 1);
    circ(c, z.x, z.y, z.r); c.fillStyle = `rgba(140,59,30,${0.12 + 0.2 * q})`; c.fill();
    c.setLineDash([10, 8]); c.lineWidth = 3; c.strokeStyle = '#8c3b1e'; circ(c, z.x, z.y, z.r); c.stroke(); c.setLineDash([]);
    const mx = z.x + (1 - q) * 160, my = z.y - (1 - q) * 260;
    circ(c, mx, my, 16 + q * 8); inkFill(c, '#8c3b1e', 2.5);
    return true;
  }
  if (z.k === 'laser' && z.look && !z.fired) {
    const q = 1 - clamp(z.ch / 1.1, 0, 1), col = z.look === 'rail' ? '#2fc4ff' : '#ff3b3b';
    c.setLineDash(z.look === 'snipe' ? [4, 6] : [10, 8]);
    c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1); c.lineWidth = 1.5 + q * 2; c.strokeStyle = rgba(col, 0.4 + 0.5 * q); c.stroke(); c.setLineDash([]);
    if (z.look === 'snipe') { circ(c, z.x1 - (z.x1 - z.x0) * 0.02, z.y1 - (z.y1 - z.y0) * 0.02, 10); c.lineWidth = 2; c.stroke(); }
    return true;
  }
  if (z.k === 'laser' && z.look && z.fired) {
    const a = clamp(z.life / 0.24, 0, 1), col = z.look === 'rail' ? '#2fc4ff' : '#ff3b3b', w = z.look === 'snipe' ? 10 : z.look === 'rail' ? 26 : 18;
    c.lineCap = 'round'; c.beginPath(); c.moveTo(z.x0, z.y0); c.lineTo(z.x1, z.y1);
    c.lineWidth = w * a; c.strokeStyle = rgba(col, 0.8 * a); c.stroke(); c.lineWidth = w * 0.35 * a; c.strokeStyle = 'rgba(255,255,255,' + a + ')'; c.stroke(); c.lineCap = 'butt';
    return true;
  }
  if (z.k === 'hole' && z.push) {
    const age = S.t - z.t0, g = clamp(age / 0.2, 0, 1) * clamp(z.life / 0.3, 0, 1);
    circ(c, z.x, z.y, z.R * g); c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill(); c.lineWidth = 5; c.strokeStyle = 'rgba(255,214,248,0.8)'; c.stroke();
    return true;
  }
  return false;
}

// the painter's floor
function drawPaint(c, S) {
  if (!S.paint) return;
  const n = PAINT_N, cs = ARENA / n;
  for (let i = 0; i < S.paint.length; i++) {
    const v = S.paint[i];
    if (!v) continue;
    const f = S.F[v - 1];
    c.fillStyle = rgba(f && f.def.id === 'painter' ? (v - 1 === ME_SIDE ? '#38b6ff' : '#ff4fa3') : '#ffd23f', 0.32);
    c.fillRect((i % n) * cs + 1, Math.floor(i / n) * cs + 1, cs - 2, cs - 2);
  }
}

Object.assign(ART_OUT, {
  // four spider legs, two out of each side, scuttling, once it's angry
  verity(c, k, f, t) {
    if (!f || !f.u.mad) return;
    const g = f.u.leg || 0;
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    for (const s of [-1, 1]) for (let j = 0; j < 2; j++) {
      // root on the body, knee up and out, foot down on the floor; opposite legs lift in turn
      const rx = s * 34, ry = -6 + j * 20, lift = Math.max(0, Math.sin(t * 20 + (j + (s > 0 ? 1 : 0)) * PI)) * 9;
      const kx = rx + (s * (18 + j * 12)) * g, ky = ry + (-22 + j * 10) * g - lift * 0.5;
      const fx = rx + (s * (24 + j * 18)) * g, fy = ry + (40 - j * 10) * g - lift;
      c.moveTo(rx, ry); c.lineTo(kx, ky); c.lineTo(fx, fy);
    }
    c.lineWidth = 9; c.strokeStyle = 'rgba(255,255,255,0.3)'; c.stroke();   // a light edge, for the dark floor
    c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
    c.lineCap = 'butt'; c.lineJoin = 'miter';
  },
  boss_titan(c, k) { for (const s of [-1, 1]) { poly(c, [s * 24, -30, s * 34, -52, s * 40, -24]); inkFill(c, '#a88a6a', 2); } },

  porcupine(c, k) { for (let i = -5; i <= 5; i++) { const a = -HALF_PI + i * 0.28; poly(c, [Math.cos(a - 0.08) * 36, Math.sin(a - 0.08) * 36, Math.cos(a) * 50, Math.sin(a) * 50, Math.cos(a + 0.08) * 36, Math.sin(a + 0.08) * 36]); inkFill(c, '#f4efe6', 1.4); } },
  pineapple(c, k) { for (const a of [-0.45, 0, 0.45]) { c.save(); c.rotate(a); poly(c, [-7, -36, 7, -36, 0, -58]); inkFill(c, '#3fa34d', 1.8); c.restore(); } },
  witch(c, k) { poly(c, [-22, -32, 22, -32, 10, -70]); inkFill(c, '#2a1f3a', 2.2); },

  satellite(c, k) { line(c, [0, -38, 0, -52], 3); circ(c, 0, -54, 4); inkFill(c, '#ff4d4d', 1.4); },
  minotaur(c, k) { for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 26, -26); c.quadraticCurveTo(s * 52, -36, s * 50, -58); c.quadraticCurveTo(s * 40, -40, s * 20, -36); c.closePath(); inkFill(c, '#f4efe6', 2); } },
  eagle(c, k) { for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 34, -6); c.quadraticCurveTo(s * 58, -24, s * 60, 0); c.quadraticCurveTo(s * 50, -4, s * 38, 8); c.closePath(); inkFill(c, '#5a3a20', 2); } },
  rocket(c, k) { poly(c, [-8, 36, 8, 36, 0, 54]); inkFill(c, '#ffb02e', 1.8); },
  golem(c, k) { for (const [x, y] of [[-30, -26], [26, -30]]) { rrect(c, x, y, 10, 10, 2); inkFill(c, shade(k.col, 0.1), 1.8); } },

  sickle(c, f, w) { stick(c, f, w, '#5a3a20'); c.beginPath(); c.arc(w.len - 20, -18 * w.dir, 20, PI * 0.5 * w.dir, PI * 1.6 * w.dir, w.dir < 0); c.lineWidth = 5; c.strokeStyle = '#d5dce5'; c.stroke(); c.restore(); },
  lance(c, f, w) { c.save(); c.translate(f.x, f.y); c.rotate(w.ang); c.beginPath(); c.ellipse(f.r + 6, 0, 6, 16, 0, 0, TAU); inkFill(c, '#3a5bd5', 1.8); poly(c, [f.r + 8, -9, w.len, 0, f.r + 8, 9]); inkFill(c, '#eef3f8', 2); c.restore(); },

  sat(c, f, w) { const x = f.x + Math.cos(w.ang) * w.len, y = f.y + Math.sin(w.ang) * w.len; c.save(); c.translate(x, y); c.rotate(w.ang); rrect(c, -6, -6, 12, 12, 2); inkFill(c, '#ffd23f', 1.8); for (const s of [-1, 1]) { rrect(c, s > 0 ? 8 : -22, -5, 14, 10, 2); inkFill(c, '#3a5bd5', 1.4); } c.restore(); },

  frostz(c, z) { blob(c, z, '#bfe6ff', 0.35); },

// ===== arena skins: different floors for the box, earned by playing ==========
// The still part of each floor is painted once to its own canvas; only what
// moves (lava, stars) is drawn every frame.
let ARENA_SKIN = 'classic';
const SKINS = {
  classic: { name: 'Classic', need: 'Free', ok: () => true },
  garage: { name: "Hardware's Garage", need: 'Reach player level 5', ok: () => (G.plv || 1) >= 5,
    paint(c, r) {

      for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(255,255,255,${(0.015 + r() * 0.03).toFixed(3)})`; c.fillRect(r() * ARENA, r() * ARENA, 1.5 + r() * 2, 1.5 + r() * 2); }
      for (let i = 0; i < 5; i++) { const x = 60 + r() * 480, y = 60 + r() * 480, g = c.createRadialGradient(x, y, 0, x, y, 30 + r() * 40); g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - 80, y - 80, 160, 160); }
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 2;
      for (let x = 150; x < ARENA; x += 150) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, ARENA); c.stroke(); c.beginPath(); c.moveTo(0, x); c.lineTo(ARENA, x); c.stroke(); }
      c.strokeStyle = 'rgba(246,195,60,0.55)'; c.lineWidth = 5;
      for (const x of [110, 490]) { c.beginPath(); c.moveTo(x, 30); c.lineTo(x, 170); c.stroke(); c.beginPath(); c.moveTo(x, 430); c.lineTo(x, 570); c.stroke(); }
      c.save(); c.beginPath(); c.rect(0, 0, ARENA, ARENA); c.rect(14, 14, ARENA - 28, ARENA - 28); c.clip('evenodd');
      for (let x = -ARENA; x < ARENA * 2; x += 28) { c.fillStyle = '#f6c33c'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 14, 0); c.lineTo(x + 14 + ARENA, ARENA); c.lineTo(x + ARENA, ARENA); c.fill(); }

      c.font = `400 54px ${FONT_D}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(255,255,255,0.05)'; c.fillText('BAY 07', ARENA / 2, ARENA - 70);
    } },
  glacier: { name: 'Glacier', need: 'Reach player level 10', ok: () => (G.plv || 1) >= 10,

      c.strokeStyle = 'rgba(160,220,255,0.08)'; c.lineWidth = 2;
      for (let x = 0; x <= ARENA; x += 75) for (let y = 0; y <= ARENA; y += 75) { c.strokeRect(x + (y / 75 % 2) * 37, y, 75, 75); }
      c.strokeStyle = 'rgba(230,248,255,0.22)'; c.lineWidth = 1.4;
      for (let i = 0; i < 14; i++) { let x = r() * ARENA, y = r() * ARENA; c.beginPath(); c.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r() - 0.5) * 90; y += (r() - 0.5) * 90; c.lineTo(x, y); } c.stroke(); }
      for (let i = 0; i < 6; i++) { const x = r() * ARENA, y = r() * ARENA, gg = c.createRadialGradient(x, y, 0, x, y, 70); gg.addColorStop(0, 'rgba(200,240,255,0.08)'); gg.addColorStop(1, 'rgba(200,240,255,0)'); c.fillStyle = gg; c.fillRect(x - 70, y - 70, 140, 140); }
    } },
  volcano: { name: 'Volcano', need: 'Win The Box Cup', ok: () => (G.cups || 0) >= 1,
    paint(c, r) {
      c.fillStyle = '#140b09'; c.fillRect(0, 0, ARENA, ARENA);
      c.strokeStyle = 'rgba(70,30,20,0.9)'; c.lineWidth = 3;
      for (let row = 0; row < 12; row++) for (let col = 0; col < 12; col++) {
        const x = col * 56 + (row % 2) * 28, y = row * 50, p = [];
        for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + PI / 6; p.push(x + Math.cos(a) * 30, y + Math.sin(a) * 30); }
        poly(c, p); c.stroke();
      }
      const cr = [];
      for (let i = 0; i < 9; i++) { let x = r() * ARENA, y = r() * ARENA; const pts = [x, y]; for (let k = 0; k < 6; k++) { x += (r() - 0.5) * 80; y += (r() - 0.5) * 80; pts.push(x, y); } cr.push(pts); }

      const a = 0.45 + 0.25 * Math.sin(t * 2.2);
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (const pts of SKINS.volcano.cracks || []) {
        c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
        c.lineWidth = 7; c.strokeStyle = `rgba(255,90,20,${(a * 0.35).toFixed(3)})`; c.stroke();
        c.lineWidth = 2.5; c.strokeStyle = `rgba(255,190,80,${a.toFixed(3)})`; c.stroke();
      }
      c.lineCap = 'butt'; c.lineJoin = 'miter';
    } },
  cosmos: { name: 'Cosmos', need: 'Defeat a raid boss', ok: () => (G.bossKills || 0) >= 1,
    paint(c, r) {
      c.fillStyle = '#05040c'; c.fillRect(0, 0, ARENA, ARENA);
      for (const [x, y, rr, col] of [[150, 160, 220, 'rgba(140,70,200,0.16)'], [470, 420, 240, 'rgba(60,110,220,0.14)'], [380, 120, 140, 'rgba(255,90,170,0.09)']]) {
        const g = c.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, ARENA, ARENA);
      }
      const st = [];
      for (let i = 0; i < 160; i++) st.push([r() * ARENA, r() * ARENA, 0.4 + r() * 1.4, r() * 6.28]);
      SKINS.cosmos.stars = st;
    },
    live(c, t) {
      for (const [x, y, s, ph] of SKINS.cosmos.stars || []) { c.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.6 + ph)); circ(c, x, y, s); c.fillStyle = '#ffffff'; c.fill(); }
      c.globalAlpha = 1;
    } },
};
const SKIN_CV = {};
function skinCanvas(id) {
  if (SKIN_CV[id]) return SKIN_CV[id];
  const cv = document.createElement('canvas'); cv.width = cv.height = 1200;
  const c = cv.getContext('2d'); c.scale(2, 2);
  SKINS[id].paint(c, rng(hashStr('skin:' + id)));
  return (SKIN_CV[id] = cv);
}
// draws the floor under the grid lines; true if a skin did it
function drawSkin(c, t) {
  const sk = ARENA_SKIN !== 'classic' && SKINS[ARENA_SKIN];
  if (!sk || !sk.paint) return false;
  c.drawImage(skinCanvas(ARENA_SKIN), 0, 0, ARENA, ARENA);
  if (sk.live) sk.live(c, t);
  return true;
}

// ===== THE BOX CUP: an eight-ball knockout tournament =========================
// You and seven others in a bracket. You watch your own fights; the rest are
// played out instantly by the same sim. One of the seven is the defending
// champion, seeded in the other half, so if it goes to plan you meet in the final.
const CUP_FEE = 150;
const CUP_PRIZE = { champ: 1200, final: 400, semi: 150 };
const CUP_ROUNDS = ['QUARTERFINAL', 'SEMIFINAL', 'FINAL'];

// winner of a bracket fight, with a draw going to whoever has more health left
function cupWinner(S) {
  if (S.winner !== -1) return S.winner;
  const q = f => f.hp / f.maxHp;
  return q(S.F[0]) >= q(S.F[1]) ? 0 : 1;
}
function cupNew() {
  const lv = lvlOf(G.eq), seed = (Math.random() * 4294967296) >>> 0, r = rng(seed);
  const me = Math.floor(r() * 8), champ = (me < 4 ? 4 : 0) + Math.floor(r() * 4);
  const top = BALLS.filter(b => b.rar === 'L' || b.rar === 'M'), rest = BALLS.filter(b => b.id !== G.eq);
  const slots = [];
  for (let i = 0; i < 8; i++) {
    if (i === me) { slots.push({ me: true }); continue; }
    const pool = i === champ ? top : rest, b = pool[Math.floor(r() * pool.length)];
    slots.push({ id: b.id, lvl: clamp(i === champ ? lv + 2 : lv - 1 + Math.floor(r() * 3), 1, MAXLVL), name: ghostName(), champ: i === champ });
  }
  return { seed, me, slots, w: [], done: false, out: false, place: '', anim: -1, paid: false };
}
// who stands in slot i right now (you always fight with your current ball)
function cupWho(c, i) { const s = c.slots[i]; return s.me ? { id: G.eq, lvl: lvlOf(G.eq), name: NET.nameFor(null, myNick()), me: true } : s; }

function cupField(c, r) { return r === 0 ? [0, 1, 2, 3, 4, 5, 6, 7] : c.w[r - 1]; }
// your next fight: [round, your slot, their slot] or null
function cupNext(c) {
  if (!c || c.done || c.out) return null;
  const r = cupRoundOf(c), f = cupField(c, r), p = f.indexOf(c.me);
  return p < 0 ? null : [r, c.me, f[p ^ 1]];
}
// play out every other match of round r, given the winner of yours
function cupFinishRound(c, r, mine) {
  const f = cupField(c, r), w = [];
  for (let m = 0; m < f.length; m += 2) {
    const a = f[m], b = f[m + 1];
    if (a === c.me || b === c.me) { w.push(mine); continue; }
    const A = cupWho(c, a), B = cupWho(c, b);
    const S = runFight({ seed: (c.seed + r * 7919 + m * 131) >>> 0, a: { id: A.id, lvl: A.lvl }, b: { id: B.id, lvl: B.lvl } });
    w.push(cupWinner(S) === 0 ? a : b);

}
// a fight of yours ended (won, lost or left)
function cupRecord(F, quit) {
  const c = G.cup, nx = cupNext(c);
  if (!c || !nx || F.cupDone) return;
  F.cupDone = true; c.live = 0;
  const [r, me, them] = nx, won = !quit && cupWinner(F.S) === F.mySide;
  F.cupWon = won;
  cupFinishRound(c, r, won ? me : them);
  c.anim = r;
  if (!won) {
    c.out = true;
    c.place = r === 2 ? 'final' : r === 1 ? 'semi' : 'quarter';
    while (c.w.length < 3) { const rr = c.w.length; cupFinishRound(c, rr, -1); }   // the rest of the cup plays out
    c.done = true;
    const pay = r === 2 ? CUP_PRIZE.final : r === 1 ? CUP_PRIZE.semi : 0;
    if (pay) G.coins += pay;
    c.pay = pay;
  } else if (r === 2) {

    G.coins += CUP_PRIZE.champ; G.free.push('gimmick@cup'); G.cups = (G.cups || 0) + 1; c.ceremony = true;
  }

}

function cupAbandoned() {

}
function cupNote(F) {
  const c = G.cup;
  if (!c) return '';
  if (c.place === 'champ') return 'YOU WON THE BOX CUP!';
  if (c.done) return c.pay ? `Knocked out in the ${c.place === 'final' ? 'final' : 'semifinal'}. You take ${fmt(c.pay)} coins.` : 'Knocked out in the quarterfinal.';

}

  c.live = r + 1; save();     // if the page goes away mid-fight, that fight counts as lost
  startFight({ mode: 'cup', seed: (c.seed ^ (0x9e3779b9 + r * 104729)) >>> 0, mySide: 0, cupRound: r,
    me: { id: G.eq, lvl: lvlOf(G.eq), name: NET.nameFor(null, myNick()) }, foe: { id: foe.id, lvl: foe.lvl, name: foe.name, tro: 0 } });

// ===== medals, ball mastery, recent fights and the boss raid ===================

// ---- what every finished fight counts towards ------------------------------------
function trackFight(F, mine, draw, coins) {
  if (F.mode === 'friendly') return;
  const st = G.stats || (G.stats = {});
  st.fights = (st.fights || 0) + 1;
  const won = F.mode === 'cup' ? F.cupWon : F.mode === 'boss' ? F.bossKill : mine;
  if (won) {
    st.wins = (st.wins || 0) + 1;
    G.mast = G.mast || {};
    G.mast[F.me.id] = (G.mast[F.me.id] || 0) + 1;
    const f = F.S.F[F.mySide];
    if (f.hp >= f.maxHp - 0.01) st.flawless = (st.flawless || 0) + 1;
  }
  G.hist = G.hist || [];
  G.hist.unshift({ m: F.mode, a: F.me.id, b: F.foe.id, n: F.foe.name, r: F.mode === 'boss' && !won ? 'R' : draw && F.mode !== 'cup' ? 'D' : won ? 'W' : 'L', c: coins || 0, t: Date.now() });
  if (G.hist.length > 12) G.hist.length = 12;
}

// ---- instant replay: the same seed played again, the last few seconds in slow motion ----
function replayKO(F) {
  if (!F || F.replaying || !F.nf) return;
  F.replaying = true;
  const S = newFight(F.nf), from = Math.max(0, F.S.t - 3.4);
  while (S.t < from && !S.over) { step(S); S.ev.length = 0; }
  const wrap = F.root.querySelector('.arena');
  const cv = h('canvas', { class: 'replay', 'aria-label': 'Replay' });
  const tag = h('div', { class: 'rtag2' }, h('i'), 'REPLAY');
  const skip = h('button', { class: 'btn2 rskip', text: 'SKIP' });
  F.root.classList.add('replaying');
  wrap.append(cv, tag, skip);
  const A = new Arena(cv, { sound: true, pad: 8 });
  A.flip = F.arena.flip; A.me = F.arena.me; A.pop = 1;
  let acc = 0, t = 0, last = performance.now(), after = 0, done = false;
  const stop = () => { if (done) return; done = true; cv.remove(); tag.remove(); skip.remove(); F.root.classList.remove('replaying'); F.replaying = false; };
  skip.onclick = stop;
  const frame = now => {
    if (done || !cv.isConnected) { stop(); return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    A.resize();
    if (!S.over) { acc += dt * 0.45 * FIGHT_SPEED; while (acc >= DT && !S.over) { acc -= DT; step(S); A.events(S); } }
    else if ((after += dt) > 1.8) { stop(); return; }
    A.step(dt * (S.over ? 0.35 : 0.6)); A.draw(S, t);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

const BZ_SPIN = [2.0, 1.5], BZ_HOLD = [0.7, 0.9];

  const jitter = (Math.random() - 0.5) * seg * 0.6;

const ON_SITE = !(window.claude && window.claude.use) && /^https?:$/.test(location.protocol) && /^\/bounce-brawl(\.html)?\/?$/.test(location.pathname);

  MM.active = true; MM.stake = stake; MM.since = Date.now(); MM.match = null;

  MM.ghostAt = MM.since + (Q.has('ghost') ? +Q.get('ghost') : 5000 + Math.random() * 5000);
  NET.set({ st: 'q', stake, qt: Date.now(), want: null, mid: null, vs: null, res: null, ball: G.eq, lvl: lvlOf(G.eq), tro: G.tro });
  const status = h('p', { class: 'mmline', text: '' }), hint = h('p', { class: 'mmline', text: '' });
  const spin = h('canvas', { class: 'spin', width: 240, height: 240 });
  const s = sheet([
    spin, h('h2', { text: 'FINDING AN OPPONENT' }),
    h('div', { class: 'lsub', html: 'STAKE ' + COIN_SVG + ' <span class="mono">' + fmt(stake) + '</span> · WINNER TAKES <span class="mono">' + fmt(stake * (2 + WIN_BONUS)) + '</span>' }),
    status, hint,

function cancelMatch() {

}
function spinDraw(cv, t) {

  c.beginPath(); c.arc(60, 60, 40, 0, TAU); c.lineWidth = 1; c.strokeStyle = '#2a2a31'; c.setLineDash([3, 5]); c.stroke(); c.setLineDash([]);

function mmTick() {

    ui.hint.textContent = `MATCHING NEAR ${fmt(G.tro)} TROPHIES`;
  }
  // someone already started a fight with me?
  for (const p of peers) {
    const pr = p.presence;

  }

  if (!q.length) { if (NET.my.want) NET.set({ want: null }); return; }

  q.sort((a, b) => (Math.abs((+a.presence.tro || 0) - G.tro) - Math.abs((+b.presence.tro || 0) - G.tro)) || (a.peer < b.peer ? -1 : 1));

function safePick(pr) {

}
function beginMatch(p, mid) {
  const me = NET.me(), pr = p.presence;
  const friendly = !!p.isMe;
  const stake = friendly ? 0 : Math.min(MM.stake, Math.max(STAKES[0], +pr.stake || STAKES[0]));
  if (!friendly && G.coins < stake) { cancelMatch(); toast('Not enough coins for that stake'); return; }
  MM.match = { mid, peer: p.peer };
  clearInterval(MM.timer);
  NET.set({ st: 'm', mid, vs: p.peer, want: p.peer });
  if (MM.sheet) { const s = MM.sheet.s; MM.sheet = null; s.onclose = null; closeSheet(s); }
  const foe = Object.assign(safePick(pr), { name: NET.nameFor(p.by, pr.nick), tro: +pr.tro || 0 });
  const mine = { id: G.eq, lvl: lvlOf(G.eq), name: NET.nameFor(null, myNick()) };
  const mySide = me < p.peer ? 0 : 1;
  showVs(mine, foe, stake, friendly, hashStr(mid), () => {
    // both sides must have moved into the fight; otherwise go back to searching
    const q = NET.peers.find(x => x.peer === p.peer);
    if (!q || !q.presence || q.presence.mid !== mid) {
      MM.match = null;
      toast('The other player left. Searching again.');
      NET.set({ st: 'idle', mid: null, vs: null, want: null });
      findMatch(MM.stake);
      return false;

// ---- a stand-in opponent when no one else is queueing --------------------------------
const GH_A = ['Turbo', 'Sir', 'Lil', 'Big', 'Mr', 'Captain', 'Lord', 'Mega', 'Ultra', 'Sneaky', 'Wobbly', 'Salty', 'Crispy', 'Cosmic', 'Frosty', 'Lucky', 'Spicy', 'Dizzy', 'Shadow', 'Toasty', 'Rusty', 'Fuzzy', 'Silent', 'Grumpy'];
const GH_B = ['Bounce', 'Pickle', 'Noodle', 'Wombat', 'Gecko', 'Waffle', 'Comet', 'Biscuit', 'Moth', 'Otter', 'Pebble', 'Tofu', 'Rocket', 'Yeti', 'Llama', 'Nugget', 'Badger', 'Cactus', 'Donut', 'Raccoon', 'Kiwi', 'Taco', 'Penguin', 'Ferret'];
const GH_SOLO = ['zeke', 'mia', 'jaxon', 'lena', 'ollie', 'nova', 'kai', 'remy', 'ivy', 'theo', 'skye', 'finn', 'luca', 'ava', 'milo', 'juno', 'rex', 'ruby'];

  const r = a => a[Math.floor(Math.random() * a.length)], n = () => String(Math.floor(Math.random() * (Math.random() < 0.5 ? 100 : 10000)));
  switch (Math.floor(Math.random() * 6)) {
    case 0: return r(GH_A) + r(GH_B);
    case 1: return r(GH_A) + '_' + r(GH_B);
    case 2: return (r(GH_A) + r(GH_B)).toLowerCase() + n();
    case 3: return r(GH_SOLO) + n();
    case 4: { const s = r(GH_SOLO); return s[0].toUpperCase() + s.slice(1) + r(GH_B); }

}
function ghostMatch() {
  const seed = (Math.random() * 4294967296) >>> 0, mid = 'g' + seed.toString(36);
  MM.match = { mid, peer: null, ghost: true };
  clearInterval(MM.timer);
  NET.set({ st: 'm', want: null, mid: null, vs: null });
  if (MM.sheet) { const s = MM.sheet.s; MM.sheet = null; s.onclose = null; closeSheet(s); }
  // their ball: mostly ones a player at this level would have, a Mythic only rarely
  const pool = BALLS.filter(b => b.id !== G.eq && (b.rar !== 'M' || Math.random() < 0.15) && (b.rar !== 'S' || Math.random() < 0.03));
  const b = pool[Math.floor(Math.random() * pool.length)], lv = lvlOf(G.eq);
  const foe = { id: b.id, lvl: clamp(lv + Math.floor(Math.random() * 3) - 1, 1, MAXLVL), name: ghostName(), tro: Math.max(0, G.tro + Math.round((Math.random() - 0.5) * 90)) };
  const mine = { id: G.eq, lvl: lv, name: NET.nameFor(null, myNick()) };
  const stake = MM.stake, mySide = Math.random() < 0.5 ? 0 : 1;
  showVs(mine, foe, stake, false, seed, () => {

function showVs(me, foe, stake, friendly, seed, go) {
  const rule = RULES[ruleOf(seed)];

    h('div', { class: 'side you' }, h('div', { class: 'lab', text: 'You' }), ballImg(me.id, 200, ''), h('div', { class: 'who', text: me.name.toUpperCase() }), h('div', { class: 'bn', text: `${BALL[me.id].name} · LV ${me.lvl}` })),
    h('div', { class: 'side foe' }, h('div', { class: 'lab', text: 'Opponent' }), ballImg(foe.id, 200, ''), h('div', { class: 'who', text: foe.name.toUpperCase() }), h('div', { class: 'bn', text: `${BALL[foe.id].name} · LV ${foe.lvl}` })),
    h('div', { class: 'mark', text: 'VS' }),
    h('div', { class: 'potline' }, rule !== RULES.normal ? h('span', { class: 'vrule', text: `${rule.name.toUpperCase()} · ${rule.desc}` }) : null,
      h('span', { html: friendly ? 'FRIENDLY MATCH' : 'POT ' + COIN_SVG + ' ' + fmt(stake * 2) })));

    const ready = (MM.match && MM.match.ghost) || (q && q.presence && q.presence.mid === (MM.match && MM.match.mid));

// once both players have posted a result, make sure they agree
function checkPending() {
  if (!PENDING) return;
  if (Date.now() > PENDING.until) { PENDING = null; return; }
  const p = NET.peers.find(x => x.peer === PENDING.peer);
  const r = p && p.presence && p.presence.res;
  if (!r || r.mid !== PENDING.mid) return;
  if (r.h !== 'quit' && (r.w !== PENDING.w || r.h !== PENDING.h)) {
    // the two browsers disagree about the fight: undo it and return the stake
    G.coins += -(PENDING.coins || 0); G.tro -= PENDING.tro || 0;
    if (PENDING.w === -1) G.d--; else if (PENDING.w === PENDING.mySide) G.w--; else G.l--;

// ---- on BeeSide's site: the lobby is the server's /bb socket ------------------------
// It speaks the same calls as the artifact's room (presence, peers, onPeers),
// so the matchmaking above runs unchanged. The server hands every game's
// presence to the others; it never sees or runs a fight.
function WsRoom(url) {
  const others = new Map(), fns = [], uid = myUid();
  let ws = null, me = null, mine = {}, arr = [], wait = 1000;
  const build = () => {
    arr = (me ? [{ peer: me, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine, updatedAt: Date.now() }] : [])
      .concat([...others.values()].map(o => ({ peer: o.peer, by: null, isMe: !!(o.p.uid && o.p.uid === uid), sameTab: false, kind: 'viewer', guest: false, presence: o.p, updatedAt: o.at })));
    for (const f of fns) f({ peers: arr, joined: [], left: [], updated: [] });
  };
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { again(); return; }
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (!m || typeof m !== 'object') return;
      if (m.t === 'hello' && typeof m.id === 'string') {
        me = m.id; others.clear(); wait = 1000;
        for (const o of Array.isArray(m.peers) ? m.peers : []) if (o && typeof o.peer === 'string') others.set(o.peer, { peer: o.peer, p: o.p || {}, at: Date.now() });
        send({ t: 'p', p: mine });
        build();
      } else if (m.t === 'p' && typeof m.peer === 'string') { others.set(m.peer, { peer: m.peer, p: m.p && typeof m.p === 'object' ? m.p : {}, at: Date.now() }); build(); }
      else if (m.t === 'bye' && typeof m.peer === 'string') { others.delete(m.peer); build(); }
    };
    ws.onclose = () => { me = null; others.clear(); build(); again(); };
  }
  function again() { setTimeout(connect, wait); wait = Math.min(wait * 2, 30000); }
  setInterval(() => send({ t: 'ping' }), 20000);
  connect();
  return {
    presence(patch) { const v = Object.assign({}, mine, patch); for (const k in patch) if (patch[k] === null) delete v[k]; mine = v; send({ t: 'p', p: patch }); build(); return Promise.resolve(); },
    peers: () => arr,
    onPeers(fn) { fns.push(fn); setTimeout(() => fn({ peers: arr, joined: arr, left: [], updated: [] }), 0); return () => {}; },
    connected: () => !!(ws && ws.readyState === 1 && me),
  };
}
// the leaderboard: trophies from fights both players' games agreed on, kept by the server
let boardT = 0;
function fetchBoard() {
  if (!ON_SITE) return;
  clearTimeout(boardT);
  fetch('/api/brawl', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !Array.isArray(j.board)) return;
    NET.board = j.board.map(r => ({ id: String(r.id || ''), nick: r.name, tro: r.tro, w: r.w, l: r.l, ball: r.ball, lvl: r.lvl }));
    if (TAB === 'players' && !FIGHT) refreshLive();
  }).catch(() => {});
  boardT = setTimeout(fetchBoard, TAB === 'players' ? 20000 : 90000);
}

// ---- for testing in plain browser tabs: a stand-in room over BroadcastChannel ------
function LocalRoom() {
  const bc = new BroadcastChannel('bouncebrawl-local'), mine = { v: {} }, others = new Map(), fns = [];
  const myPeer = 'p' + Math.random().toString(36).slice(2, 10);
  let arr = [];
  const rebuild = () => { arr = [{ peer: myPeer, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine.v, updatedAt: Date.now() }, ...others.values()]; for (const f of fns) f({ peers: arr, joined: [], left: [], updated: [] }); };
  bc.onmessage = e => {
    const m = e.data;
    if (m.t === 'p') { others.set(m.peer, { peer: m.peer, by: null, isMe: !!Q.get('same'), sameTab: false, kind: 'viewer', guest: false, presence: m.p, updatedAt: Date.now(), seen: Date.now() }); rebuild(); }
    else if (m.t === 'bye') { others.delete(m.peer); rebuild(); }
  };
  setInterval(() => {
    bc.postMessage({ t: 'p', peer: myPeer, p: mine.v });
    const now = Date.now(); let ch = false;
    for (const [k, v] of others) if (now - v.seen > 4000) { others.delete(k); ch = true; }
    if (ch) rebuild();
  }, 600);
  addEventListener('pagehide', () => bc.postMessage({ t: 'bye', peer: myPeer }));
  rebuild();
  return {
    presence(patch) { const v = Object.assign({}, mine.v, patch); for (const k in patch) if (patch[k] === null) delete v[k]; mine.v = v; bc.postMessage({ t: 'p', peer: myPeer, p: v }); rebuild(); return Promise.resolve(); },
    peers: () => arr,
    onPeers(fn) { fns.push(fn); setTimeout(() => fn({ peers: arr, joined: arr, left: [], updated: [] }), 0); return () => {}; },
    connected: () => true,
  };
}

async function netInit() {
  if (Q.get('local')) { NET.room = LocalRoom(); NET.local = true; }
  else if (ON_SITE) {
    NET.room = WsRoom((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/bb');
    NET.uid = myUid().slice(0, 8);
    fetchBoard();
  }
  else if (window.claude && window.claude.use) {
    const safe = p => p.then(x => x, () => null);
    const [room, user, db] = await Promise.all([safe(claude.use('room')), safe(claude.use('user')), safe(claude.use('db'))]);
    NET.room = room; NET.user = user; NET.db = db;
  }
  NET.tried = true;
  if (NET.user) { try { NET.uid = await NET.user.id(); } catch (e) {} }
  if (NET.room) {
    NET.room.onPeers(ch => {
      NET.peers = ch.peers;
      resolveNames();
      if (MM.active) mmTick();
      checkPending();
      if (!FIGHT) refreshLive();
    }, () => { NET.room = null; refreshLive(); });
    NET.pushPresence();
  }
  if (NET.db && NET.uid) {
    try {
      const snap = await NET.db.doc('data/users/' + NET.uid + '/save').get();
      if (snap.exists) {
        const r = JSON.parse(snap.data().g);
        if (r && r.v === 1 && (r.t || 0) > (G.t || 0)) {
          G = Object.assign(freshSave(), r); applySettings(); save(); renderView();
          const w = document.getElementById('welcome'); if (w && G.starter) { closeSheet(w); welcome(); }
        }
      }
    } catch (e) {}
    try {
      NET.db.collection('board').orderBy('tro', 'desc').limit(20).onSnapshot(s => {
        NET.board = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
        resolveNames();
        if (TAB === 'players' && !FIGHT) refreshLive();
      }, () => {});
    } catch (e) {}
  }
  refreshLive();
}
// redraw the parts of the page that show who is online, without losing scroll
let liveT = 0;
function refreshLive() {
  clearTimeout(liveT);
  liveT = setTimeout(() => {
    if (FIGHT) return;
    renderOnline();
    if (document.querySelector('.ov:not(.closing)')) return;
    if (TAB === 'players') renderPanel(true);
    else if (TAB === 'fight') {
      const st = document.getElementById('fstatus'), btn = document.querySelector('.panel .go');
      if (st) st.replaceChildren(...statusBits(G.coins < STAKES[0]));
      if (btn) btn.disabled = G.coins < STAKES[0];
    }
  }, 250);
}
async function resolveNames() {
  if (!NET.user) return;
  const ids = new Set();
  for (const p of NET.peers) if (p.by) ids.add(p.by);
  for (const r of NET.board) ids.add(r.id);
  if (NET.uid) ids.add(NET.uid);
  if (!ids.size) return;
  try {
    const ps = await NET.user.profiles([...ids]);
    let changed = false;
    for (const id in ps) { const n = ps[id].name || ''; if (n && NET.names[id] !== n) { NET.names[id] = n; changed = true; } }
    if (changed) refreshLive();
  } catch (e) {}
}

// ---- start up -----------------------------------------------------------------
function applySettings() { SFX.sfx = G.sfx; SFX.music = G.music; ARENA_SKIN = SKINS[G.skin] && SKINS[G.skin].ok() ? G.skin : 'classic'; }
let lastFrame = 0;
function loop(ts) {
  const dt = Math.min(0.05, lastFrame ? (ts - lastFrame) / 1000 : 0.016);
  lastFrame = ts;
  if (FIGHT) fightFrame(FIGHT, dt);
  bgTick(dt);
  for (const p of [...PREVIEWS]) p.tick(dt);

  requestAnimationFrame(loop);
}

    h('div', { class: 'ib' }, h('i'), h('i'), h('b')),

  addEventListener('keydown', () => end(true), { once: true });
}

  addEventListener('pointerdown', wake, { once: true });
  addEventListener('keydown', wake, { once: true });
  addEventListener('keydown', onKey);
  // the way back to BeeSide, except inside Bee's Vault (#bv=1), which has its own close button
  if ((ON_SITE || window.BS_ROUTE) && !/(^|[#&])bv=1(&|$)/.test(location.hash)) $('#toBeeside').hidden = false;
  setTab('menu');
  cupAbandoned();
  intro();
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in ICON) delete ICON[k]; for (const k in CRATE_ICON) delete CRATE_ICON[k]; for (const k in PACK_ICON) delete PACK_ICON[k]; if (!FIGHT) renderView(); });
  if (!G.starter || !(G.named || G.nick)) setTimeout(welcome, REDUCED ? 300 : 1500);
  else setTimeout(whatsNew, REDUCED ? 300 : 1500);

// hooks for automated tests
window.BB = {
  get G() { return G; }, get net() { return NET; }, get fight() { return FIGHT; }, get mm() { return MM; },
  bot: (id, lvl) => { if (id) { G.owned[id] = G.owned[id] || { lvl: lvl || 1, copies: 0 }; G.eq = id; } botFight(true); return !!FIGHT; },
  skip: skipFight,
  run(secs) { const F = FIGHT; if (!F) return null; F.phase = 'run'; showBanner(F, ''); const end = F.S.t + secs; while (F.S.t < end && !F.S.over) { step(F.S); F.arena.events(F.S); F.arena.step(DT); } F.arena.draw(F.S, F.S.t); updatePlates(F); return { t: F.S.t, hp: F.S.F.map(f => Math.ceil(f.hp)), over: F.S.over }; },
  finish() { const F = FIGHT; if (!F) return null; skipFight(); fightFrame(F, 0.016); F.pt = 2; fightFrame(F, 0.016); return { winner: F.S.winner, coins: G.coins, tro: G.tro }; },

  tab: setTab, find: findMatch, cancel: cancelMatch, ball: openBall, ghost: ghostMatch, xp: addXp, daily: () => { ensureDaily(); return G.quests; },
