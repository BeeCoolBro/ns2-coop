<style>
:root { --bg: #050508; --panel: #0f0f1a; --border: #1e1e36; --accent: #00ffe7; --accent2: #ff2d78; --text: #d8d8f0; --muted: #6a6a90; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
html { overflow: hidden; }
body { overflow: auto; }
body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; font-family: 'Share Tech Mono', monospace;
  background: radial-gradient(ellipse at 50% 40%, rgba(0, 255, 231, .06), transparent 60%), var(--bg); }
.card { width: min(460px, 100%); text-align: center; padding: 36px 28px 30px; border: 1px solid var(--border); border-radius: 14px;
  background: linear-gradient(180deg, #11111d, var(--panel)); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: .12em; }
.logo b { color: var(--accent); font-weight: 900; text-shadow: 0 0 18px rgba(0, 255, 231, .5); }
.logo i { color: var(--accent2); font-style: normal; text-shadow: 0 0 18px rgba(255, 45, 120, .5); }
.lock { width: 64px; height: 64px; margin: 26px auto 18px; display: grid; place-items: center; border-radius: 16px;
  border: 1px solid rgba(0, 255, 231, .35); background: rgba(0, 255, 231, .05); box-shadow: 0 0 26px rgba(0, 255, 231, .15); }
.lock svg { width: 30px; height: 30px; }
h1 { font-family: 'Orbitron', sans-serif; font-size: 17px; letter-spacing: .14em; color: #fff; text-transform: uppercase; }
p { margin-top: 12px; font-size: 14px; line-height: 1.6; color: var(--muted); }
a.home { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; padding: 10px 18px; border-radius: 8px; text-decoration: none;
  font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .16em; color: var(--accent);
  border: 1px solid rgba(0, 255, 231, .4); background: rgba(0, 255, 231, .06); transition: background .2s, box-shadow .2s; }
a.home:hover, a.home:focus-visible { background: rgba(0, 255, 231, .12); box-shadow: 0 0 24px rgba(0, 255, 231, .25); outline: none; }
a.home svg { width: 14px; height: 14px; }
