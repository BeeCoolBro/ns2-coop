<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 5 - Bee's Vault</title>
<!-- GTA 5 needs cross-origin isolation (SharedArrayBuffer for its WASM threads).
     The vault's game window can't give it that, so it plays here: server.py sends
     this page with COOP/COEP, and the game frame is allowed cross-origin-isolated.
     Under COEP every cross-origin thing on the page must opt in, so the fonts are
     fetched with CORS (crossorigin) and there is nothing else from elsewhere. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" crossorigin>
<style>
:root { color-scheme: dark; --bg: #050508; --panel: #0f0f1a; --border: #1e1e36; --accent: #00ffe7; --text: #f0f0ff; --muted: #7070aa; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { display: flex; flex-direction: column; font-family: 'Share Tech Mono', ui-monospace, monospace; }
header { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 3px; cursor: pointer; text-decoration: none;
  font: 700 0.68rem/1 'Orbitron', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 1px solid var(--border); transition: color .15s, border-color .15s; }
.btn:hover, .btn:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
.btn svg { width: 13px; height: 13px; }
h1 { flex: 1; min-width: 0; margin: 0 6px; font: 900 0.95rem/1 'Orbitron', sans-serif; letter-spacing: 0.14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 small { margin-left: 10px; font: 400 0.7rem 'Share Tech Mono', monospace; letter-spacing: 0.08em; color: var(--muted); }
main { position: relative; flex: 1; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; display: block; }
#note { display: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 28px);
  padding: 10px 14px; border-radius: 4px; background: rgba(15,15,26,0.94); border: 1px solid var(--border); font-size: 0.78rem; line-height: 1.5; color: var(--muted); text-align: center; }
#note a { color: var(--accent); }
@media (max-width: 600px) { .btn .lbl, h1 small { display: none; } }
</style>
</head>
<body>
<header>
  <a class="btn" id="back" href="/vault"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span class="lbl">Bee's Vault</span></a>
  <h1>GTA 5<small>Port</small></h1>
  <button class="btn" id="fs" type="button" title="Fullscreen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg><span class="lbl">Fullscreen</span></button>
  <a class="btn" id="tab" href="https://gta2.deloskiyt.pl/" target="_blank" rel="noopener noreferrer" title="Open in a new tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h5v5M14 2 7 9M12 10v4H2V4h4"/></svg><span class="lbl">New tab</span></a>
</header>
<main>
  <div id="note"></div>
</main>
<script>
(function () {
  var GAME = 'https://gta2.deloskiyt.pl/';
  // ?mode=c: Chrome's credentialless iframe, for when the game's server doesn't
  // let an isolated page embed it (no Cross-Origin-Resource-Policy). It works in
  // Chrome and Edge only, and the game's storage then lasts one visit, so it may
  // download again each time; the plain frame is tried first.
  var compat = /[?&]mode=c\b/.test(location.search);
  var f = document.createElement('iframe');
  f.src = GAME;
  f.title = 'GTA 5';
  f.allow = 'cross-origin-isolated; fullscreen; autoplay; gamepad; keyboard-map; clipboard-read; clipboard-write';
  f.setAttribute('allowfullscreen', '');
  if (compat) f.setAttribute('credentialless', '');
  document.querySelector('main').appendChild(f);

  var note = document.getElementById('note');
  function say(html) { note.innerHTML = html; note.style.display = 'block'; }
  if (!window.crossOriginIsolated) {
    say('This page isn’t cross-origin isolated here, so the game can’t be either. <a href="' + GAME + '" target="_blank" rel="noopener noreferrer">Open it in a new tab</a>.');
  } else if (compat) {
    say('Compatibility mode (Chrome and Edge). <a href="/play/gta-5">Back to normal mode</a> · <a href="#" id="hide">Hide</a>');
  } else {
    // the frame can't tell us it was refused, so after a while offer the ways round it
    setTimeout(function () {
      say('Stuck or blank? Try <a href="/play/gta-5?mode=c">compatibility mode</a> (Chrome and Edge) or <a href="' + GAME + '" target="_blank" rel="noopener noreferrer">a new tab</a>. · <a href="#" id="hide">Hide</a>');
    }, 12000);
  }
  note.addEventListener('click', function (e) { if (e.target.id === 'hide') { e.preventDefault(); note.style.display = 'none'; } });

  document.getElementById('fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (f.requestFullscreen) f.requestFullscreen().catch(function () {});
  });
  // The keyboard only reaches the game while its frame has focus. Give it focus
  // when it loads, and take it back whenever it ends up on this page instead
  // (a click on the bar, a button, the note): a key pressed here is passed on
  // as focus, so at most that one key is lost.
  function toGame() { try { f.focus(); f.contentWindow && f.contentWindow.focus(); } catch (e) {} }
  f.addEventListener('load', toGame);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Tab' || e.target.closest && e.target.closest('a, button') && (e.key === 'Enter' || e.key === ' ')) return;
    toGame();
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a[href]:not(#hide)')) return;
    setTimeout(toGame, 0);
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(toGame, 50); });
})();
</script>
</body>
</html>
